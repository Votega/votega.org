<script src="assets/scripts/campaign-finance.js"></script>
<script>
  const RACES_URL       = 'assets/data/races.json';
  const GA_MEMBERS_URL  = 'assets/data/ga-members.json';
  const CONGRESS_URL    = 'assets/data/current-members.json';

  // Set when the member-data fetch itself fails (network/HTTP error), as
  // opposed to a memberId that's simply missing from a successfully-loaded
  // dataset — the two need different messaging on the incumbent card.
  let membersFetchFailed = false;

  // ── Campaign Finance comparison tab ─────────────────────────────────────────
  // Gather every active candidate in the active phase (across party ballots or
  // the flat list), resolving incumbent names from member data, into a shape the
  // shared CampaignFinance module can look up.
  function collectFinanceCandidates(race, members) {
    const phase = race.phases[race.activePhase];
    const raw = phase?.ballots ? Object.values(phase.ballots).flat() : (phase?.candidates || []);
    return raw
      .filter(c => !c.withdrawn && !c.disqualified)
      .map(c => {
        let displayName = c.name, party = c.party;
        if (c.type === 'incumbent' && (c.memberId || c.existingMemberId)) {
          const mid = c.existingMemberId || c.memberId;
          const m = race.level === 'federal'
            ? members.find(mb => mb.bioguideId === mid)
            : members.find(mb => mb.id === mid);
          if (m) {
            displayName = (m.firstName && m.lastName) ? `${m.firstName} ${m.lastName}`.trim() : (m.name || displayName);
            party = party || m.party || m.partyName;
          }
        }
        return {
          displayName,
          party,
          // For a federal incumbent the bioguide sits in memberId; findFecId and
          // the GA override key both read existingMemberId, so normalize it.
          lookup: { ...c, name: displayName, existingMemberId: c.existingMemberId || c.memberId },
        };
      });
  }

  // Build one horizontal comparison bar cell scaled to the column max.
  function finBarCell(value, max, cls) {
    if (value == null) return `<td class="fin-cell fin-empty">—</td>`;
    const pct = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
    return `<td class="fin-cell">
      <div class="fin-bar-track"><div class="fin-bar ${cls}" style="width:${pct}%"></div></div>
      <span class="fin-bar-value">${CampaignFinance.fmtMoney(value)}</span>
    </td>`;
  }

  function finNoteRow(cand, s, span) {
    const msg = s.status === 'ambiguous'
      ? `Multiple filings match — <a href="${s.searchUrl}" target="_blank" rel="noopener">search ${s.sourceShort} ↗</a>`
      : s.status === 'unavailable'
        ? 'Finance data unavailable'
        : `No ${s.sourceShort} filing on record — <a href="${s.searchUrl}" target="_blank" rel="noopener">search ↗</a>`;
    return `<td class="fin-cell fin-note" colspan="${span}">${msg}</td>`;
  }

  async function buildFinanceTable(race, members, container) {
    const cands = collectFinanceCandidates(race, members);
    if (!cands.length) {
      container.innerHTML = `<p class="no-candidates">No candidates to compare yet for this phase.</p>`;
      return;
    }

    // Resolve every candidate's finance summary in parallel.
    const rows = await Promise.all(cands.map(async c => ({ ...c, s: await CampaignFinance.summary(c.lookup, race) })));

    // One shared scale across every candidate AND all three metrics, so a bar's
    // width always means the same number of dollars — a wider bar is always more
    // money, whether it's in the Raised, Spent, or Cash column. (Per-column
    // scaling made a small Cash bar look wider than a larger Raised bar.)
    const maxAll = Math.max(0, ...rows.flatMap(r => [r.s.raised || 0, r.s.spent || 0, r.s.cashOnHand || 0]));

    // Sort by raised desc; candidates with no figures sink to the bottom.
    rows.sort((a, b) => (b.s.raised || -1) - (a.s.raised || -1));

    const sourceName = race.level === 'federal' ? 'the Federal Election Commission (FEC)' : 'the Georgia Ethics Commission (PeachFile)';

    const bodyRows = rows.map(r => {
      const pc = partyClass(r.party);
      const asOf = r.s.asOf ? `as of ${r.s.asOf}` : (r.s.status === 'ok' ? 'latest report' : '');
      const nameCell = `<th scope="row" class="fin-name">
          <span class="fin-name-main">${r.displayName || 'Unknown'}</span>
          <span class="party-badge ${pc}">${r.party || '—'}</span>
          ${asOf ? `<span class="fin-asof">${asOf}</span>` : ''}
        </th>`;
      if (r.s.status === 'ok') {
        return `<tr>${nameCell}
          ${finBarCell(r.s.raised, maxAll, 'fin-bar-raised')}
          ${finBarCell(r.s.spent, maxAll, 'fin-bar-spent')}
          ${finBarCell(r.s.cashOnHand, maxAll, 'fin-bar-cash')}
        </tr>`;
      }
      return `<tr class="fin-row-none">${nameCell}${finNoteRow(r, r.s, 3)}</tr>`;
    }).join('');

    container.innerHTML = `
      <div class="finance-table-wrap">
        <table class="finance-compare">
          <thead>
            <tr>
              <th scope="col">Candidate</th>
              <th scope="col">Raised</th>
              <th scope="col">Spent</th>
              <th scope="col">Cash on Hand</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      <p class="finance-disclaimer">
        Figures come from ${sourceName} and reflect each committee's most recent required report, so they may be several months old. All bars share one scale (the largest single figure in the table) so a wider bar always means more dollars. <strong>“No filing on record” means no report has been filed, not $0</strong>, and often reflects a candidate who hasn't begun formal fundraising${race.level === 'federal' ? '' : ' or filed before the 2026 PeachFile records begin'}.
      </p>`;
  }

  const raceId = new URLSearchParams(window.location.search).get('id');

  function getBasePath() {
    return window.location.pathname.includes('/votega.org-TEST/') ? '/votega.org-TEST/' : '/';
  }

  function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function partyClass(party) {
    if (!party) return 'party-other';
    const p = party.toLowerCase();
    if (p.includes('republican')) return 'party-R';
    if (p.includes('democrat'))   return 'party-D';
    return 'party-other';
  }

  function photoEl(url, name) {
    if (url) return `<img class="candidate-photo" src="${url}" alt="${name}">`;
    return `<div class="candidate-photo-placeholder">👤</div>`;
  }

  function renderIncumbentCard(candidate, member, race) {
    const basePath = getBasePath();
    const isState  = race.level === 'state';

    if (!member) {
      const message = membersFetchFailed
        ? 'Officeholder details are temporarily unavailable.'
        : 'Officeholder details are not available for this candidate.';
      return `
        <div class="candidate-card incumbent">
          <span class="role-badge role-incumbent">&#9733; Current Officeholder</span>
          <p><em>${message}</em></p>
        </div>`;
    }

    const name    = (member.firstName && member.lastName)
      ? `${member.firstName} ${member.lastName}`.trim()
      : (member.name || 'Unknown');
    const party   = member.party || member.partyName || '';
    const photo   = member.imageUrl || member.depiction?.imageUrl || '';
    const chamber = member.chamber || '';
    const district = member.district ?? '';

    const memberUrl = isState
      ? `${basePath}ga-member.html?id=${encodeURIComponent(member.id)}#votingHistory`
      : `${basePath}member.html?bioguideId=${encodeURIComponent(member.bioguideId)}#votingHistory`;

    const subtitle = [chamber, district ? `District ${district}` : ''].filter(Boolean).join(' · ');

    return `
      <div class="candidate-card incumbent">
        <span class="role-badge role-incumbent">&#9733; Current Officeholder</span>
        ${photoEl(photo, name)}
        <p class="candidate-name">${name}</p>
        <span class="party-badge ${partyClass(party)}">${party || 'Unknown party'}</span>
        ${subtitle ? `<p style="font-size:0.85rem;color:#555;margin:0 0 0.75rem 0;">${subtitle}</p>` : ''}
        ${candidate.bio ? `<p class="candidate-bio">${candidate.bio}</p>` : ''}
        <div class="candidate-links">
          <a href="${memberUrl}">View legislative record →</a>
          <a href="${basePath}candidate.html?raceId=${encodeURIComponent(race.id)}&memberId=${encodeURIComponent(candidate.existingMemberId || candidate.memberId)}&memberSource=${encodeURIComponent(candidate.existingMemberSource || candidate.memberSource || 'congress')}">View candidate profile →</a>
        </div>
      </div>`;
  }

  function renderChallengerCard(candidate) {
    const basePath = getBasePath();
    if (candidate.disqualified) {
      return `
        <div class="candidate-card challenger disqualified">
          <span class="role-badge role-disqualified">Disqualified</span>
          <p class="candidate-name">${candidate.name}</p>
          <span class="party-badge ${partyClass(candidate.party)}">${candidate.party || ''}</span>
        </div>`;
    }
    if (candidate.withdrawn) {
      return `
        <div class="candidate-card challenger withdrawn">
          <span class="role-badge role-withdrawn">Withdrawn</span>
          <p class="candidate-name">${candidate.name}</p>
          <span class="party-badge ${partyClass(candidate.party)}">${candidate.party || ''}</span>
        </div>`;
    }

    const isIncumbent  = !!candidate.isIncumbent;
    const cardClass    = isIncumbent ? 'candidate-card incumbent' : 'candidate-card challenger';
    const badgeClass   = isIncumbent ? 'role-badge role-incumbent' : 'role-badge role-challenger';
    const badgeLabel   = isIncumbent ? '&#9733; Current Officeholder' : 'Candidate';

    const profileUrl = `${basePath}candidate.html?id=${encodeURIComponent(candidate.id)}`;
    const websiteHtml = candidate.website
      ? `<a href="${candidate.website}" target="_blank" rel="noopener">Campaign website ↗</a>`
      : '';

    return `
      <div class="${cardClass}">
        <span class="${badgeClass}">${badgeLabel}</span>
        ${photoEl(candidate.imageUrl, candidate.name)}
        <p class="candidate-name">${candidate.name}</p>
        <span class="party-badge ${partyClass(candidate.party)}">${candidate.party || 'Unknown party'}</span>
        ${candidate.bio ? `<p class="candidate-bio">${candidate.bio}</p>` : ''}
        <div class="candidate-links">
          ${websiteHtml}
          <a href="${profileUrl}">View candidate profile →</a>
        </div>
      </div>`;
  }

  function candidateLastName(c, members, race) {
    if (c.type === 'incumbent') {
      const memberId = c.existingMemberId || c.memberId;
      const m = race.level === 'federal'
        ? members.find(mb => mb.bioguideId === memberId)
        : members.find(mb => mb.id === memberId);
      return m?.lastName || (m?.name || '').split(' ').pop() || '';
    }
    return (c.name || '').split(' ').pop();
  }

  function renderBallotSection(partyName, candidates, members, race) {
    const active    = candidates.filter(c => !c.withdrawn && !c.disqualified)
                                .sort((a, b) => candidateLastName(a, members, race)
                                                  .localeCompare(candidateLastName(b, members, race)));
    const withdrawn = candidates.filter(c => c.withdrawn || c.disqualified);

    const ballotClass = partyName.toLowerCase().includes('democrat')   ? 'ballot-D'
                      : partyName.toLowerCase().includes('republican') ? 'ballot-R'
                      : 'ballot-other';

    const cardsHtml = [...active, ...withdrawn].map(c => {
      const cMemberId = c.existingMemberId || c.memberId;
      if (c.type === 'incumbent' && cMemberId) {
        const member = race.level === 'federal'
          ? members.find(m => m.bioguideId === cMemberId)
          : members.find(m => m.id === cMemberId);
        return renderIncumbentCard(c, member, race);
      }
      return renderChallengerCard(c);
    }).join('');

    const emptyHtml    = !active.length && !withdrawn.length
      ? '<p class="no-candidates">No candidates listed yet for this ballot.</p>' : '';
    const unopposedHtml = active.length === 1 && race.activePhase !== 'general'
      ? '<p class="ballot-unopposed">Running unopposed in this primary</p>' : '';

    return `
      <div class="ballot-section">
        <span class="ballot-header ${ballotClass}">${partyName} Ballot</span>
        <div class="candidates-grid">${cardsHtml}</div>
        ${emptyHtml}${unopposedHtml}
      </div>`;
  }

  function renderRace(race, members) {
    const basePath   = getBasePath();
    const phase      = race.phases[race.activePhase];
    // "Runoff" stays generic — Georgia holds primary, general, and special-election
    // runoffs, and all three use the same `runoff` phase key. Labeling it
    // "Primary Runoff" mislabeled the GA-13 special-election runoff. Matches the
    // PHASE_META convention in elections.html.
    const phaseLabel = race.activePhase === 'primary' ? 'Primary'
                     : race.activePhase === 'runoff'  ? 'Runoff'
                     : 'General Election';
    const phaseClass = race.activePhase === 'primary' ? 'phase-primary'
                     : race.activePhase === 'runoff'  ? 'phase-runoff'
                     : 'phase-general';
    const distLabel  = race.district ? ` — District ${race.district}` : '';
    const raceTitle  = race.displayTitle || `${race.chamber}${distLabel}`;
    const dateStr    = phase ? formatDate(phase.electionDate) : '';

    // Open seat banner (shown when the previous officeholder is not running)
    const noteText = race._note ? race._note.replace(/^open seat\s*[—–-]+\s*/i, '') : '';
    const openSeatHtml = noteText
      ? `<div class="open-seat-banner">
           <span class="open-seat-label">Open Seat</span>
           <span>${noteText}</span>
         </div>`
      : '';

    // Related-contest cross-link (e.g. a concurrent special election for the same seat)
    const rel = race.relatedNote;
    const relatedHtml = rel && rel.text
      ? `<div class="race-related">
           <span>${rel.text}</span>${rel.url
             ? ` <a class="race-related-link" href="${rel.url}">${rel.label || 'Learn more'} &rarr;</a>`
             : ''}
         </div>`
      : '';

    // Build the tab panels. For an open primary these are the party ballots
    // (Democrat, Republican, …); otherwise a single "Candidates" list. The
    // Campaign Finance comparison is appended as one more peer tab — a single
    // unified tab bar, never a bar stacked on another bar.
    const panels = [];
    if (phase?.ballots) {
      const partyOrder = p => p.toLowerCase().includes('democrat') ? 0 : p.toLowerCase().includes('republican') ? 1 : 2;
      const sortedBallots = Object.entries(phase.ballots).sort((a, b) => partyOrder(a[0]) - partyOrder(b[0]));
      if (sortedBallots.length > 1) {
        sortedBallots.forEach(([partyName, candidates], i) => {
          const label = partyName.toLowerCase().includes('democrat')   ? 'Democrat'
                      : partyName.toLowerCase().includes('republican') ? 'Republican'
                      : partyName;
          panels.push({ id: `panel-p${i}`, label, html: renderBallotSection(partyName, candidates, members, race) });
        });
      } else {
        const [partyName, candidates] = sortedBallots[0] || ['', []];
        panels.push({ id: 'panel-cands', label: 'Candidates', html: renderBallotSection(partyName, candidates, members, race) });
      }
    } else {
      const candidates = phase?.candidates || [];
      const active     = candidates.filter(c => !c.withdrawn && !c.disqualified);
      const withdrawn  = candidates.filter(c => c.withdrawn || c.disqualified);
      const gridHtml = (!active.length && !withdrawn.length)
        ? '<p class="no-candidates">Candidate information not yet available for this phase.</p>'
        : `<div class="candidates-grid">` +
            [...active, ...withdrawn].map(c => {
              const cMemberId = c.existingMemberId || c.memberId;
              if (c.type === 'incumbent' && cMemberId) {
                const member = race.level === 'federal'
                  ? members.find(m => m.bioguideId === cMemberId)
                  : members.find(m => m.id === cMemberId);
                return renderIncumbentCard(c, member, race);
              }
              return renderChallengerCard(c);
            }).join('') + `</div>`;
      panels.push({ id: 'panel-cands', label: 'Candidates', html: gridHtml });
    }

    // Campaign Finance as a peer tab, lazily built on first open.
    if (collectFinanceCandidates(race, members).length) {
      panels.push({ id: 'panel-finance', label: 'Campaign Finance', kind: 'finance',
        html: '<p class="cand-finance-load">Loading campaign finance…</p>' });
    }

    document.title = `${raceTitle} — 2026 Elections`;

    const tabBar = panels.length > 1
      ? `<div class="race-tab-bar">` + panels.map((p, i) =>
          `<button class="race-tab-btn${i === 0 ? ' active' : ''}" data-panel="${p.id}"${p.kind ? ` data-kind="${p.kind}"` : ''}>${p.label}</button>`
        ).join('') + `</div>`
      : '';
    const panelsHtml = panels.map((p, i) =>
      `<div class="race-panel" id="${p.id}"${i === 0 ? '' : ' hidden'}>${p.html}</div>`
    ).join('');

    document.getElementById('raceContent').innerHTML = `
      <div class="race-header">
        <h1>${raceTitle}</h1>
        <div class="meta">
          <span class="phase-badge ${phaseClass}">${phaseLabel}</span>
          ${dateStr ? `Election date: ${dateStr}` : ''}
          &nbsp;·&nbsp; ${race.cycle} Election Cycle
        </div>
      </div>
      ${openSeatHtml}
      ${relatedHtml}
      ${tabBar}
      ${panelsHtml}
      <div class="back-link"><a href="${basePath}elections.html">← Back to Elections</a></div>`;

    // One unified tab handler for party ballots and Campaign Finance alike.
    // Syncs the active panel to location.hash (pushHistory on a real user
    // click, not on hash-driven restores) so browser Back steps through tab
    // switches instead of always landing back on the first panel.
    if (panels.length > 1) {
      let financeBuilt = false;
      const defaultPanelId = panels[0].id;

      const activatePanel = (panelId, pushHistory) => {
        const btn = document.querySelector(`.race-tab-btn[data-panel="${panelId}"]`);
        if (!btn) return false;
        document.querySelectorAll('.race-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.race-panel').forEach(p => { p.hidden = p.id !== panelId; });
        if (btn.dataset.kind === 'finance' && !financeBuilt) {
          financeBuilt = true;
          buildFinanceTable(race, members, document.getElementById('panel-finance'));
        }
        if (pushHistory && window.location.hash.slice(1) !== panelId) {
          history.pushState(null, '', '#' + panelId);
        }
        return true;
      };

      document.querySelector('.race-tab-bar').addEventListener('click', e => {
        const btn = e.target.closest('.race-tab-btn');
        if (!btn) return;
        activatePanel(btn.dataset.panel, true);
      });

      window.addEventListener('popstate', () => {
        activatePanel(window.location.hash.slice(1) || defaultPanelId, false);
      });

      if (window.location.hash) activatePanel(window.location.hash.slice(1), false);
    }
  }

  async function init() {
    if (!raceId) {
      document.getElementById('raceContent').innerHTML =
        '<p>No race specified. <a href="elections.html">View all races</a></p>';
      return;
    }

    try {
      const racesRes = await fetch(RACES_URL);
      if (!racesRes.ok) throw new Error(`HTTP ${racesRes.status}`);
      const racesData = await racesRes.json();
      const race = (racesData.races || []).find(r => r.id === raceId);

      if (!race) {
        document.getElementById('raceContent').innerHTML =
          '<p>Race not found. <a href="elections.html">View all races</a></p>';
        return;
      }

      // Load member data only if this race has incumbents in the active phase
      const phase = race.phases[race.activePhase];
      const allPhaseCandidates = phase?.ballots
        ? Object.values(phase.ballots).flat()
        : (phase?.candidates || []);
      const hasIncumbent = allPhaseCandidates.some(c => c.type === 'incumbent' && (c.memberId || c.existingMemberId));

      let members = [];
      if (hasIncumbent) {
        const memberUrl = race.level === 'federal' ? CONGRESS_URL : GA_MEMBERS_URL;
        try {
          const mRes = await fetch(memberUrl);
          if (mRes.ok) {
            const mData = await mRes.json();
            members = mData.members || [];
          } else {
            membersFetchFailed = true;
          }
        } catch (mErr) {
          console.error('race.html: member fetch failed', mErr);
          membersFetchFailed = true;
        }
      }

      renderRace(race, members);
    } catch (err) {
      console.error(err);
      document.getElementById('raceContent').innerHTML =
        `<p>Error loading race: ${err.message}. <a href="elections.html">Go back</a></p>`;
    }
  }

  init();
</script>
