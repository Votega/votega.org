<div id="pageLayout">
  <div id="memberDetails">
    <p>Loading member information...</p>
  </div>
  <div id="stateSidebar">
    <h2 id="sidebarTitle">State Delegation</h2>
    <div id="sidebarContent"></div>
  </div>
</div>

<div class="msg" id="status" role="alert"></div>

<p id="dataStamp" class="data-stamp"></p>

<script src="{{ '/assets/scripts/data-stamp.js' | relative_url }}"></script>
<script src="assets/scripts/campaign-finance.js"></script>
<script>
  const DEBUG = false;

  const urlParams = new URLSearchParams(window.location.search);
  const bioguideId = urlParams.get('bioguideId');

  if (!bioguideId) {
    document.getElementById('memberDetails').innerHTML = `<p>No member selected. <a href="${getBasePath()}federal-reps">Go back</a></p>`;
  } else {
    loadMemberDetails(bioguideId);
  }

  async function loadMemberDetails(bioguideId) {
    const DATA_URL = 'assets/data/current-members.json';
    const RACES_URL = 'assets/data/races.json';
    const statusLine = document.getElementById('status');
    statusLine.textContent = 'Loading member details…';

    try {
      const [membersRes, racesRes] = await Promise.all([
        fetch(DATA_URL),
        fetch(RACES_URL)
      ]);
      if (!membersRes.ok) throw new Error(`HTTP ${membersRes.status}`);

      const data = await membersRes.json();
      // Provenance stamp — see CODEBASE-REVIEW-2026-08-18.md finding 4.13.
      if (window.dataStamp) {
        window.dataStamp.render('dataStamp', {
          updated: (data.metadata || {}).generatedAt,
          source:  (data.metadata || {}).source || 'Congress.gov API',
        });
      }
      const allMembers = data.members || [];
      const member = allMembers.find(m => m.bioguideId === bioguideId);

      if (!member) {
        statusLine.textContent = '';
        document.getElementById('memberDetails').innerHTML =
          `<p>Member not found. <a href="${getBasePath()}federal-reps">Go back</a></p>`;
        return;
      }

      let electionInfo = null;
      let seatRace = null;
      if (racesRes.ok) {
        const racesData = await racesRes.json();
        electionInfo = findMemberInRaces(bioguideId, racesData.races || []);
        if (!electionInfo) seatRace = findSeatRace(member, racesData.races || []);
      }

      if (DEBUG) {
        console.log('Member data:', member);
        console.log('Election info:', electionInfo);
      }

      displayMemberDetails(member, electionInfo, seatRace);
      displaySidebar(member, allMembers);
      initTabs();
      loadCampaignFinance(member);
      loadKeyVotes(member);
      loadSponsoredLegislation(member);
      loadVotingHistory(member);
      if (window.location.hash) {
        const target = document.getElementById(window.location.hash.slice(1));
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      }
      statusLine.textContent = '';
    } catch (err) {
      console.error('loadMemberDetails()', err);
      const message = err.message.includes('HTTP') ?
        'Data file missing or inaccessible. Check that assets/data/current-members.json exists.' :
        err.message;
      statusLine.textContent = message;
      document.getElementById('memberDetails').innerHTML = `<p>Error loading details. <a href="${getBasePath()}federal-reps">Go back</a></p>`;
    }
  }

  function findSeatRace(member, races) {
    if (member.state !== 'Georgia') return null;
    const currentTerm = member.terms?.item?.slice(-1)[0] || {};
    const chamber = currentTerm.chamber || '';
    const isHouse  = chamber.includes('House');
    const isSenate = chamber.includes('Senate');
    return races.find(r => {
      if (r.level !== 'federal') return false;
      if (isHouse) return r.chamber === 'U.S. House' && r.district === member.district;
      if (isSenate) {
        if (r.chamber !== 'U.S. Senate') return false;
        // Georgia has two Senate seats in different cycles. Match if this member
        // is the listed incumbent in the race, OR is the seat holder (open seat case
        // where the senator isn't running but their seat is still on the ballot).
        if (r.incumbentBioguideId === member.bioguideId) return true;
        return ['primary', 'general'].some(phase => {
          const p = r.phases?.[phase];
          if (!p) return false;
          const candidates = p.ballots ? Object.values(p.ballots).flat() : (p.candidates || []);
          return candidates.some(c => c.type === 'incumbent' && c.memberId === member.bioguideId);
        });
      }
      return false;
    }) || null;
  }

  function findMemberInRaces(bioguideId, races) {
    for (const race of races) {
      for (const phaseName of ['primary', 'general']) {
        const phase = race.phases?.[phaseName];
        if (!phase) continue;

        const allCandidates = phase.ballots
          ? Object.values(phase.ballots).flat()
          : (phase.candidates || []);

        // Reelection: member is listed as incumbent in this race
        const asIncumbent = allCandidates.find(
          c => c.type === 'incumbent' && c.memberId === bioguideId && c.memberSource === 'congress'
        );
        if (asIncumbent) return { type: 'reelection', race, phase: phaseName };

        // Different office: member's bioguideId appears as existingMemberId on a challenger entry
        const asChallenger = allCandidates.find(
          c => c.type === 'challenger' && c.existingMemberId === bioguideId && c.existingMemberSource === 'congress'
        );
        if (asChallenger) return { type: 'different-office', race, phase: phaseName, challenger: asChallenger };
      }
    }
    return null;
  }

  function getBasePath() {
    const pathname = window.location.pathname;
    return pathname.includes('/votega.org-TEST/') ? '/votega.org-TEST/' : '/';
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Format a YYYY-MM-DD date without the UTC-to-local shift. new Date('YYYY-MM-DD')
  // is parsed as UTC midnight, which rolls back to the previous day in US
  // timezones — parsing the components directly keeps the calendar date intact.
  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
    if (!y || !m || !d) return '—';
    return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Became-law connector: presidential-laws.json is the index of every law
  // enacted this term (keyed by bill type+number), already carrying GovInfo
  // (GPO) authenticated-text fields. Both the sponsored-legislation and
  // voting-history sections join their bills against it at runtime. Fetched
  // once and cached; a missing/failed file just yields no connectors.
  let _enactedLawsPromise = null;
  function getEnactedLaws() {
    if (!_enactedLawsPromise) {
      _enactedLawsPromise = fetch(`${getBasePath()}assets/data/presidential-laws.json`)
        .then(r => (r.ok ? r.json() : null))
        .then(data => {
          const idx = new Map();
          for (const law of (data && data.laws) || []) {
            const key = lawKey(law.type, law.number);
            if (key) idx.set(key, law);
          }
          return idx;
        })
        .catch(() => new Map());
    }
    return _enactedLawsPromise;
  }

  // Canonical join key from a bill's type+number ("HR","8322" -> "hr8322") or
  // from a combined label ("S. 2" -> "s2"), so both sides normalize alike.
  function lawKey(type, number) {
    return String((type || '') + (number || '')).replace(/[.\s]/g, '').toLowerCase();
  }

  // Provenance a matched law contributes to a member's bill row.
  function lawConnector(law) {
    if (!law) return null;
    let pl = null, isPrivate = false;
    const pkg = (law.govinfoPackageId || '').match(/^PLAW-(\d+)(publ|pvtl)(\d+)$/);
    if (pkg) { pl = `${pkg[1]}-${pkg[3]}`; isPrivate = pkg[2] === 'pvtl'; }
    if (!pl) {
      const m = (law.actionText || '').match(/Became (Public|Private) Law No[:.]?\s*(\d+-\d+)/i);
      if (m) { pl = m[2]; isPrivate = /private/i.test(m[1]); }
    }
    return {
      plNumber: pl,
      isPrivate,
      signedDate: law.signingDate || law.lawDateIssued || null,
      officialPdfUrl: (law.gpoAuthenticated && law.officialPdfUrl) ? law.officialPdfUrl : null,
    };
  }

  // Stock-trade disclosures: ga-congress-trades.json lists only the GA members
  // who have actually filed any, each tagged with a bioguideId. Cached; used to
  // show the "View stock trades" link only for members who appear there.
  let _tradeMemberIdsPromise = null;
  function getTradeMemberIds() {
    if (!_tradeMemberIdsPromise) {
      _tradeMemberIdsPromise = fetch(`${getBasePath()}assets/data/ga-congress-trades.json`)
        .then(r => (r.ok ? r.json() : null))
        .then(data => {
          const ids = new Set();
          for (const entry of Object.values((data && data.byMember) || {})) {
            if (entry && entry.bioguideId) ids.add(entry.bioguideId);
          }
          return ids;
        })
        .catch(() => new Set());
    }
    return _tradeMemberIdsPromise;
  }

  async function gateStockTradesLink(member) {
    const el = document.getElementById('stockTradesLink');
    if (!el || !member || !member.bioguideId) return;
    const ids = await getTradeMemberIds();
    if (ids.has(member.bioguideId)) el.hidden = false;
  }

  function getMemberName(m) {
    const honorific = m.honorificName || '';
    const first = m.firstName || '';
    const last = m.lastName || '';
    const fallback = m.name || 'Unknown';
    return (first && last) ? `${honorific} ${first} ${last}`.trim() : (honorific ? `${honorific} ${fallback}` : fallback);
  }

  function displaySidebar(currentMember, allMembers) {
    const state = currentMember.state || currentMember.stateName;
    if (!state) return;

    const statemates = allMembers.filter(m =>
      (m.state === state || m.stateName === state) && m.currentMember !== false
    );

    if (statemates.length <= 1) return;

    // Only the most recent term counts — a member who switched chambers
    // (e.g. House then Senate) should only appear under their current chamber.
    function latestChamber(m) {
      const terms = m.terms?.item || m.terms || [];
      const arr = Array.isArray(terms) ? terms : [terms];
      return arr[arr.length - 1]?.chamber;
    }

    const senators = statemates
      .filter(m => latestChamber(m) === 'Senate')
      .sort((a, b) => getMemberName(a).localeCompare(getMemberName(b)));

    const reps = statemates
      .filter(m => latestChamber(m) === 'House of Representatives')
      .sort((a, b) => (a.district ?? 999) - (b.district ?? 999));

    const basePath = getBasePath();

    function renderGroup(members, label) {
      if (!members.length) return '';
      const items = members.map(m => {
        const name = escHtml(getMemberName(m));
        const isCurrent = m.bioguideId === currentMember.bioguideId;
        const sub = escHtml(m.district != null ? `District ${m.district} · ${m.partyName || ''}` : (m.partyName || ''));
        if (isCurrent) {
          return `<span class="sidebar-member current">${name}<br><span class="sidebar-member-sub">${sub}</span></span>`;
        }
        return `<a class="sidebar-member" href="${basePath}member.html?bioguideId=${encodeURIComponent(m.bioguideId)}">${name}<br><span class="sidebar-member-sub">${sub}</span></a>`;
      }).join('');
      return `<div class="sidebar-group-label">${escHtml(label)}</div>${items}`;
    }

    document.getElementById('sidebarTitle').textContent = `${state} Delegation`;
    document.getElementById('sidebarContent').innerHTML =
      renderGroup(senators, 'Senate') + renderGroup(reps, 'House');
    document.getElementById('stateSidebar').style.display = 'block';
  }

  function buildVoteChart(yea, nay, other, total) {
    if (total === 0) return '';
    const pct = n => Math.round((n / total) * 100);

    // SVG pie chart — handle 100% single-slice edge case
    const size = 88, cx = 44, cy = 44, r = 40;
    const slices = [
      { value: yea,   color: '#16a34a' },
      { value: nay,   color: '#dc2626' },
      { value: other, color: '#9ca3af' },
    ].filter(s => s.value > 0);

    let svgPaths = '';
    if (slices.length === 1) {
      svgPaths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${slices[0].color}"/>`;
    } else {
      let angle = -Math.PI / 2;
      for (const s of slices) {
        const sweep = (s.value / total) * 2 * Math.PI;
        const end   = angle + sweep;
        const x1 = (cx + r * Math.cos(angle)).toFixed(2);
        const y1 = (cy + r * Math.sin(angle)).toFixed(2);
        const x2 = (cx + r * Math.cos(end)).toFixed(2);
        const y2 = (cy + r * Math.sin(end)).toFixed(2);
        svgPaths += `<path d="M${cx},${cy}L${x1},${y1}A${r},${r} 0 ${sweep > Math.PI ? 1 : 0},1 ${x2},${y2}Z" fill="${s.color}"/>`;
        angle = end;
      }
    }

    const legendItems = [
      { label: 'Yea',   count: yea,   color: '#16a34a' },
      { label: 'Nay',   count: nay,   color: '#dc2626' },
      { label: 'Other', count: other, color: '#9ca3af' },
    ].filter(s => s.count > 0).map(s =>
      `<div style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;">
        <span style="width:11px;height:11px;border-radius:50%;background:${s.color};flex-shrink:0;display:inline-block;"></span>
        <span>${s.label}: <strong>${s.count}</strong> <span style="color:#777;">(${pct(s.count)}%)</span></span>
      </div>`
    ).join('');

    const footnote = other > 0
      ? `<p style="font-size:0.72rem;color:#888;margin:0.5rem 0 0 0;">* Other includes Not Voting, Absent, and Excused</p>`
      : '';

    return `<div>
      <div style="display:flex;align-items:center;gap:1.25rem;margin:0.75rem 0 0.4rem 0;">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">${svgPaths}</svg>
        <div style="display:flex;flex-direction:column;gap:0.45rem;">${legendItems}${footnote}</div>
      </div>
      <p style="font-size:0.72rem;color:#888;margin:0 0 1.25rem 0;max-width:32rem;">Most bills that reach a floor vote pass, so a chart weighted toward “Yea” is typical here and on other members' pages — it reflects which bills got a recorded vote, not this member's overall independence or party loyalty.</p>
    </div>`;
  }

  const DEFAULT_TAB = 'keyVotes';

  // Syncs the active tab to location.hash (pushHistory on a real user click,
  // not on hash-driven restores) so browser Back steps through tab switches
  // instead of always landing back on the default tab.
  function activateTab(tabId, pushHistory) {
    const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
    const panel = document.getElementById(tabId);
    if (!btn || !panel) return false;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    panel.classList.add('active');
    if (pushHistory && window.location.hash.slice(1) !== tabId) {
      history.pushState(null, '', '#' + tabId);
    }
    return true;
  }

  function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => activateTab(btn.dataset.tab, true));
    });
    window.addEventListener('popstate', () => {
      activateTab(window.location.hash.slice(1) || DEFAULT_TAB, false);
    });
    if (window.location.hash) activateTab(window.location.hash.slice(1), false);
  }

  function fmtMoney(n) {
    if (n == null) return '—';
    if (Math.abs(n) >= 1_000_000) return '$' + (n / 1_000_000).toFixed(1) + 'M';
    if (Math.abs(n) >= 1_000)     return '$' + Math.round(n / 1_000) + 'K';
    return '$' + Math.round(n).toLocaleString();
  }

  function memberLastName(member) {
    const raw = member.lastName || (member.name || '').split(',')[0] || '';
    return raw.toLowerCase().replace(/[^a-z]/g, '');
  }

  function findFecEntry(fecData, member) {
    // Same three-tier ladder as findFecId() in candidate.html.
    // 1. Bioguide ID — most reliable, but only present on enriched incumbents.
    const byBio = fecData.byBioguideId?.[member.bioguideId];
    if (byBio) return fecData.candidates?.[byBio] || null;

    // 2. District + last name — handles formal vs. nickname mismatches ("Michael" vs "Mike").
    const terms = Array.isArray(member.terms?.item) ? member.terms.item : [];
    const chamber = (terms.length ? terms[terms.length - 1].chamber : '') || '';
    let distKey = null;
    if (/senate/i.test(chamber))        distKey = 'S';
    else if (member.district != null)   distKey = `H${member.district}`;
    if (distKey && fecData.byDistrict?.[distKey]) {
      const last = memberLastName(member);
      const hits = fecData.byDistrict[distKey].filter(
        cid => fecData.candidates?.[cid]?.lastName === last
      );
      // Collect every hit and let the shared rule pick — .find() took the first,
      // resolving a same-surname collision by array order. Currently unreachable
      // (all 15 GA members resolve at step 1), but it is the same defect that put
      // another man's money on a candidate page.
      // See CODEBASE-REVIEW-2026-08-18.md finding 1.2.
      const narrowed = window.CampaignFinance?.narrowFecMatches
        ? window.CampaignFinance.narrowFecMatches(fecData, hits, member.name || '')
        : { id: hits.length === 1 ? hits[0] : null };
      if (narrowed.id) return fecData.candidates[narrowed.id];
    }
    return null;
  }

  async function loadKeyVotes(member) {
    const container = document.getElementById('keyVotes');
    if (!container || !member.bioguideId) return;

    const CURATED_URL  = 'assets/data/curated-federal-bills.json';
    const VOTES_URL    = 'assets/data/federal-member-votes.json';

    let curatedData, votesData;
    try {
      const [cRes, vRes] = await Promise.all([fetch(CURATED_URL), fetch(VOTES_URL)]);
      if (!cRes.ok || !vRes.ok) return;
      [curatedData, votesData] = await Promise.all([cRes.json(), vRes.json()]);
    } catch (err) {
      console.warn('Could not load key votes:', err);
      return;
    }

    const bills = curatedData.bills || [];
    if (!bills.length) return;

    const votesIndex   = votesData.votes || {};
    const memberVotes  = (votesData.memberVotes || {})[member.bioguideId] || [];
    const lawIdx       = await getEnactedLaws();  // enacted key votes -> GPO law PDF
    // Build quick lookup: voteId -> member's vote string
    const myVoteMap = {};
    for (const { voteId, vote } of memberVotes) myVoteMap[voteId] = vote;

    // Determine member chamber key
    const termsArr   = member.terms?.item || [];
    const latestTerm = (Array.isArray(termsArr) ? termsArr : [termsArr]).slice(-1)[0] || {};
    const chamberKey = (latestTerm.chamber || '').includes('House') ? 'House' : 'Senate';

    // Dem/Rep "Yea by party" bars from a roll call's partyTally (added by
    // generate_federal_votes_data.py). Same shape and markup as the GA page.
    function buildTallyBar(partyTally, result) {
      if (!partyTally) return '';
      const d = partyTally['Democratic'] || {}, r = partyTally['Republican'] || {};
      const dYea = d.yea || 0, dTotal = (d.yea || 0) + (d.nay || 0) + (d.other || 0);
      const rYea = r.yea || 0, rTotal = (r.yea || 0) + (r.nay || 0) + (r.other || 0);
      if (dTotal + rTotal === 0) return '';
      const dPct = dTotal ? Math.round(dYea / dTotal * 100) : 0;
      const rPct = rTotal ? Math.round(rYea / rTotal * 100) : 0;
      const caption = 'Yea votes by party' + (result ? ` · ${escHtml(result === 'Pass' ? 'Passed' : result === 'Fail' ? 'Failed' : result)}` : '');
      return `<div class="party-tally">
        <div style="font-size:0.72rem;color:#666;margin-bottom:0.3rem;">${caption}</div>
        <div class="tally-row"><span class="tally-label" style="color:#2563eb;">Dem</span><div class="tally-bar-track"><div class="tally-bar-fill-d" style="width:${dPct}%"></div></div><span class="tally-count">${dYea}/${dTotal} &nbsp;${dPct}%</span></div>
        <div class="tally-row"><span class="tally-label" style="color:#dc2626;">Rep</span><div class="tally-bar-track"><div class="tally-bar-fill-r" style="width:${rPct}%"></div></div><span class="tally-count">${rYea}/${rTotal} &nbsp;${rPct}%</span></div>
      </div>`;
    }

    const VOTE_DISPLAY = {
      'Yea':        { label: 'Voted Yea',      cls: 'kv-badge-yea'   },
      'Aye':        { label: 'Voted Yea',      cls: 'kv-badge-yea'   },
      'Nay':        { label: 'Voted Nay',      cls: 'kv-badge-nay'   },
      'No':         { label: 'Voted Nay',      cls: 'kv-badge-nay'   },
      'Not Voting': { label: 'Not Voting',     cls: 'kv-badge-other' },
      'Present':    { label: 'Voted Present',  cls: 'kv-badge-other' },
    };

    const cards = bills.map(bill => {
      const voteId   = (bill.voteIds || {})[chamberKey];
      const myVote   = voteId ? myVoteMap[voteId] : undefined;
      const voteInfo = myVote ? (VOTE_DISPLAY[myVote] || { label: myVote, cls: 'kv-badge-other' }) : null;
      const voteMeta = voteId ? votesIndex[voteId] : null;

      const voteBadge = voteInfo
        ? `<span class="kv-badge ${voteInfo.cls}">${voteInfo.label}</span>`
        : `<span class="kv-badge kv-badge-other">${voteId ? 'No record' : `${chamberKey === 'House' ? 'Senate' : 'House'} vote only`}</span>`;

      // Party breakdown: prefer the roll call's partyTally; fall back to the
      // overall Yea/Nay line when a tally isn't present yet (pre-regeneration).
      let tallyHtml = buildTallyBar(voteMeta && voteMeta.partyTally, voteMeta && voteMeta.result);
      if (!tallyHtml && voteMeta && (voteMeta.yea || voteMeta.nay)) {
        tallyHtml = `<span class="kv-tally"><strong>${voteMeta.yea}</strong> Yea · <strong>${voteMeta.nay}</strong> Nay · ${escHtml(voteMeta.result || '')}</span>`;
      }

      // Full text: enacted key votes -> the GPO-authenticated law PDF (via the
      // enacted-law index); otherwise the curated bill PDF (GovInfo), when set.
      const conn   = lawConnector(lawIdx.get(lawKey(bill.bill, '')));
      const pdfUrl = (conn && conn.officialPdfUrl) || bill.fullTextUrl || '';
      const textLink = pdfUrl
        ? `<a class="kv-text-link" href="${escHtml(pdfUrl)}" target="_blank" rel="noopener">Full text (PDF) →</a>`
        : '';

      return `<div class="kv-card">
        <div class="kv-card-header">
          <a class="kv-bill-id" href="${escHtml(bill.billUrl)}" target="_blank" rel="noopener">${escHtml(bill.bill)}</a>
          <span class="kv-bill-title">${escHtml(bill.title)}</span>
        </div>
        <div class="kv-summary">${escHtml(bill.summary)}</div>
        <div class="kv-footer">
          ${voteBadge}
          ${tallyHtml}
          ${textLink}
        </div>
      </div>`;
    }).join('');

    container.innerHTML = `
      <h2>Key Votes <small style="font-weight:normal;font-size:0.75rem;color:#666;">curated · 119th Congress</small></h2>
      <p style="font-size:0.8rem;color:#666;margin:0 0 1rem 0;">This member's votes on a selection of significant federal legislation.</p>
      ${cards}`;
  }

  async function loadVotingHistory(member) {
    const container = document.getElementById('votingHistory');
    if (!member.bioguideId || !container) return;

    const VOTES_URL = 'assets/data/federal-member-votes.json';
    try {
      const res = await fetch(VOTES_URL);
      if (!res.ok) return; // silently skip if file not yet generated

      const data        = await res.json();
      const memberVotes = (data.memberVotes || {})[member.bioguideId];
      if (!memberVotes || memberVotes.length === 0) {
        container.innerHTML = '<h2>Voting History</h2><p style="color:#666;font-size:0.875rem;">No votes recorded for this session.</p>';
        return;
      }

      const votesIndex = data.votes || {};
      const session    = data.metadata?.sessionName || '';
      const lawIdx     = await getEnactedLaws();  // every voted bill here is enacted law

      // Determine member chamber to conditionally show Motion column
      const termsArr  = member.terms?.item || [];
      const latestTerm = (Array.isArray(termsArr) ? termsArr : [termsArr]).slice(-1)[0] || {};
      const isHouse   = (latestTerm.chamber || '').includes('House');

      // Sort most recent first
      const sorted = [...memberVotes].sort((a, b) => {
        const da = (votesIndex[a.voteId] || {}).date || '';
        const db = (votesIndex[b.voteId] || {}).date || '';
        return db.localeCompare(da);
      });

      const voteClass = v => v === 'Yea' ? 'vote-yea' : v === 'Nay' ? 'vote-nay' : 'vote-other';

      // Vote breakdown chart
      let yeaCount = 0, nayCount = 0, otherCount = 0;
      for (const { vote } of sorted) {
        if (vote === 'Yea') yeaCount++;
        else if (vote === 'Nay') nayCount++;
        else otherCount++;
      }
      const chartHtml = buildVoteChart(yeaCount, nayCount, otherCount, sorted.length);

      const rows = sorted.map(({ voteId, vote }) => {
        const meta     = votesIndex[voteId] || {};
        const bill     = escHtml(meta.bill || '—');
        const title    = meta.title ? escHtml(meta.title) : '';
        const caption  = escHtml(meta.motionText || '—');
        const date     = fmtDate(meta.date);
        const billLink = meta.billUrl
          ? `<a href="${escHtml(meta.billUrl)}" target="_blank" rel="noopener">${bill}</a>`
          : bill;
        const conn = lawConnector(lawIdx.get(lawKey(meta.bill, '')));
        const lawLine = (conn && conn.officialPdfUrl)
          ? `<span class="vote-law-cell">${conn.plNumber ? `P.L. ${escHtml(conn.plNumber)} · ` : ''}<a href="${escHtml(conn.officialPdfUrl)}" target="_blank" rel="noopener">Official text (GPO) →</a></span>`
          : '';
        const billBase = title
          ? `${billLink}<br><span style="font-size:0.75rem;color:#555;font-weight:normal;">${title}</span>`
          : billLink;
        const billCell = billBase + lawLine;
        const motionCell = isHouse ? '' : `<td>${caption}</td>`;
        return `<tr>
          <td>${date}</td>
          <td>${billCell}</td>
          ${motionCell}
          <td class="${voteClass(vote)}">${escHtml(vote)}</td>
        </tr>`;
      }).join('');

      const motionHeader = isHouse ? '' : '<th>Motion</th>';
      container.innerHTML = `
        <h2>Voting History${session ? ` <small style="font-weight:normal;font-size:0.75rem;color:#666;">${session}</small>` : ''}</h2>
        <p style="font-size:0.8rem;color:#666;margin:0 0 0.75rem 0;">Showing votes on bills that were signed into law. Does not include votes on bills that failed, were vetoed, or are still pending.</p>
        ${chartHtml}
        <div style="overflow-x:auto;">
        <table class="vote-table">
          <thead><tr><th>Date</th><th>Bill</th>${motionHeader}<th>Vote</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>`;
    } catch (err) {
      console.warn('Could not load voting history:', err);
    }
  }

  function displayMemberDetails(member, electionInfo, seatRace) {
    const detailsDiv = document.getElementById('memberDetails');

    const honorific = member.honorificName || '';
    const firstName = member.firstName || '';
    const lastName = member.lastName || '';
    const fallbackName = member.name || 'Unknown';
    const fullName = (firstName && lastName)
      ? `${honorific} ${firstName} ${lastName}`.trim()
      : (honorific ? `${honorific} ${fallbackName}` : fallbackName);

    const party = member.partyName || (member.partyHistory && member.partyHistory.item ? member.partyHistory.item[0]?.partyName : 'N/A');
    const state = member.state || member.stateName || 'N/A';

    const currentTerm = member.terms?.item?.slice(-1)[0] || {};
    const chamber = currentTerm.chamber || 'N/A';

    document.title = `${fullName} — ${chamber === 'Senate' ? 'U.S. Senator' : 'U.S. Representative'}`;
    const district = (member.district !== null && member.district !== undefined)
      ? `District ${member.district}`
      : (chamber === 'Senate' ? 'U.S. Senator' : chamber === 'House of Representatives' ? 'At-Large' : 'N/A');

    const termsArr = member.terms?.item || [];
    const terms = Array.isArray(termsArr) ? termsArr : [termsArr];
    const startYears = terms.map(t => t.startYear).filter(y => typeof y === 'number');
    const startYear = startYears.length ? Math.max(...startYears) : 'N/A';
    const currentYear = new Date().getFullYear();
    const yearsInOffice = typeof startYear === 'number' ? (currentYear - startYear) : 'N/A';

    const imageUrl = member.depiction?.imageUrl;
    const imageHtml = imageUrl ? `<img src="${escHtml(imageUrl)}" alt="${escHtml(fullName)}" style="max-width: 200px; margin-bottom: 1rem; border-radius: 8px;">` : '';

    // Leadership positions
    const leadership = member.leadership || [];
    let leadershipHtml = '';
    if (leadership.length > 0) {
      const leadershipTitles = leadership.map(l => {
        const title = l.title || l.type || 'Unknown Position';
        const congress = l.congress ? ` (${l.congress}${l.current === true ? ', Current' : ''})` : '';
        return escHtml(`${title}${congress}`);
      }).join(', ');
      leadershipHtml = `<p><strong>Leadership Position(s):</strong> ${leadershipTitles}</p>`;
    }

    // Committees
    const committees = member.committees || [];
    let committeesHtml = '';
    if (committees.length > 0) {
      const committeeItems = committees.map(c => `<li>${escHtml(c)}</li>`).join('');
      committeesHtml = `<p><strong>Committees:</strong></p><ul>${committeeItems}</ul>`;
    }

    // Contact information
    const contactInfo = member.contactInfo || {};
    let contactHtml = '';
    if (contactInfo.phoneNumber || contactInfo.officeAddress) {
      const phone = contactInfo.phoneNumber ? `<br>📞 ${escHtml(contactInfo.phoneNumber)}` : '';
      let addressStr = contactInfo.officeAddress || '';
      if (addressStr) {
        const zip = contactInfo.zipCode ? String(contactInfo.zipCode) : '';
        if (zip && !addressStr.includes(zip)) {
          const city = contactInfo.city || '';
          const region = contactInfo.district || '';
          addressStr = [addressStr, city, region, zip].filter(Boolean).join(', ').replace(/, (\d{5})$/, ' $1');
        }
      }
      const address = addressStr ? `<br>📍 ${escHtml(addressStr)}` : '';
      contactHtml = `<p><strong>Office Contact:</strong>${address}${phone}</p>`;
    }

    // Official website
    const websiteHtml = member.officialWebsiteUrl ?
      `<p><strong>Official Website:</strong> <a class="url-text" href="${escHtml(member.officialWebsiteUrl)}" target="_blank">${escHtml(member.officialWebsiteUrl)}</a></p>` : '';

    // Running for office badge
    let runningBadgeHtml = '';
    if (electionInfo) {
      const basePath = getBasePath();
      const race = electionInfo.race;
      const distLabel = race.district ? ` District ${race.district}` : '';
      const raceLabel = escHtml(`${race.chamber}${distLabel}`);
      const raceUrl = `${basePath}race.html?id=${encodeURIComponent(race.id)}`;

      if (electionInfo.type === 'reelection') {
        runningBadgeHtml = `
          <div class="running-badge reelection">
            <strong>Running for Re-election</strong>
            This member is seeking re-election to their current seat.
            <a href="${escHtml(raceUrl)}">View ${raceLabel} race →</a>
          </div>`;
      } else if (electionInfo.type === 'different-office') {
        const candidateUrl = `${basePath}candidate.html?id=${encodeURIComponent(electionInfo.challenger.id)}`;
        runningBadgeHtml = `
          <div class="running-badge different-office">
            <strong>Running for a Different Office</strong>
            This member is seeking election to <strong>${raceLabel}</strong>.
            <a href="${escHtml(candidateUrl)}">View candidate profile →</a>
          </div>`;
      }
    } else if (seatRace) {
      const basePath  = getBasePath();
      const distLabel = seatRace.district ? ` District ${seatRace.district}` : '';
      const raceUrl   = `${basePath}race.html?id=${encodeURIComponent(seatRace.id)}`;
      runningBadgeHtml = `
        <div class="running-badge seat-election">
          <strong>This seat is up for election in ${escHtml(seatRace.cycle)}</strong>
          <a href="${escHtml(raceUrl)}">View ${escHtml(seatRace.chamber)}${escHtml(distLabel)} race →</a>
        </div>`;
    }

    // Prefer the full birth date from congress-legislators; fall back to the
    // Congress.gov birth year. Age is computed from the actual date when known.
    let bornHtml = '';
    if (member.birthday) {
      const bd = new Date(member.birthday + 'T00:00:00');
      const now = new Date();
      let age = now.getFullYear() - bd.getFullYear();
      const m = now.getMonth() - bd.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < bd.getDate())) age--;
      const fmt = bd.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      bornHtml = `<p style="display:flex;justify-content:space-between;"><span><strong>Born:</strong> ${escHtml(fmt)}</span><span><strong>Age:</strong> ${age}</span></p>`;
    } else if (member.birthYear) {
      bornHtml = `<p style="display:flex;justify-content:space-between;"><span><strong>Birth Year:</strong> ${member.birthYear}</span><span><strong>Age (as of ${currentYear}):</strong> ${currentYear - member.birthYear}</span></p>`;
    }

    // Reference-site profiles and official social accounts (from congress-legislators).
    const linkList = (items) => items.map(l =>
      `<a href="${escHtml(l.url)}" target="_blank" rel="noopener">${escHtml(l.label)} ↗</a>`).join(' &nbsp;·&nbsp; ');
    const extLinks = member.externalLinks || [];
    const externalLinksHtml = extLinks.length
      ? `<p><strong>Learn more:</strong> ${linkList(extLinks)}</p>` : '';
    const socLinks = member.socialLinks || [];
    const socialLinksHtml = socLinks.length
      ? `<p><strong>Social media:</strong> ${linkList(socLinks)}</p>` : '';

    const html = `
      ${imageHtml}
      <h1>${escHtml(fullName)}</h1>
      ${runningBadgeHtml}
      ${bornHtml}
      <p style="display:flex;justify-content:space-between;"><span><strong>First Term (Current Chamber):</strong> ${startYear}</span><span><strong>Years in Office:</strong> ${yearsInOffice}</span></p>
      <p><strong>Party:</strong> ${escHtml(party)} ${getPartyIconHtml(party)}</p>
      <p><strong>State:</strong> ${escHtml(state)}</p>
      <p><strong>District:</strong> ${escHtml(district)}</p>
      <p><strong>Chamber:</strong> ${escHtml(chamber)}</p>
      ${leadershipHtml}
      ${committeesHtml}
      ${contactHtml}
      ${websiteHtml}
      ${externalLinksHtml}
      ${socialLinksHtml}

      <p><a href="${getBasePath()}federal-reps">Search for another member</a></p>
      ${state === 'Georgia' ? `<p id="stockTradesLink" hidden><a href="${getBasePath()}ga-congress-trades.html?member=${encodeURIComponent((firstName && lastName) ? `${firstName} ${lastName}` : fallbackName)}">View stock trades by ${escHtml(fullName)} →</a></p>` : ''}
      <div id="campaignFinance" class="finance-section"></div>
      <div class="tab-container">
        <div class="tab-nav" role="tablist" aria-label="Voting record" data-tabs>
          <button class="tab-btn active" data-tab="keyVotes">Key Votes</button>
          <button class="tab-btn" data-tab="votingHistory">Voting History</button>
          <button class="tab-btn" data-tab="sponsoredLegislation">Sponsored Legislation</button>
        </div>
        <div id="keyVotes" class="tab-panel active"></div>
        <div id="votingHistory" class="tab-panel"></div>
        <div id="sponsoredLegislation" class="tab-panel"></div>
      </div>
    `;
    detailsDiv.innerHTML = html;
    // Tab bar is built here, after load — re-run the ARIA enhancer over it.
    if (window.a11yTabs) window.a11yTabs.scan(detailsDiv);
    // Reveal the stock-trades link only if this member has filed disclosures.
    gateStockTradesLink(member);
  }
</script>

<script src="{{ '/assets/scripts/a11y-tabs.js' | relative_url }}" defer></script>
