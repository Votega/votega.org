# ============================================================================
# COUNTY SYSTEMS — 159, exactly one per county
# ============================================================================
# Generated 2026-11-02 from the Georgia Civic Data `districts` dimension v1.2.0
# (GOSA codes; NCES CCD LEA directory SY 2025-26), filtered to
# district_type='standard' AND active=TRUE, minus the 21 city systems above.
# Sorted by district name. Regenerate rather than hand-edit if GOSA changes a
# code; the ids are the join key to everything else.
#
# ⚠ THREE CARRY CITY-STYLED NAMES and are COUNTY systems, not city ones:
#   Savannah-Chatham County (625, Chatham) · Griffin-Spalding County (726,
#   Spalding) · Thomaston-Upson County (745, Upson).
# This is why `type` is curated rather than inferred from the name.
#
# TO ADD A ROSTER: append `members:` to a district, following the role
# vocabulary and the Superintendent caveat documented in the header. Only
# name / role / seat / source are required per member; everything else can be
# filled later. One district per PR.
#
#   - id: "707"
#     name: Newton County
#     ...
#     board_size: 5
#     term_years: 4
#     partisan: false
#     official_url: "https://www.newton.k12.ga.us/board"
#     members:
#       - name: Jane Doe
#         role: Chair
#         seat: District 1
#         party: Nonpartisan
#         last_elected: 2024
#         next_election: 2028
#         source: "https://www.newton.k12.ga.us/board/members"
# ============================================================================

