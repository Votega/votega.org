# ============================================================================
# SCHOOL DISTRICTS — Georgia boards of education as a DOMAIN of a place
# ============================================================================
# A board of education is a SEPARATELY ELECTED body with its own meetings, its
# own millage rate and its own ESPLOST. It is not the county commission and not
# the city council, so — exactly like county_officers.yml (sheriffs) — its
# members are NEVER mixed into a local_officials.yml jurisdiction's `members:`
# list. It renders as its own section on /local/<slug>/.
#
# See docs/LOCAL-EXPANSION-SCOPE.md for the full scope, phasing and the research
# this file came out of.
#
# ----------------------------------------------------------------------------
# THE STRUCTURE OF GEORGIA SCHOOL DISTRICTS  (the reason this file is small)
# ----------------------------------------------------------------------------
#   Georgia has 180 active standard school districts:
#
#     159 COUNTY systems — exactly one per county, always. Every county has one,
#         no county has two. Enumerated under `countyDistricts` below, generated
#         2026-11-02 from the Georgia Civic Data districts dimension.
#
#         A county system carries NO `counties` list, unlike a city system: it is
#         1:1 with its county by definition, so the place it renders on is
#         derived from `countyFips`. Only the irregular city systems need an
#         explicit list. That also means adding a county to places.yml later
#         requires no edit here.
#
#      21 CITY systems — independent city school districts, sitting inside 20
#         counties. THIS is the irregular set, it is closed, it changes
#         essentially never, and it is the whole content of this file.
#
#   So the only hand-maintained fact about Georgia's school-district geography is
#   the 21 rows below. Everything else is mechanical.
#
#   Jackson County is the only county with two city systems (Commerce and
#   Jefferson) on top of its county system, for three districts in one county.
#
# ----------------------------------------------------------------------------
# DO NOT DERIVE `type` FROM THE DISTRICT NAME — IT DOES NOT WORK
# ----------------------------------------------------------------------------
#   Name is not a reliable signal in either direction:
#     - COUNTY systems with city-styled names: Savannah-Chatham County,
#       Griffin-Spalding County, Thomaston-Upson County.
#     - CITY systems with no "City" in the name: Atlanta Public Schools,
#       Dalton Public Schools, City Schools of Decatur.
#   `type` is therefore curated here, not inferred.
#
#   (GOSA district codes DO separate cleanly today — county systems occupy
#   601-759 and city systems 761-793 — but that is an accident of the numbering
#   and not a documented contract, so it is a cross-check, never the source.)
#
# ----------------------------------------------------------------------------
# `counties` IS A SERVICE AREA AND IT IS NOT THE SAME AS THE OFFICE'S COUNTY
# ----------------------------------------------------------------------------
#   The upstream NCES/GOSA dimension assigns each district ONE county: the county
#   its LEA office sits in. That is not its boundary. Atlanta Public Schools is
#   the clearest case — upstream it is a Fulton district, but APS serves part of
#   DeKalb too. A city school system's boundary is also NOT the city limits, and
#   the county system serves everything the city system does not.
#
#   So `counties` below is a HUMAN-CONFIRMED list of the places whose
#   /local/<slug>/ page should show this board, and it may be longer than the
#   upstream single-county assignment. It is a routing hint for page rendering.
#
#   It is NOT an answer to "which school board is mine?" — that is an ADDRESS
#   question, and it must be routed to an attendance-zone lookup, never answered
#   from this file. Do not build a place -> district promise on these rows.
#
#   EVERY SLUG BELOW RESOLVES. The 7 counties with a city system that were not
#   in places.yml (chattooga, floyd, haralson, jackson, laurens, mitchell,
#   toombs) are now registered there as `hidden: true` placeholders, so a
#   school-district validator CAN use the same strict slug cross-check
#   validate_local_officials.py uses. Keep it strict — an unresolvable slug here
#   is a typo, not a forward reference.
#
#   But a resolvable slug is NOT a visible place. A hidden place has no
#   /local/<slug>/ page, so the renderer must skip a board whose every listed
#   place is hidden rather than linking into a 404.
#
# ----------------------------------------------------------------------------
# FIELDS
# ----------------------------------------------------------------------------
#   id                  GOSA district_code, as a STRING (zero-padding matters).
#                       Chosen as the identity because it is the primary key of
#                       the Georgia Civic Data `districts` dimension, so
#                       enrollment, demographics and attendance zones join for
#                       free. Do not invent slugs.
#   name                District name, title case, as GOSA/NCES carries it.
#   type                city | county  (curated — see the warning above)
#   counties            Place slugs (places.yml) whose page shows this board.
#   primaryPlace        Optional. The place slug this board leads on, where the
#                       matching city is itself a place in places.yml.
#   districtCensusId    5-digit Census school-district code. For cross-dataset
#                       linking ONLY — it is not a county FIPS.
#   officeCountyFips    The upstream single-county assignment (the office's
#                       county). Recorded for provenance/cross-check; it is NOT
#                       the service area and must not drive rendering.
# ----------------------------------------------------------------------------
# ROLE VOCABULARY FOR BOARD MEMBERS  (validate_school_districts.py enforces it)
# ----------------------------------------------------------------------------
#   role:  Chair | Vice Chair | Board Member | Superintendent
#   party: Republican | Democratic | Independent | Nonpartisan
#
#   ⚠ GEORGIA LAW ALLOWS EITHER MODE, CHOSEN PER DISTRICT. State law permits a
#   school board to be elected in PARTISAN elections (party primaries nominate,
#   and nominees' party labels appear on the ballot) or in NONPARTISAN elections
#   (no primaries, no party labels).
#     https://ballotpedia.org/Party_labels_in_Georgia_school_board_elections
#   So `partisan` is a real per-district fact, not a workaround. Borne out by the
#   Secretary of State's 2024 general results: every county with a BOE contest
#   there returned party labels — Cobb, Jackson, Newton, Thomas and Whitfield are
#   all Dem/Rep — while three of eight counties sampled had no 2024 contest at all.
#
#   `party` must AGREE with the district's flag, exactly as local_officials.yml
#   does it: Nonpartisan is required when `partisan: false`, and a real party is
#   allowed only when it is not false. `Independent` means a member holding a
#   partisan seat with no party, so it is not valid on a nonpartisan board.
#
#   HOW TO TELL WHICH MODE A DISTRICT USES: look at its contest in the SoS
#   results. Party labels on the candidates means a partisan election; their
#   absence means a nonpartisan one. scripts/draft_school_boards.py derives this
#   and emits a `partisan:` suggestion with the evidence it used.
#
#   The commission vocabulary in local_officials.yml does not fit a school board —
#   it has no "Board Member" — so these four are the school-board set. Use `title`
#   for a district's own wording when it differs ("Board President", "Chairman"),
#   exactly as local_officials.yml does: `role` stays canonical because the UI
#   sorts and the presiding check key on it, `title` is display only.
#
#   ⚠ SUPERINTENDENT IS NOT AN ELECTED SEAT. Georgia local superintendents are
#   HIRED BY THE BOARD, not elected — the same situation as a City Manager, which
#   local_officials.yml documents and deliberately keeps out of its elected
#   roster. The role is available here because a reader looking at a board page
#   reasonably expects to see who the superintendent is, but a Superintendent row
#   MUST carry:
#       voting: false
#       last_elected:        (blank — there was no election)
#       next_election:       (blank)
#   and must never be counted against `board_size`. The validator enforces the
#   first and warns on the others. Recording an appointed officer as an elected
#   one would misrepresent who voters actually chose.
#
# ----------------------------------------------------------------------------
#   TERM FIELDS (members) — four DIFFERENT facts, all optional years:
#     last_elected   the year the member WON the seat (the election itself,
#                    even if unopposed). Not the year they were sworn in.
#     term_start     the first calendar year of the current term, usually
#                    last_elected + 1 (elected Nov/May, seated the next January).
#     term_end       the last calendar year in office, so a 4-year term is
#                    term_start .. term_start + 3 (end - start + 1 = term_years).
#     next_election  the election that fills the seat next, normally = term_end.
#   Example (4-year term, elected Nov 2024): last_elected 2024, term_start 2025,
#   term_end 2028, next_election 2028.
#   validate_school_districts.py WARNS (never fails) when these disagree, which is
#   how a term start entered as last_elected gets caught.
#
#   members             Board members, same shape as local_officials.yml. HUMAN-
#                       GATED and deliberately ABSENT until each roster is
#                       confirmed against a primary source — an empty or missing
#                       members list means "not yet researched", never "no board".
#
# ----------------------------------------------------------------------------
# PROVENANCE
# ----------------------------------------------------------------------------
#   District codes, names, Census IDs and office counties: Georgia Civic Data
#   `districts` dimension v1.2.0 (GOSA codes; NCES Common Core of Data LEA
#   directory, SY 2025-26), georgiacivicdata.org, CC BY 4.0, filtered to
#   district_type = 'standard' AND active = TRUE. Nothing here is scraped.
#
#   Rosters, when added, are human-gated per member with a `source` — same
#   contract as local_officials.yml and county_officers.yml.
#
#   CROSS-VALIDATED against an independent source: the Georgia DOR "County Ad
#   Valorem Tax Digest Millage Rates" report (PTS-R006-OD, 2023) carries an
#   `IND SCHOOL <CITY>` row for each independent city system, and its 21 distinct
#   systems match these 21 exactly. That report also lists a city system under
#   EACH county it serves, which is how the multi-county `counties` values here
#   were confirmed.
#
#   AUDITED 2026-11-02 against the millage dataset the phase-1a parser now builds
#   (scripts/generate_ga_millage.py, DOR Digest Consolidated Summaries 2020-2025,
#   districtType == city_school). It found exactly these 21 systems, and
#   CORRECTED FOUR of the `counties` lists below, each of which had been recorded
#   as single-county: Bremen (+carroll), Buford (+hall), Social Circle (+newton)
#   and Vidalia (+montgomery). Atlanta's fulton+dekalb was already right. The
#   five multi-county systems are therefore Atlanta, Bremen, Buford, Social
#   Circle and Vidalia.
#
#   Re-run that audit whenever a new DOR year is published — this is the only
#   source we have that encodes service area rather than office location.
# ============================================================================

