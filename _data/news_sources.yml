  #   entity: S001189
  - name: Rep. Andrew Clyde (GA-09, press)
    url: https://clyde.house.gov/news/rss.aspx
    type: official
    entity: C001116
  # - name: Rep. Mike Collins (GA-10, press)     # /rss.xml frozen (newest 2023-04)
  #   url: https://collins.house.gov/rss.xml
  #   type: official
  #   entity: C001129
  - name: Rep. Barry Loudermilk (GA-11, press)
    url: https://loudermilk.house.gov/feed/
    type: official
    entity: L000583
  - name: Rep. Rick Allen (GA-12, press)
    url: https://allen.house.gov/news/rss.aspx
    type: official
    entity: A000372
  # - name: Rep. Everton Blair (GA-13, press)    # /rss.xml frozen (newest 2025-01)
  #   url: https://blair.house.gov/rss.xml
  #   type: official
  #   entity: B001328
  # - name: Rep. Clay Fuller (GA-14, press)      # posts ARE current, but only as HTML
  #   url: https://fuller.house.gov/rss.xml       # at /media/press-releases; /rss.xml is a
  #   type: official                              # frozen Drupal default (static service pages,
  #   entity: F000485                             # 2025-01). Needs an HTML adapter, not RSS.

# Extra GA-relevance signals (place names, institutions) beyond a matched entity.
# An item from a non-ga_focused feed is kept only if it names a GA politician OR
# contains one of these.
ga_terms:
  - georgia
  - atlanta
  - savannah
  - augusta
  - macon
  - columbus
  - athens
  - cobb county
  - gwinnett
  - dekalb
  - fulton county
  - chatham
  - clayton county
  - general assembly
  - gold dome
  - peach state
  - buckhead
  - marietta
  - sandy springs
  - valdosta
  - gainesville

# Topic buckets: topic slug -> regex, matched case-insensitively on title+snippet.
# Single-quoted so YAML preserves the backslashes.
topics:
  elections:    '\b(elect|ballot|voter|\bvote|primary|runoff|campaign|candidat|\bpoll|redistrict|\brace\b)'
  ethics:       '\b(ethic|corrupt|indict|disclosure|conflict of interest|bribe|subpoena)'
  surveillance: '\b(flock|surveillance|license[- ]plate|\bcamera|privacy|data broker|facial recogn)'
  budget:       '\b(budget|\btax|revenue|spending|appropriat|surplus)'
  courts:       '\b(court|lawsuit|\bjudge|ruling|appeal|justice|\bsue[ds]?\b|litigat|verdict)'
  education:    '\b(school|student|teacher|education|university|college|classroom|curriculum)'
  healthcare:   '\b(medicaid|\bhealth|hospital|\baca\b|insurance|abortion|maternal)'
