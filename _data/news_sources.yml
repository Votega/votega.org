# Curated feeds for the Georgia political news hub.
# Consumed at build time by scripts/generate_ga_news.py -> assets/data/ga-news.json.
#
# Source policy (see CLAUDE.md "checked, not trusted"): this list is the audit
# surface for what the hub aggregates. Only headlines + a short excerpt are stored
# and every card links to the publisher; VoteGA never hosts article text.
#
# Google News RSS is deliberately NOT used: its feed is licensed "solely for...
# a personal feed reader for personal, non-commercial use", which does not fit a
# public site. Direct outlet + official feeds are the legally-safe base.
#
# Each feed:
#   name        display name shown on the card
#   url         RSS/Atom feed
#   type        outlet | official
#   ga_focused  true  -> feed is wholly GA politics; keep every item
#               false -> general feed; apply the GA-relevance gate (drops national
#                        wire copy, e.g. the States Newsroom syndication that makes
#                        up ~1/3 of the Georgia Recorder feed)
#   entity      OPTIONAL. An official's own press-release feed. The value is that
#               person's stable id in assets/data/id-crosswalk.json -- a vgId, a
#               federal member's bioguideId, or a state person's ocdPersonId.
#               Every item from the feed is force-tagged to that person (their
#               releases rarely name themselves in the headline), and the feed is
#               treated as ga_focused. Name-matching still runs on top.
feeds:
  - name: Georgia Recorder
    url: https://georgiarecorder.com/feed/
    type: outlet
    ga_focused: false
  - name: Capitol Beat
    url: https://capitol-beat.org/feed/
    type: outlet
    ga_focused: true
  - name: The Current GA
    url: https://thecurrentga.org/feed/
    type: outlet
    ga_focused: false
  - name: GPB News
    url: https://www.gpb.org/rss.xml
    type: outlet
    ga_focused: false
  # Rough Draft Atlanta (roughdraftatlanta.com/feed/) is behind Cloudflare bot
  # protection and returns 403 "Just a moment..." to a server-side fetch, so it is
  # not included. Revisit if a fetchable feed URL becomes available.
  - name: GA Secretary of State
    url: https://sos.ga.gov/rss.xml
    type: official
    ga_focused: true
    entity: ocd-person/02e75ac0-4350-4305-980e-8dc0462c5cc1  # Brad Raffensperger

  # --- Officials' press-release feeds (entity-bound) ------------------------
  # Each feed below is one official's own release feed, force-tagged to them via
  # `entity`. Scope is federal members + statewide executives (per-member feeds
  # do not exist for the 236 state legislators).
  #
  # The two Senate feeds use the standard WordPress category-feed path
  # (/press-releases/feed/) their sites are built on. The commented entries
  # below could not be verified from the build sandbox (its egress policy blocks
  # *.house.gov / *.georgia.gov); each needs its exact feed URL confirmed once,
  # then uncommented. Feeds that 404 are skipped by the generator, so an
  # enabled-but-wrong URL is non-fatal -- it just yields nothing until fixed.
  #   * Senate WordPress sites:  <host>/press-releases/feed/
  #   * House member sites:      listed at <host>/media-center/feeds (path varies)
  #   * GA executive (georgia.gov Drupal): press RSS is auto-generated; confirm
  #                              the feed URL on the agency's press-releases page.
  - name: Sen. Jon Ossoff (press)
    url: https://www.ossoff.senate.gov/press-releases/feed/
    type: official
    entity: O000174
  - name: Sen. Raphael Warnock (press)
    url: https://www.warnock.senate.gov/press-releases/feed/
    type: official
    entity: W000790
  # -- Statewide executives (georgia.gov Drupal; feed is <host>/rss.xml) --
  - name: Gov. Brian Kemp (press)
    url: https://gov.georgia.gov/rss.xml
    type: official
    entity: ocd-person/600e5c48-f5c0-4535-a219-60a5fd94c38f
  - name: Attorney General Chris Carr (press)
    url: https://law.georgia.gov/rss.xml
    type: official
    entity: ocd-person/57002bfc-2ba0-48cd-85d4-94673c5bf75a
  - name: Lt. Gov. Burt Jones (press)
    url: https://ltgov.georgia.gov/rss.xml
    type: official
    entity: ocd-person/ddfab174-3a42-42c0-946e-0ce3169c4d1b

  # -- U.S. House delegation --
  # Feed paths vary by the member site's platform (WordPress /feed/, the older
  # House CMS /news/rss.aspx, or /rss.xml). Every URL below was fetched and its
  # dates validated 2026-09-05. Members whose only reachable feed is a frozen
  # default template (newest item 2023-2025, swearing-in boilerplate) or has
  # unparseable dates are commented out with the reason -- re-enable if the
  # office starts maintaining a real feed. The generator skips a 404/dead feed,
  # so an enabled-but-later-broken URL is non-fatal.
  - name: Rep. Buddy Carter (GA-01, press)
    url: https://buddycarter.house.gov/news/rss.aspx
    type: official
    entity: C001103
  - name: Rep. Sanford Bishop (GA-02, press)
    url: https://bishop.house.gov/rss.xml
    type: official
    entity: B000490
  # - name: Rep. Brian Jack (GA-03, press)       # /rss.xml frozen (newest 2025-01)
  #   url: https://jack.house.gov/rss.xml
  #   type: official
  #   entity: J000311
  # - name: Rep. Hank Johnson (GA-04, press)     # /rss.xml stale (newest 2025-05)
  #   url: https://hankjohnson.house.gov/rss.xml
  #   type: official
  #   entity: J000288
  - name: Rep. Nikema Williams (GA-05, press)
