# Registry of Georgia counties running CivicPlus / CivicEngage, with the module
# coordinates each build-time generator needs. Checked, not trusted (same posture
# as open_data.yml): a county that reskins its site or renumbers its Agenda
# Center silently breaks the scrape. scripts/validate_county_meetings.py guards
# against that, and the update-county-civicplus workflow runs WEEKLY because the
# breaking change lands on the county's own server, not in this repo — a
# PR-only trigger could never catch it.
#
# Adding a county:
#   1. Confirm the platform is CivicPlus (footer credit "Government Websites by
#      CivicPlus", ASP.NET /AgendaCenter, /RSSFeed.aspx modules).
#   2. Discover its Agenda Center bodies from <base_url>/RSS.aspx — the Agenda
#      Center section lists one feed per body as ...?ModID=65&CID=<Name>-<catId>.
#   3. Fill base_url (no trailing slash) and the bodies map below.
#
# Fields
#   slug              short id; drives assets/data/county-<slug>-meetings.json
#   name / fips       display name and county FIPS (for future joins)
#   platform          civicplus — the only adapter today
#   base_url          site root, no trailing slash
#   agenda_module_id  CivicPlus module id for the Agenda Center (65 everywhere seen)
#   bodies            display name -> catId (the numeric suffix on the RSS CID).
#                     Meetings are parsed from the Agenda Center HTML and grouped
#                     by category header text; catId is kept for RSS/reference and
#                     lets the validator confirm expected bodies are present. A
#                     listed body with no posted meetings simply yields zero rows.

counties:
  - slug: newton
    name: Newton County
    fips: "13217"
    platform: civicplus
    base_url: https://www.newtoncountyga.gov
    agenda_module_id: 65
    bodies:
      Board of Commissioners: 2
      Board of Elections: 11
      Board of Zoning Appeals: 7
      Newton County Recreation Commission: 9
      Planning Commission: 5
      Solid Waste Authority: 6
