# Registry of Georgia local governments (counties and cities) VoteGA aggregates.
# One entry per PLACE; each declares its platform + per-domain config. Checked,
# not trusted (like open_data.yml): a place that reskins its site silently breaks
# the scrape — scripts/validate_place_meetings.py guards that, and
# update-local-government.yml runs WEEKLY because the break lands on the place's
# own server, not in this repo.
#
# See LOCAL-GOVERNMENT-IA.md for the full model. Platform-agnostic by design:
# Newton is CivicPlus, Covington will be CoreCode — the adapter
# (scripts/lib/<platform>.py) is chosen per domain, and every adapter normalizes
# to the SAME domain schema, so the page render never depends on the platform.
#
# Consumed by:
#   scripts/generate_place_meetings.py  -> assets/data/local-<slug>-meetings.json
#   scripts/validate_place_meetings.py  -> CI guard
#   scripts/generate_search_corpus.py   -> makes places searchable sitewide
#   scripts/build_entity_pages.py       -> /local/<slug>/ crawlable entity pages
#   local.html (via site.data.places)   -> the /local/ hub directory
#
# Fields
#   slug / name / type   identity; type is county | city
#   fips                 county FIPS (counties); null for cities
#   parentCounty         slug of the containing county (cities only; null for counties)
#   region               optional grouping label for the hub filter
#   hidden               optional; `true` keeps the place in this registry but
#                        omits it everywhere public — no hub card, no
#                        /local/<slug>/ page, no search entry. Flip it back to
#                        unhide. (The officials cross-check still sees the slug.)
#   domains              per-domain adapter config; supported domain today: meetings
#     meetings.platform  ADAPTER (scraped): civicplus | corecode | civicclerk |
#                        legistar | teammunicode | primegov
#                        NO-SCRAPER (recorded for provenance, skipped silently — the
#                        schedule / agendas_url still render, nothing is scraped):
#                          unknown  = platform not yet identified ("look into later")
#                          revize | wix | wordpress | granicus | governmentwindow |
#                          custom  = a real but adapter-less system (usually a
#                                     bespoke CMS that just lists agenda PDFs — e.g.
#                                     Bartow is Revize; `custom` = a hand-built page
#                                     with no CMS name, e.g. Bacon's PHP). Register in
#                                     NO_SCRAPER_PLATFORMS in generate_place_meetings.py
#                                     + validate_place_meetings.py before using it,
#                                     else it is flagged as a typo.
#                        Omitting platform entirely = a schedule-only place.
#       civicplus keys:  base_url (no trailing slash), agenda_module_id,
#                        bodies (display name -> catId; see <base_url>/RSS.aspx)
#       corecode keys:   base_url, meetings_path
#       civicclerk keys: subdomain (the <sub> in <sub>.api.civicclerk.com)
#       legistar keys:   client (the <client> in webapi.legistar.com/v1/<client>/Events)
#       teammunicode keys: base_url (the <sub>.teammunicode.com Municode Meetings
#                        origin; often iframe-embedded on the county's own site, so
#                        the county's CivicPlus Agenda Center is an empty stub —
#                        Banks, Baldwin). `body` is the section CODE from a meeting's
#                        detail link (boc, commissioners, bc-pc, planning-development
#                        — varies per county), so ALWAYS scope with a body_map that
#                        allow-lists + relabels those codes (check the codes first).
#       primegov keys:   base_url (the <sub>.primegov.com origin; JSON API at
#                        /api/v2/PublicPortal/List{Upcoming,Archived}Meetings). `body`
#                        is the numeric committeeId — a single-committee county
#                        (Clayton) uses body_label; a multi-committee one needs a
#                        body_map on the committee ids.
#     Body scoping (any platform, optional) — POLICY: publish the legislative and
#     land-use bodies (Board of Commissioners + Planning Commission + zoning
#     boards, where rezonings / data centers are heard); drop administrative
#     bodies (Elections & Registration, Recreation, Solid Waste / utility
#     authorities):
#       include_bodies   allow-list; keep meetings whose body contains one of these
#       exclude_bodies   drop meetings whose body contains one of these
#       body_label       relabel every kept meeting to this single body name
#       body_map         ordered [{match,label}] for sources that store the meeting
#                        TYPE in the body field (Cobb, Douglas): first matching
#                        rule renames the body; unmatched meetings are DROPPED
#                        (allow-list + rename). Supersedes the three keys above.
#       body_from        which field the above matching reads: body (default) or
#                        title. For Agenda Centers grouped by document type
#                        ("Agendas"/"Minutes") the real body is only in the title
#                        (Banks) — body_from: title + a body_map keeps just the BoC.
#
# OFFICIALS is a domain too, but it is NOT configured here — a place "has
# officials" automatically when a jurisdiction in _data/local_officials.yml
# shares this place's `slug`. It is the PRECEDENCE domain: it renders first on
# /local/<slug>/. Onboard officials-first — a place may have officials and no
# meetings adapter yet (that's fine; the meetings pipeline just skips it).

places:
  - slug: appling
    name: Appling County
    type: county
    fips: "13001"
    parentCounty: null
    region:                         # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/appling/.
        # Fill when: (and optional location:) per body. No scraper adapter needed
        # for a schedule; add a platform (civicplus|corecode|civicclerk) later to
        # auto-aggregate agendas/minutes (see the places.yml header).
        platform: wordpress
        base_url: https://applingcountyga.org/
        agendas_url: "https://applingcountyga.org/?page_id=98"            # direct agenda/minutes hub (optional; works with or without a scraper adapter)
        schedule:
          - body: Board of Commissioners
            when: "1st Tuesday of every month, 5:30 p.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Appling County Courthouse Annex, Commissioners' Meeting Room, 69 Tippins Street, Baxley"            # optional

