        # auto-aggregate agendas/minutes (see the places.yml header).
        platform: primegov   # PrimeGov JSON API (claytoncountyga.primegov.com)
        base_url: https://claytoncountyga.primegov.com
        agendas_url: "https://claytoncountyga.primegov.com/public/portal?fromiframe=true"            # direct agenda/minutes hub (optional; works with or without a scraper adapter)
