  # CivicClerk prototype (JSON API, not HTML). Douglas is on the newer CivicPlus
  # platform whose Agenda Center is JS-rendered — the classic civicplus adapter
  # gets nothing, so meetings come from the CivicClerk OData API instead. Same
  # adapter will cover Cobb, Henry, and other GA CivicClerk counties.
  - slug: douglas
    name: Douglas County
    type: county
    fips: "13097"
    parentCounty: null
    region: Atlanta Regional Commission
    domains:
      meetings:
        platform: civicclerk
        base_url: https://www.douglascountyga.gov/323/Board-of-Commissioners
        schedule:
          - body: Board of Commissioners
            when: "1st and 3rd Tuesday of every month, 10:00 a.m."
            location: "Citizens Hall, Douglas County Courthouse, 8700 Hospital Drive, Douglasville"
        subdomain: douglascountyga
        # CivicClerk stores the meeting type in categoryName. Map to clean bodies:
        # the joint zoning sessions -> Planning & Zoning; pure BOC and the "General"
        # bucket (BOC special-called / millage / joint) -> Board of Commissioners.
        # (Order matters: "Planning & Zoning / Board of Commissioners" must match
        # the Planning & Zoning rule first.)
        body_map:
          - { match: "Planning & Zoning", label: "Planning & Zoning" }
          - { match: "Board of Commissioners", label: "Board of Commissioners" }
          - { match: "General", label: "Board of Commissioners" }

