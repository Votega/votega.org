        # Fill when: (and optional location:) per body. No scraper adapter needed
        # for a schedule; add a platform (civicplus|corecode|civicclerk) later to
        # auto-aggregate agendas/minutes (see the places.yml header).
        platform: wordpress
        base_url: https://atkinsoncounty.org/
        agendas_url: "https://atkinsoncounty.org/agenda/"            # direct agenda/minutes hub (optional; works with or without a scraper adapter)
        schedule:
          - body: Board of Commissioners
            when: "2nd Friday of every month, 5:00 p.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Board of Commissioners Conference Room"            # optional

