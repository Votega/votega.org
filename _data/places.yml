        platform: revize   # Revize CMS (no scraper adapter) — agendas are PDFs on the page
        base_url: https://www.bartowcountyga.gov/index.php
        agendas_url: "https://www.bartowcountyga.gov/departments/county_commissioner/public_meeting_minutes/index.php"            # direct agenda/minutes hub (optional; works with or without a scraper adapter)
        schedule:
          - body: Board of Commissioners
            when: "1st Wednesday of every month, 10:00 a.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Commissioner’s Conference Room, 135 W. Cherokee Avenue, Cartersville"            # optional
  
  - slug: cherokee
    name: Cherokee County
    type: county
    fips: "13057"
    parentCounty: null
    region: Atlanta Regional Commission                         # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/cherokee/.
        # Fill when: (and optional location:) per body. No scraper adapter needed
