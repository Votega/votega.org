    type: county
    fips: "13217"
    parentCounty: null
    region: Broader Metropolitan Statistical Area
    domains:
      meetings:
        platform: civicplus
        base_url: https://www.newtoncountyga.gov
        agenda_module_id: 65
        exclude_bodies:                 # keep BOC + Planning + Zoning Appeals;
          - Recreation                  # drop the administrative bodies
          - Solid Waste
        bodies:
          Board of Commissioners: 2
          Board of Elections: 11
          Board of Zoning Appeals: 7
          Newton County Recreation Commission: 9
          Planning Commission: 5
          Solid Waste Authority: 6
        # Curated recurring schedule shown as a "When they meet" note on the page.
        # Fill `when:` (and optional `location:`) for each body. Blank entries are
        # hidden; the whole note disappears if none are filled. Not scraped — confirm
        # against the county's posted notices and update when they change.
        schedule:
          - body: Board of Commissioners
            when: "1st & 3rd Tuesday, 7:00 p.m."
            location: "Historic Courthouse, 1124 Clark Street, Covington"
          # - body: Planning Commission
          #  when: "4th Tuesday of every month, 7:00 p.m."
          #  location: "3rd Floor Boardroom, Historic Courthouse, 1124 Clark Street, Covington"
          # - body: Board of Zoning Appeals
          #  when: "4th Thursday of every month, 7:00 p.m."
          #  location: "3rd Floor Boardroom, Historic Courthouse, 1124 Clark Street, Covington"
          # - body: Newton County Recreation Commission
          #   when: ""
          # - body: Solid Waste Authority
          #  when: "2nd Thursday of every month, 5:30 p.m."
          #  location: "Commissioners' Boardroom, Historic Courthouse, 1124 Clark Street, Covington"

  - slug: covington
    name: City of Covington
    type: city
    fips: null
    parentCounty: newton
    region: Metro Atlanta
    domains:
      meetings:
        # CoreCode CMS: a flat council-meetings table (minutes PDFs + Vimeo
        # recordings; no agendas published). See scripts/lib/corecode.py.
        platform: corecode
        base_url: https://www.cityofcovington.org
        meetings_path: "/index.php?section=Council-Meetings"
        # Fill `when:` to show a "When they meet" note (see Newton for the shape).
        schedule:
          - body: City Council
            when: "1st and 3rd Monday, 6:30 p.m."
            location: "Council Room, 2116 Stallings Street, Covington"

  # CivicClerk prototype (JSON API, not HTML). Douglas is on the newer CivicPlus
  # platform whose Agenda Center is JS-rendered — the classic civicplus adapter
  # gets nothing, so meetings come from the CivicClerk OData API instead. Same
  # adapter will cover Cobb, Henry, and other GA CivicClerk counties.
  - slug: douglas
    name: Douglas County
    type: county
    fips: "13097"
    parentCounty: null
    region: Atlanta Regional Commission
    domains:
      meetings:
        platform: civicclerk
        base_url: https://www.douglascountyga.gov/323/Board-of-Commissioners
        schedule:
          - body: Board of Commissioners
            when: "1st and 3rd Tuesday of every month, 10:00 a.m."
            location: "Citizens Hall, Douglas County Courthouse, 8700 Hospital Drive, Douglasville"
        subdomain: douglascountyga
        # CivicClerk stores the meeting type in categoryName. Map to clean bodies:
        # the joint zoning sessions -> Planning & Zoning; pure BOC and the "General"
        # bucket (BOC special-called / millage / joint) -> Board of Commissioners.
        # (Order matters: "Planning & Zoning / Board of Commissioners" must match
        # the Planning & Zoning rule first.)
        body_map:
          - { match: "Planning & Zoning", label: "Planning & Zoning" }
          - { match: "Board of Commissioners", label: "Board of Commissioners" }
          - { match: "General", label: "Board of Commissioners" }

  - slug: henry
    name: Henry County
    type: county
    fips: "13151"
    parentCounty: null
    region: Atlanta Regional Commission
    domains:
      meetings:
        platform: civicclerk
        schedule:
          - body: Board of Commissioners
            when: "1st Tuesday of every month, 9:00 a.m. and 3rd Tuesday of every month, 6:30 p.m."
            location: "Henry County Administration Building Community Room, 140 Henry Parkway, McDonough"
        subdomain: henrycoga            # NB: not "henrycountyga" (that api host 404s)
        # Bodies arrive clean (Board of Commissioners, Zoning Advisory Board) and
        # both are kept — no administrative bodies to drop.

  - slug: cobb
    name: Cobb County
    type: county
    fips: "13067"
    parentCounty: null
    region: Atlanta Regional Commission
    domains:
      meetings:
        platform: civicclerk
        schedule:
          - body: Board of Commissioners
            when: "2nd Tuesday of every month, 9:00 a.m. and 4th Tuesday of every month, 7:00 p.m."
            location: "Public Meeting Room, 100 Cherokee Street, Marietta"
        subdomain: cobbcoga
        # Cobb stores the meeting TYPE in CivicClerk's categoryName. Map to clean
        # bodies; drop administrative ones (Board of Elections & Registration, the
        # Solid Waste authority "SWMA") by leaving them unmapped.
        body_map:
          - { match: "Planning Commission", label: "Planning Commission" }
          - { match: "Zoning Appeals", label: "Board of Zoning Appeals" }
          - { match: "BOC", label: "Board of Commissioners" }
          - { match: "1:30 Work Session", label: "Board of Commissioners" }
          - { match: "Special Called", label: "Board of Commissioners" }
          - { match: "Millage", label: "Board of Commissioners" }

  - slug: fulton
    name: Fulton County
    type: county
    fips: "13121"
    parentCounty: null
    region: Atlanta Regional Commission
    domains:
      meetings:
        schedule:
          - body: Board of Commissioners
            when: "1st and 3rd Wednesday of every month, 10:00 a.m."
            location: "Fulton County Government Center, Assembly Hall, 141 Pryor Street SW, Atlanta"
        # Legistar (Granicus) open JSON API. Fulton publishes only the Board of
        # Commissioners through Legistar — clean single body, no scoping needed.
        platform: legistar
        client: fulton

  - slug: dekalb
    name: DeKalb County
    type: county
    fips: "13089"
    parentCounty: null
    region: Atlanta Regional Commission
    domains:
      meetings:
        platform: legistar
        schedule:
          - body: Board of Commissioners
            when: "2nd and 4th Tuesday of each month, 9:00 a.m."
            location: "Room A1201, 178 Sams Street, Decatur"
        client: dekalbcountyga
        # Fold the Board of Commissioners' meeting variants (Committee of the
        # Whole, Special Called, Zoning) into one body; keep Planning Commission.
        # All are legislative/land-use — nothing administrative to drop.
        body_map:
          - { match: "Planning Commission", label: "Planning Commission" }
          - { match: "Board of Commissioners", label: "Board of Commissioners" }
          - { match: "Committee of the Whole", label: "Board of Commissioners" }
          - { match: "Special Called", label: "Board of Commissioners" }

  - slug: carrollton
    name: City of Carrollton
    type: city
    fips: null
    parentCounty: carroll           # Carroll County not yet a place — the hub nests
    parentCountyName: Carroll        # this city under a "Carroll County (not yet in
