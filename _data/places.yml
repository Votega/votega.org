  - slug: baldwin
    name: Baldwin County
    type: county
    fips: "13009"
    parentCounty: null
    region:                         # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/baldwin/.
        # Fill when: (and optional location:) per body. No scraper adapter needed
        # Baldwin's agendas live on Municode Meetings (teammunicode), embedded on
        # its /1209/Agendas-Minutes page — the CivicPlus Agenda Center is empty.
        platform: teammunicode
        base_url: https://baldwincounty.teammunicode.com
        agendas_url: "https://www.baldwincountyga.com/1209/Agendas-Minutes"            # direct agenda/minutes hub (optional; works with or without a scraper adapter)
        # teammunicode `body` is the section code from the detail link; Baldwin's
        # codes are semantic — allow-list commissioners + planning-development.
        body_map:
          - { match: "commissioners", label: "Board of Commissioners" }
          - { match: "planning-development", label: "Planning Commission" }
        schedule:
          - body: Board of Commissioners
            when: "1st and 3rd Tuesday of every month, 6:00 p.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Baldwin County Government Building"            # optional

  - slug: milledgeville
    name: City of Milledgeville
    type: city
    fips:
    parentCounty: baldwin
    region:                         # optional hub grouping label
    domains:
      meetings:
        # No scraper adapter: Milledgeville runs a bespoke WordPress site that lists
        # agenda/minutes PDFs directly from /wp-content/uploads/<year>/<month>/, with
        # inconsistent filename conventions (Council: MM-DD-YY-Agenda.pdf; boards:
        # HPC-AGENDA-Month-DD-YYYY.pdf, "PZ-...") and non-meeting PDFs mixed in — so
        # it needs a dedicated adapter, not a config add. Tracked as `unknown` so the
        # schedule + agendas_url render on /local/milledgeville/ while nothing scrapes.
        # Detected by scripts/detect_meeting_platform.py (fingerprint: WordPress, no portal).
        platform: unknown
        agendas_url: "https://www.milledgevillega.us/index.php/agendas-and-minutes/"
        schedule:
          - body: City Council
            # Inferred from posted agenda dates (regular agendas fall on 2nd & 4th
            # Tuesdays); the site does not state a time or location.
            when: "2nd and 4th Tuesday of every month"

