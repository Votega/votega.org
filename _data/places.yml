        # for a schedule; add a platform (civicplus|corecode|civicclerk) later to
        # auto-aggregate agendas/minutes (see the places.yml header).
        # Barrow's own site is CivicEngage's newer JS-rendered skin (agenda rows
        # load via AJAX, so the civicplus adapter parses zero) and it has no
        # CivicClerk instance — but it publishes to a Granicus ViewPublisher portal,
