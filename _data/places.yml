        platform: granicus
        base_url: https://barrowga.org/
        agendas_url: "https://barrowga.granicus.com/ViewPublisher.php?view_id=1"            # direct agenda/minutes hub (optional; works with or without a scraper adapter)
        body_map:
          - { match: "Planning Commission", label: "Planning Commission" }
          - { match: "Board of Appeals", label: "Board of Appeals" }
          - { match: "Board of Commissioners", label: "Board of Commissioners" }
          - { match: "Voting Session", label: "Board of Commissioners" }
          - { match: "Work Session", label: "Board of Commissioners" }
          - { match: "Special Called", label: "Board of Commissioners" }
          - { match: "Board Retreat", label: "Board of Commissioners" }
        schedule:
          - body: Board of Commissioners
            when: "2nd Tuesday of every month, 5:00 p.m., 4th Tuesday of every month, 6:00 p.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Commissioner Meeting Room, Historic Courthouse, 30 N. Broad Street, Winder"            # optional

