# Registry of Georgia local governments (counties and cities) VoteGA aggregates.
# One entry per PLACE; each declares its platform + per-domain config. Checked,
# not trusted (like open_data.yml): a place that reskins its site silently breaks
# the scrape — scripts/validate_place_meetings.py guards that, and
# update-local-government.yml runs WEEKLY because the break lands on the place's
# own server, not in this repo.
#
# See LOCAL-GOVERNMENT-IA.md for the full model. Platform-agnostic by design:
# Newton is CivicPlus, Covington will be CoreCode — the adapter
# (scripts/lib/<platform>.py) is chosen per domain, and every adapter normalizes
# to the SAME domain schema, so the page render never depends on the platform.
#
# Consumed by:
#   scripts/generate_place_meetings.py  -> assets/data/local-<slug>-meetings.json
#   scripts/validate_place_meetings.py  -> CI guard
#   scripts/generate_search_corpus.py   -> makes places searchable sitewide
#   scripts/build_entity_pages.py       -> /local/<slug>/ crawlable entity pages
#   local.html (via site.data.places)   -> the /local/ hub directory
#
# Fields
#   slug / name / type   identity; type is county | city
#   fips                 county FIPS (counties); null for cities
#   parentCounty         slug of the containing county (cities only; null for counties)
#   region               optional grouping label for the hub filter
#   hidden               optional; `true` keeps the place in this registry but
#                        omits it everywhere public — no hub card, no
#                        /local/<slug>/ page, no search entry. Flip it back to
#                        unhide. (The officials cross-check still sees the slug.)
#   domains              per-domain adapter config; supported domain today: meetings
#     meetings.platform  civicplus | corecode | civicclerk
#       civicplus keys:  base_url (no trailing slash), agenda_module_id,
#                        bodies (display name -> catId; see <base_url>/RSS.aspx)
#       corecode keys:   base_url, meetings_path
#       civicclerk keys: subdomain (the <sub> in <sub>.api.civicclerk.com)
#     Body scoping (any platform, optional) — POLICY: publish only the top-level
#     legislative body (Board of Commissioners), not every board/commission:
#       include_bodies   allow-list; keep meetings whose body contains one of these
#       exclude_bodies   drop meetings whose body contains one of these
#       body_label       relabel every kept meeting to this single body name (for
#                        sources that put the meeting TYPE in the body field)
#
# OFFICIALS is a domain too, but it is NOT configured here — a place "has
# officials" automatically when a jurisdiction in _data/local_officials.yml
# shares this place's `slug`. It is the PRECEDENCE domain: it renders first on
# /local/<slug>/. Onboard officials-first — a place may have officials and no
# meetings adapter yet (that's fine; the meetings pipeline just skips it).

places:
  - slug: newton
    name: Newton County
    type: county
    fips: "13217"
    parentCounty: null
    region: Metro Atlanta
    domains:
      meetings:
        platform: civicplus
        base_url: https://www.newtoncountyga.gov
        agenda_module_id: 65
        bodies:
          Board of Commissioners: 2
          Board of Elections: 11
          Board of Zoning Appeals: 7
          Newton County Recreation Commission: 9
          Planning Commission: 5
          Solid Waste Authority: 6
        # Curated recurring schedule shown as a "When they meet" note on the page.
        # Fill `when:` (and optional `location:`) for each body. Blank entries are
        # hidden; the whole note disappears if none are filled. Not scraped — confirm
        # against the county's posted notices and update when they change.
        schedule:
          - body: Board of Commissioners
            when: "1st & 3rd Tuesday, 7:00 p.m."
            location: "Historic Courthouse, 1124 Clark Street, Covington"
          # - body: Planning Commission
          #  when: "4th Tuesday of every month, 7:00 p.m."
          #  location: "3rd Floor Boardroom, Historic Courthouse, 1124 Clark Street, Covington"
          # - body: Board of Zoning Appeals
          #  when: "4th Thursday of every month, 7:00 p.m."
          #  location: "3rd Floor Boardroom, Historic Courthouse, 1124 Clark Street, Covington"
          # - body: Newton County Recreation Commission
          #   when: ""
          # - body: Solid Waste Authority
          #  when: "2nd Thursday of every month, 5:30 p.m."
          #  location: "Commissioners' Boardroom, Historic Courthouse, 1124 Clark Street, Covington"
          - body: Board of Elections
            when: "2nd Monday of every month, 4:00 p.m."
            location: "Board of Elections Office, 1113 Usher Street, Suite 103, Covington"

  - slug: covington
    name: City of Covington
    type: city
    fips: null
    parentCounty: newton
    region: Metro Atlanta
    domains:
      meetings:
        # CoreCode CMS: a flat council-meetings table (minutes PDFs + Vimeo
        # recordings; no agendas published). See scripts/lib/corecode.py.
        platform: corecode
        base_url: https://www.cityofcovington.org
        meetings_path: "/index.php?section=Council-Meetings"
        # Fill `when:` to show a "When they meet" note (see Newton for the shape).
        schedule:
          - body: City Council
            when: "1st and 3rd Monday, 6:30 p.m."
            location: "Council Room, 2116 Stallings Street, Covington"

  # CivicClerk prototype (JSON API, not HTML). Douglas is on the newer CivicPlus
  # platform whose Agenda Center is JS-rendered — the classic civicplus adapter
  # gets nothing, so meetings come from the CivicClerk OData API instead. Same
  # adapter will cover Cobb, Henry, and other GA CivicClerk counties.
  - slug: douglas
    name: Douglas County
    type: county
    fips: "13097"
    parentCounty: null
    region: Metro Atlanta
    domains:
      meetings:
        platform: civicclerk
        subdomain: douglascountyga

  - slug: henry
    name: Henry County
    type: county
    fips: "13151"
    parentCounty: null
    region: Metro Atlanta
    domains:
      meetings:
        platform: civicclerk
        subdomain: henrycoga            # NB: not "henrycountyga" (that api host 404s)
        include_bodies:                 # top-level legislative body only
          - Board of Commissioners

  - slug: cobb
    name: Cobb County
    type: county
    fips: "13067"
    parentCounty: null
    region: Metro Atlanta
    domains:
      meetings:
        platform: civicclerk
        subdomain: cobbcoga
        # Cobb stores the meeting TYPE in CivicClerk's categoryName, not a clean
        # body — so allow-list the Board of Commissioners' meeting types and
        # relabel them all to one body. (Excludes Elections, Planning Commission,
        # Board of Zoning Appeals, SWMA.)
        include_bodies:
          - BOC
          - "1:30 Work Session"
          - Special Called Meeting
          - Millage Public Hearing
        body_label: Board of Commissioners

  - slug: carrollton
    name: City of Carrollton
    type: city
    fips: null
    parentCounty: carroll           # Carroll County not yet a place — the hub nests
    parentCountyName: Carroll        # this city under a "Carroll County (not yet in
    region: West Georgia             # VoteGA)" placeholder header until the county is added
    hidden: true                    # hidden from the hub for now (roster kept, page not published)
