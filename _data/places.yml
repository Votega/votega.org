  - slug: baker
    name: Baker County
    type: county
    fips: "13007"
    parentCounty: null
    region:                         # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/baker/.
        # Fill when: (and optional location:) per body. No scraper adapter needed
        # for a schedule; add a platform (civicplus|corecode|civicclerk) later to
        # auto-aggregate agendas/minutes (see the places.yml header).
        platform: wix
        base_url: https://www.bakercountyga.com
        agendas_url: "https://www.bakercountyga.com/minutes-and-agendas"     # direct agenda/minutes hub (optional; works with or without a scraper adapter)
        schedule:
          - body: Board of Commissioners
            when: "1st Tuesday of every month, 7:30 p.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Baker County Board of Commissioners Office, 439 Georgia Hwy NW, Newton"            # optional

  - slug: baldwin
    name: Baldwin County
    type: county
    fips: "13009"
    parentCounty: null
    region:                         # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/baldwin/.
        # Fill when: (and optional location:) per body. No scraper adapter needed
        # Baldwin's agendas live on Municode Meetings (teammunicode), embedded on
        # its /1209/Agendas-Minutes page — the CivicPlus Agenda Center is empty.
        platform: teammunicode
        base_url: https://baldwincounty.teammunicode.com
        agendas_url: "https://www.baldwincountyga.com/1209/Agendas-Minutes"            # direct agenda/minutes hub (optional; works with or without a scraper adapter)
        # teammunicode `body` is the section code from the detail link; Baldwin's
        # codes are semantic — allow-list commissioners + planning-development.
        body_map:
          - { match: "commissioners", label: "Board of Commissioners" }
          - { match: "planning-development", label: "Planning Commission" }
        schedule:
          - body: Board of Commissioners
            when: "1st and 3rd Tuesday of every month, 6:00 p.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Baldwin County Government Building"            # optional

  - slug: banks
    name: Banks County
    type: county
    fips: "13011"
    parentCounty: null
    region:                         # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/banks/.
        # Fill when: (and optional location:) per body. No scraper adapter needed
        # for a schedule; add a platform (civicplus|corecode|civicclerk) later to
        # auto-aggregate agendas/minutes (see the places.yml header).
        # Banks' agendas live on Municode Meetings (teammunicode), embedded via an
        # iframe on the county's /1228/Agendas-and-Minutes page — its CivicPlus
