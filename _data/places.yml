            when: "1st Tuesday of every month, 6:00 p.m., and 3rd Tuesday of every month, 6:00 p.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Cherokee County Admin Building, 1130 Bluffs Parkway, Canton"            # optional
  
  - slug: clayton
    name: Clayton County
    type: county
    fips: "13063"
    parentCounty: null
    region: Atlanta Regional Commission                        # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/clayton/.
        # Fill when: (and optional location:) per body. No scraper adapter needed
