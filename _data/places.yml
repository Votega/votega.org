        # land-use bodies; the Municode title names the body, so body_map matches it.
        platform: teammunicode
        base_url: https://legacybankscountyga.teammunicode.com
        agendas_url: "https://www.bankscountyga.org/1228/Agendas-and-Minutes"            # direct agenda/minutes hub (optional; works with or without a scraper adapter)
        # teammunicode `body` is the section code from the meeting's detail link;
        # allow-list + relabel Banks' codes (boc, bc-pc) — drops bc-boe / bc-da.
        body_map:
          - { match: "boc", label: "Board of Commissioners" }
          - { match: "bc-pc", label: "Planning Commission" }
        schedule:
          - body: Board of Commissioners
            when: "2nd Tuesday every month, 6:30 p.m., and 4th Tuesday of every month, 3:00 p.m."                # e.g. "2nd Tuesday of every month, 9:00 a.m."
            location: "Courthouse Annex Boardroom, 150 Hudson Ridge, Homer"            # optional
   
  - slug: barrow
    name: Barrow County
    type: county
    fips: "13013"
    parentCounty: null
    region: Broader Metropolitan Statistical Area                         # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/barrow/.
        # Fill when: (and optional location:) per body. No scraper adapter needed
        # for a schedule; add a platform (civicplus|corecode|civicclerk) later to
