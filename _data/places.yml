  - slug: barrow
    name: Barrow County
    type: county
    fips: "13013"
    parentCounty: null
    region: Broader Metropolitan Statistical Area                         # optional hub grouping label
    domains:
      meetings:
        # Curated recurring schedule -> the "When they meet" note on /local/barrow/.
