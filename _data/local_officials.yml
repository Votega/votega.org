# ============================================================================
# LOCAL OFFICIALS — city councils & county commissions
# ============================================================================
# Hand-curated. There is NO upstream API for municipal/county officials (unlike
# the state/federal rosters), so every field is entered by a human and MUST be
# verified against a primary source — the city/county site, a meeting agenda or
# minutes, or the SoS qualifying list. Record that source in each member's
# `source` field so the roster stays auditable.
#
# Rendered server-side by Jekyll from site.data.local_officials, so edits go
# live on the next deploy. Run scripts/validate_local_officials.py after editing
# (or let the validate-local-officials workflow catch it) before pushing.
#
# ----------------------------------------------------------------------------
# HUB INTEGRATION — officials is a DOMAIN of a place (see LOCAL-GOVERNMENT-IA.md)
# ----------------------------------------------------------------------------
#   Officials is the PRIMARY (precedence) domain of the /local/ hub — it renders
#   ABOVE meetings on each /local/<slug>/ page and is server-rendered for SEO.
#   A place "has officials" purely because a jurisdiction here shares its slug —
#   there is nothing to hand-flag in places.yml.
#
#   THE JOIN KEY:  a jurisdiction's `id` MUST equal the matching place `slug` in
#   _data/places.yml (e.g. Newton County is `newton` in BOTH files, not
#   `newton-county`). validate_local_officials.py enforces this cross-check, so a
#   mismatch fails CI. Onboard officials-first: add the place to places.yml, fill
#   the roster here, then wire up the meetings adapter later.
#
# ----------------------------------------------------------------------------
# STRUCTURE — READ THIS BEFORE ADDING PEOPLE
# ----------------------------------------------------------------------------
#   jurisdictions:            <- top level = a CITY or COUNTY (not a person)
#     - id: covington         <- one entry per government body
#       name: City of Covington
#       ... body-level fields ...
#       members:              <- PEOPLE GO HERE, one row each
#         - name: Jane Doe    <- name and role are SEPARATE fields
#           role: Mayor
#           last_elected: 2023
#
#   A common mistake: adding a person as a new top-level jurisdiction. Don't —
#   people are rows in a jurisdiction's `members:` list. The validator rejects
#   any jurisdiction with no members.
#
# ----------------------------------------------------------------------------
# CONTROLLED VOCABULARIES  (the validator enforces these — do not free-type)
# ----------------------------------------------------------------------------
#   type   : city | county
#   role   : Mayor | Mayor Pro Tem | Chair | Vice Chair | Council Member | Commissioner
#   party  : Republican | Democratic | Nonpartisan
#            (use Nonpartisan for municipal seats; set jurisdiction.partisan:false)
#
# ----------------------------------------------------------------------------
# PHASING
# ----------------------------------------------------------------------------
#   PHASE 1 (now)  : roster + last_elected / next_election / term_end per member.
#   PHASE 2 (later): fill the `meetings:` and `participate:` blocks and build the
#                    "how to participate" view. The blocks are reserved below so
#                    no records get reshaped when we get there.
#   PHASE 3 (maybe): tie named members to specific local votes (e.g. the Flock
#                    contract). The `voting` / `tie_break_only` flags exist now so
#                    that view can trust who actually casts a vote.
#
#   NOTE: the `meetings:` / `participate:` blocks below predate the hub's
#   automated meetings domain (scraped weekly into local-<slug>-meetings.json).
#   Leave them blank for any place that has a meetings adapter in places.yml —
#   the scraped feed supersedes them. They remain only for places with no adapter.
#
# ----------------------------------------------------------------------------
# CURATION WORKFLOW  (minimize manual effort — one place per PR)
# ----------------------------------------------------------------------------
#   No API exists, so drafting is either:
#     TRACK A (assisted): have Claude Code read the official site / SoS qualifying
#             list and draft a roster block in this schema, one `source:` URL per
#             member, opened as a PR. Fast for onboarding many places.
#     TRACK B (manual): copy each value from a primary source into the skeleton
#             below.
#   Both converge on the SAME gate: CI green -> a human clicks every `source:`
#   link and confirms each value -> merge -> bump meta.last_reviewed. Never merge
#   a value you have not confirmed against its cited source.
#
#   MEMBER SKELETON (copy one row per person into a jurisdiction's `members:`):
#     - name: ""
#       role: Council Member          # see controlled vocab above
#       seat: ""                      # "Ward 1", "District 2", "At-large"
#       party: Nonpartisan            # Republican | Democratic | Nonpartisan
#       email: ""
#       phone: ""
#       last_elected:                 # 4-digit year
#       term_end:
#       next_election:
#       voting: true
#       source: ""                    # REQUIRED — primary-source URL for the above
# ============================================================================

