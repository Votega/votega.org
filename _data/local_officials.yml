  - id: atlanta
    name: City of Atlanta
    type: city                      # city | county
    county: Fulton                  # home county — powers county cross-linking
    body: City Council
    partisan: false                 # municipal seats are nonpartisan -> party chip hidden
    official_url: https://citycouncil.atlantaga.gov/home
    related_pages:                  # cross-links to existing VoteGA content
      - { }
    notes: ""
    term_years: 4                   # Charter § 5-102(d)
    election_rules:
      checked: 2026-11-26
      text_as_of: 2026-10-21
      items:
        - topic: schedule
          text: "The mayor, the council president and all 15 council members are elected together, on the Tuesday after the first Monday in November, in 1997 and every four years since. Those elected take office in January after the election."
          cite: Charter § 5-102
          url: https://georgiacommons.org/cities/atlanta/charter/5-102
        - topic: terms
          text: "Four years. Officials serve until their successors are elected and qualified."
          cite: Charter § 5-102
          url: https://georgiacommons.org/cities/atlanta/charter/5-102
        - topic: winning
          text: "A candidate must win a majority of the votes cast for the office to be elected."
          cite: Charter § 5-102
          url: https://georgiacommons.org/cities/atlanta/charter/5-102
        - topic: districts
          text: "12 council members are elected from single council districts. 3 are elected citywide to at-large posts, and each must live in the post they represent: Post 1 covers Districts 1 to 4, Post 2 Districts 5 to 8, and Post 3 Districts 9 to 12."
          cite: Charter § 2-101
          url: https://georgiacommons.org/cities/atlanta/charter/2-101
        - topic: vacancies
          text: "When an office becomes vacant, within 15 days the council calls a special election to fill the rest of the term. If the regular election for that office is less than a year away, there is no special election: the remaining council members appoint someone to a vacant council seat by majority vote within 30 days; the council president takes on the mayor's duties for the rest of a vacant mayor's term; and the president pro tempore takes on the council president's duties. Separately, if half or more of the council's seats are vacant, the remaining members must call a special election to fill them (Charter § 2-302(c))."
          cite: Charter § 5-103
          url: https://georgiacommons.org/cities/atlanta/charter/5-103
        - topic: eligibility
          text: "A council candidate must be at least 18, a qualified voter of the city, and not a city employee, and must have lived in the city and in the \"council district\" from which they seek to qualify for at least one year before filing to run (six months when the General Assembly has redrawn the council districts). The section does not say how this applies to candidates for the at-large posts. Once elected, a member must keep living in the council district or at-large post they were elected from."
          cite: Charter § 2-102
          url: https://georgiacommons.org/cities/atlanta/charter/2-102
        - topic: term_limits
          text: "A mayor who has been elected to two consecutive four-year terms cannot be elected to the next one."
          cite: Charter § 3-101
          url: https://georgiacommons.org/cities/atlanta/charter/3-101
