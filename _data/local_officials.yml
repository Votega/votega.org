  - id: conyers
    name: City of Conyers
    type: city                      # city | county
    county: Rockdale                  # home county — powers county cross-linking
    body: City Council
    partisan: false                 # municipal seats are nonpartisan -> party chip hidden
    official_url: https://www.conyersga.com/government/city-government/city-council
    related_pages:                  # cross-links to existing VoteGA content
      - { }
    notes: ""
    term_years: 4                   # Charter § 4-103(b)
    election_rules:
      checked: 2026-11-26
      text_as_of: 2026-11-11
      items:
        - topic: schedule
          text: "City elections are held on the Tuesday after the first Monday in November in odd-numbered years. Seats are staggered: the mayor and the District 1 and District 2 Post 1 council members are elected in one odd-numbered year, and the District 2 Post 2, District 3 and District 4 council members in the other."
          cite: Charter § 4-103
          url: https://georgiacommons.org/cities/conyers/charter/4-103
        - topic: terms
          text: "Four years. Officials serve until their successors are elected and qualified."
          cite: Charter § 4-103
          url: https://georgiacommons.org/cities/conyers/charter/4-103
        - topic: winning
          text: "The candidate who receives the most votes is elected; a majority is not required."
          cite: Charter § 4-103
          url: https://georgiacommons.org/cities/conyers/charter/4-103
        - topic: districts
          text: "The city has four council districts. Districts 1, 3 and 4 each elect one council member; District 2 elects two, one for Post 1 and one for Post 2. Each council member must live in the district they serve. The mayor is elected citywide."
          cite: Charter § 4-102
          url: https://georgiacommons.org/cities/conyers/charter/4-102
        - topic: vacancies
          text: "When the office of mayor or a council member becomes vacant, the council may call a special election to fill the rest of the term. If only one office is vacant, the council may instead serve as the full council until the seat is filled at the next city election. While the mayor's office is vacant, the mayor pro tem holds the mayor's powers."
          cite: Charter § 4-104
          url: https://georgiacommons.org/cities/conyers/charter/4-104
        - topic: eligibility
          text: "To be elected or appointed to the council (which includes the mayor), a person must, at that time, be at least 18, be a qualified voter of the city, and have lived in the city and in the district they seek to represent for at least one year. State law may add other requirements."
          cite: Charter § 2-102
          url: https://georgiacommons.org/cities/conyers/charter/2-102
