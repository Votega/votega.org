  - id: carrollton
    name: City of Carrollton
    type: city                      # city | county
    county: Carroll                 # home county — powers county cross-linking
    body: City Council
    partisan: false                 # municipal seats are nonpartisan -> party chip hidden
    official_url: https://carrolltonga.com/our-officials/
    related_pages:                  # cross-links to existing VoteGA content
      - { title: "", url: }
    notes: ""
    term_years: 4                   # Charter § III(c)-(d) (Ga. L. 1985, p. 3542)
    election_rules:
      checked: 2026-11-26
      text_as_of: 2025-11-03
      items:
        - topic: schedule
          text: "City elections are held in odd-numbered years, on the Tuesday after the first Monday in November, the date state law sets for city elections (O.C.G.A. § 21-2-9). Seats are staggered: the Ward 1 and Ward 2 council members are elected in one odd-numbered year, and the mayor and the Ward 3 and Ward 4 council members in the other."
          cite: "Charter § III (Ga. L. 1985, p. 3542)"
          url: https://georgiacommons.org/cities/carrollton/charter/part
        - topic: terms
          text: "Four years. Officials serve until their successors are elected and qualified."
          cite: "Charter § III (Ga. L. 1985, p. 3542)"
          url: https://georgiacommons.org/cities/carrollton/charter/part
        - topic: districts
          text: "The city is divided into four election wards. Each council member must live in the ward they represent and is elected only by the voters who live in that ward. The mayor must live in the city and is elected citywide. If the mayor moves out of the city, or a council member moves out of the ward they were elected from, the office is declared vacant."
          cite: "Charter § III (Ga. L. 1985, p. 3542)"
          url: https://georgiacommons.org/cities/carrollton/charter/part

