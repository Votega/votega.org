# ============================================================================
# LOCAL OFFICIALS — city councils & county commissions
# ============================================================================
# Human-gated, data-assisted. There is no single upstream API that maintains this
# roster, so a HUMAN confirms every value against a primary source (the city/county
# site, a meeting agenda or minutes, the SoS qualifying list) and records it in each
# member's `source` field. Two tools ASSIST — they draft and flag, they never write
# this file:
#   - scripts/generate_local_officials.py drafts county-commission rosters from the
#     GA SoS results API (most-recent-cycle winners). It fills only ~half of a 4-yr
#     staggered board and no term dates, and a sub-50% winner needs runoff checking
#     — so its output is a DRAFT to confirm, not truth. See that script's header.
#   - scripts/report_stale_officials.py nudges when a seat is past next_election,
#     when an executive order names a county vacancy/special election, or when the
#     SoS results disagree with a roster (the monthly report-stale-officials issue).
# City rosters and contact info (email/phone) remain fully manual — no API covers them.
#
# Rendered server-side by Jekyll from site.data.local_officials, so edits go
# live on the next deploy. Run scripts/validate_local_officials.py after editing
# (or let the validate-local-officials workflow catch it) before pushing.
#
# ----------------------------------------------------------------------------
# HUB INTEGRATION — officials is a DOMAIN of a place (see LOCAL-GOVERNMENT-IA.md)
# ----------------------------------------------------------------------------
#   Officials is the PRIMARY (precedence) domain of the /local/ hub — it renders
#   ABOVE meetings on each /local/<slug>/ page and is server-rendered for SEO.
#   A place "has officials" purely because a jurisdiction here shares its slug —
#   there is nothing to hand-flag in places.yml.
#
#   THE JOIN KEY:  a jurisdiction's `id` MUST equal the matching place `slug` in
#   _data/places.yml (e.g. Newton County is `newton` in BOTH files, not
#   `newton-county`). validate_local_officials.py enforces this cross-check, so a
#   mismatch fails CI. Onboard officials-first: add the place to places.yml, fill
#   the roster here, then wire up the meetings adapter later.
#
# ----------------------------------------------------------------------------
# STRUCTURE — READ THIS BEFORE ADDING PEOPLE
# ----------------------------------------------------------------------------
#   jurisdictions:            <- top level = a CITY or COUNTY (not a person)
#     - id: covington         <- one entry per government body
#       name: City of Covington
#       ... body-level fields ...
#       members:              <- PEOPLE GO HERE, one row each
#         - name: Jane Doe    <- name and role are SEPARATE fields
#           role: Mayor
#           last_elected: 2023
#
#   A common mistake: adding a person as a new top-level jurisdiction. Don't —
#   people are rows in a jurisdiction's `members:` list. The validator rejects
#   any jurisdiction with no members.
#
# ----------------------------------------------------------------------------
# CONTROLLED VOCABULARIES  (the validator enforces these — do not free-type)
# ----------------------------------------------------------------------------
#   type   : city | county
#   role   : Mayor | Mayor Pro Tem | Chair | Vice Chair | Council Member | Commissioner
#   party  : Republican | Democratic | Nonpartisan | Independent
#            (use Nonpartisan for municipal seats; set jurisdiction.partisan:false.
#            Independent is for a member who holds a PARTISAN seat with no party —
#            allowed only when jurisdiction.partisan is not false.)
#
#   government_form (jurisdiction, optional):
#            commission | commission-chair | ceo | sole-commissioner |
#            mayor-council-manager
#            (the commission* / ceo / sole-commissioner forms are auto-derived
#            from the roster titles by generate_local_officials.py;
#            mayor-council-manager — a consolidated city-county with a Mayor +
#            Council + appointed City Manager, e.g. Columbus-Muscogee — is set by
#            hand, since a City Manager is appointed staff and never appears in the
#            elected roster.)
#
#   OPTIONAL member display/data fields (not enumerated, but validated as non-
#   empty strings when present):
#     title     : verbatim office label shown INSTEAD of `role` when a body uses a
#                 distinctive name — "Chief Executive Officer" (DeKalb), "Commission
#                 Chairman", "Sole Commissioner". `role` still holds the canonical
#                 function (the UI sorts and the presiding check key on it); `title`
#                 is display only. The card renders `title` if set, else `role`.
#     full_name : the complete legal name (middle initial / suffix) for MATCHING
#                 against authoritative sources (generate_local_officials.py pairs on
#                 it for confidence). The site always displays `name` (the short
#                 form), so full_name never appears on a page — e.g.
#                 name: "Lisa Cupid"  +  full_name: "Lisa N. Cupid".
#
#   OPTIONAL jurisdiction structural fields (feed an eventual sibling-repo publish;
#   a publisher DERIVES counts/vacancies from members[] — don't store those):
#     term_years      : per-county term length (GA local act; most 4). Lets term_end
#                       / next_election be derived as last_elected + term_years.
#     board_size      : authorized number of seats (chair + districts + at-large).
#                       Makes an incomplete roster legible ("4 of 9 captured").
#     government_form : see controlled vocab above.
#   The meeting agenda/minutes hub URL lives in _data/places.yml (domains.meetings.
#   agendas_url), NOT here — `official_url` here is the general BoC/government page.
#
# ----------------------------------------------------------------------------
# PHASING
# ----------------------------------------------------------------------------
#   PHASE 1 (now)  : roster + last_elected / next_election / term_end per member.
#   PHASE 2 (later): fill the `meetings:` and `participate:` blocks and build the
#                    "how to participate" view. The blocks are reserved below so
#                    no records get reshaped when we get there.
#   PHASE 3 (maybe): tie named members to specific local votes (e.g. the Flock
#                    contract). The `voting` / `tie_break_only` flags exist now so
#                    that view can trust who actually casts a vote.
#
#   NOTE: the `meetings:` / `participate:` blocks below predate the hub's
#   automated meetings domain (scraped weekly into local-<slug>-meetings.json).
#   Leave them blank for any place that has a meetings adapter in places.yml —
#   the scraped feed supersedes them. They remain only for places with no adapter.
#
# ----------------------------------------------------------------------------
# CURATION WORKFLOW  (minimize manual effort — one place per PR)
# ----------------------------------------------------------------------------
#   Drafting is either:
#     TRACK A (assisted): for a COUNTY commission, run
#             `python scripts/generate_local_officials.py --counties <slug> --emit yaml`
#             to draft a block from the SoS results API, or have Claude Code read the
#             official site / SoS qualifying list. Fast for onboarding many places.
#     TRACK B (manual): copy each value from a primary source into the skeleton below.
#   Both converge on the SAME gate: CI green -> a human clicks every `source:`
#   link and confirms each value -> merge -> bump meta.last_reviewed. Never merge
#   a value you have not confirmed against its cited source.
#
#   MEMBER SKELETON (copy one row per person into a jurisdiction's `members:`):
#     - name: ""                      # short DISPLAY name (what the site shows)
#       # full_name: ""               # optional: complete name for matching (see vocab)
#       role: Council Member          # see controlled vocab above
#       # title: ""                   # optional: verbatim office label (see vocab)
#       seat: ""                      # "Ward 1", "District 2", "At-large"
#       party: Nonpartisan            # Republican | Democratic | Nonpartisan
#       email: ""
#       phone: ""
#       last_elected:                 # 4-digit year
#       term_end:
#       next_election:
#       voting: true
#       source: ""                    # REQUIRED — primary-source URL for the above
# ============================================================================

