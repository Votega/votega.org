      clerk_phone: ""
      open_records_url: ""

    # ---- PHASE 1 — ROSTER --------------------------------------------------
    members:
      - name: ""
        role: Chair                 # countywide-elected board chair
        seat: At-large
        party: ""                   # Republican | Democratic
        email: ""
        phone: ""
        last_elected:
        term_end:
        next_election:
        voting: false               # verify: many GA chairs vote only to break ties
        tie_break_only: true
        photo: ""
        source: ""
        notes: ""
      - name: ""
