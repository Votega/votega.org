<script>
(function () {
  'use strict';

  const DATA_URL  = '/assets/data/ga-bills.json';
  const PER_PAGE  = 50;

  let allBills     = [];
  let filtered     = [];
  let currentPage  = 1;
  let chamberTab    = '';
  let statusFilter  = '';
  let partyLineOnly = false;
  let searchTimer   = null;

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const elLoading    = document.getElementById('billsLoading');
  const elError      = document.getElementById('billsError');
  const elStats      = document.getElementById('billsStats');
  const elControls   = document.getElementById('billsControls');
  const elResultsBar = document.getElementById('billsResultsBar');
  const elCount      = document.getElementById('billsCount');
  const elList       = document.getElementById('billsList');
  const elPagination = document.getElementById('billsPagination');
  const elDataNote   = document.getElementById('billsDataNote');
  const elSearch     = document.getElementById('billSearch');
  const elSubject    = document.getElementById('billSubject');
  const elSort       = document.getElementById('billSort');

  // ── Status classification ─────────────────────────────────────────────────
  // governorAction (from generate_ga_bills_data.py) is authoritative for the
  // Governor's disposition — derived from explicit Open States action
  // classifications, not guessed from the free-text last-action description.
  function classifyStatus(bill) {
    const gaStatus = (bill.governorAction || {}).status;
    if (gaStatus === 'Vetoed')          return 'vetoed';
    if (gaStatus === 'Signed')          return 'signed';
    if (gaStatus === 'Sent to Governor') return 'pending';

    const s = bill.status || '';
    if (s.includes('Lost'))    return 'failed';
    if (s.includes('Withdrawn') || s.includes('Recommitted')) return 'stalled';
    const chambers = new Set(bill.passageVotes.map(function (v) { return v.chamber; }));
    if (chambers.has('lower') && chambers.has('upper')) return 'passed';
    return 'progress';
  }

  function badgeHtml(cls) {
    const labels = { signed: 'Signed', vetoed: 'Vetoed', pending: 'Sent to Governor', failed: 'Failed', passed: 'Passed', stalled: 'Stalled', progress: 'In progress' };
    return '<span class="bill-status-badge badge-' + cls + '">' + labels[cls] + '</span>';
  }

  // ── Sponsor display ───────────────────────────────────────────────────────
  function sponsorLine(sponsors) {
    if (!sponsors || !sponsors.length) return '';
    const lead  = sponsors[0].name;
    const extra = sponsors.length - 1;
    return extra > 0 ? lead + ' +' + extra + ' others' : lead;
  }

  // ── Party-line classification ───────────────────────────────────────────────
  // A "party-line vote" (a.k.a. party unity vote): a majority of Democrats
  // voted opposite a majority of Republicans on the same roll call. Uses the
  // partyTally already computed by enrich_bills_with_party_votes.py. Returns
  // null when either party has no recorded yea/nay votes, or when a party's
  // own vote was tied (no clear majority to compare).
  function computePartyLineInfo(partyTally) {
    if (!partyTally) return null;
    const d = partyTally['Democratic'];
    const r = partyTally['Republican'];
    if (!d || !r) return null;
    const dTotal = d.yea + d.nay;
    const rTotal = r.yea + r.nay;
    if (!dTotal || !rTotal) return null;
    const dDir = d.yea === d.nay ? null : (d.yea > d.nay ? 'Yea' : 'Nay');
    const rDir = r.yea === r.nay ? null : (r.yea > r.nay ? 'Yea' : 'Nay');
    if (!dDir || !rDir) return null;
    return {
      isPartyLine: dDir !== rDir,
      dPct: Math.round(Math.max(d.yea, d.nay) / dTotal * 100),
      rPct: Math.round(Math.max(r.yea, r.nay) / rTotal * 100),
    };
  }

  // ── Vote bar HTML ─────────────────────────────────────────────────────────
  function voteBarHtml(v) {
    const total  = (v.yea + v.nay + v.other) || 1;
    const pY     = Math.round(v.yea   / total * 100);
    const pN     = Math.round(v.nay   / total * 100);
    const pO     = 100 - pY - pN;
    const ch     = v.chamber === 'lower' ? 'House' : 'Senate';
    const result = v.result === 'pass' ? 'Passed' : 'Failed';
    // motionText is e.g. "Senate Vote #148 - 2025-2026 Regular Session"
    // strip the session suffix to get a concise label like "Senate Vote #148"
    const motionLabel = v.motionText
      ? v.motionText.replace(/\s*[-–]\s*\d{4}-\d{4}\s+Regular Session\s*$/i, '').trim()
      : ch + ' vote';
    const pli = computePartyLineInfo(v.partyTally);
    const partyLine = (function () {
      if (!v.partyTally) return '';
      const d = v.partyTally['Democratic'];
      const r = v.partyTally['Republican'];
      const parts = [];
      if (d) parts.push('<span style="color:#2563eb;">Dem ' + d.yea + '-' + d.nay + '</span>');
      if (r) parts.push('<span style="color:#dc2626;">Rep ' + r.yea + '-' + r.nay + '</span>');
      if (!parts.length) return '';
      const tag = pli && pli.isPartyLine
        ? ' <span class="party-line-tag">&#9889; Party-line vote</span>'
        : '';
      return '<div class="vote-bar-sub" style="margin-top:0.2rem;">' + parts.join(' &nbsp;&middot;&nbsp; ')
        + ' <span style="color:#aaa;">(yea-nay by party; may not include every recorded vote)</span>' + tag + '</div>';
    })();
    return '<div class="vote-bar-section">'
      + '<div class="vote-bar-header">'
      + '<span class="vote-yes-txt">&#10003; ' + v.yea + ' yes</span>'
      + '<span style="color:#888;font-size:0.78rem">' + escHtml(motionLabel) + ' &middot; ' + result + ' &middot; ' + v.date + '</span>'
      + '<span class="vote-no-txt">' + v.nay + ' no &#10007;</span>'
      + '</div>'
      + '<div class="vote-bar-track">'
      + '<div class="vb-yes" style="width:' + pY + '%"></div>'
      + '<div class="vb-oth" style="width:' + pO + '%"></div>'
      + '<div class="vb-no"  style="width:' + pN + '%"></div>'
      + '</div>'
      + '<div class="vote-bar-sub">' + v.yea + ' yes &nbsp;·&nbsp; ' + v.nay + ' no &nbsp;·&nbsp; ' + v.other + ' not voting/absent</div>'
      + partyLine
      + '</div>';
  }

  // ── Governor's action meta text (for the collapsed card row) ───────────────
  function governorMetaHtml(bill) {
    const ga = bill.governorAction;
    if (!ga) return bill.statusDate
      ? '<span class="bill-meta-sep">&middot;</span><span class="bill-meta-txt">' + bill.statusDate + '</span>'
      : '';
    let text;
    if (ga.status === 'Signed') {
      text = 'Signed ' + ga.decisionDate + (ga.actNumber ? ' · Act ' + ga.actNumber : '');
    } else if (ga.status === 'Vetoed') {
      text = 'Vetoed ' + ga.decisionDate;
    } else {
      text = 'Sent to Governor ' + ga.sentDate;
    }
    return '<span class="bill-meta-sep">&middot;</span><span class="bill-meta-txt">' + escHtml(text) + '</span>';
  }

  // ── Governor's action detail block (for the expanded card) ─────────────────
  function governorDetailHtml(bill) {
    const ga = bill.governorAction;
    if (!ga) return '';
    let body;
    if (ga.status === 'Signed') {
      body = 'Sent to the Governor ' + (ga.sentDate || '—') + '. Signed into law ' + ga.decisionDate
        + (ga.actNumber ? ' as <strong>Act ' + ga.actNumber + '</strong>.' : '.');
    } else if (ga.status === 'Vetoed') {
      body = 'Sent to the Governor ' + (ga.sentDate || '—') + '. Vetoed ' + ga.decisionDate + '.';
    } else {
      body = 'Sent to the Governor ' + ga.sentDate + '. Awaiting the Governor’s signature or veto.';
    }
    return '<div class="detail-section"><div class="detail-label">Governor’s Action</div><div class="detail-body">' + body + '</div></div>';
  }

  // ── Bill card HTML ────────────────────────────────────────────────────────
  function cardHtml(bill, idx) {
    const sc        = bill._status;
    const chamberLbl = bill.chamber === 'lower' ? 'House' : 'Senate';
    const isRes      = bill.billType === 'resolution';
    const sponsor    = sponsorLine(bill.sponsors);
    const subjectTag = bill.subjects && bill.subjects.length
      ? '<span class="bill-subject-tag">' + escHtml(toTitleCase(bill.subjects[0])) + '</span><span class="bill-meta-sep">&middot;</span>'
      : '';
    const voteInline = bill.passageVotes && bill.passageVotes.length
      ? '<span class="bill-meta-sep">&middot;</span>'
        + '<span class="bill-vote-inline"><span class="vote-yes-txt">' + bill.passageVotes[0].yea + ' yes</span>'
        + '&nbsp;&middot;&nbsp;<span class="vote-no-txt">' + bill.passageVotes[0].nay + ' no</span></span>'
      : '';

    const abstract    = bill.abstract ? '<div class="detail-section"><div class="detail-label">Summary</div><div class="detail-body">' + escHtml(bill.abstract) + '</div></div>' : '';
    const allSponsors = bill.sponsors && bill.sponsors.length
      ? '<div class="detail-section"><div class="detail-label">Sponsors</div><div class="detail-body">' + escHtml(bill.sponsors.map(function (s) { return s.name; }).join(' · ')) + '</div></div>'
      : '';
    const voteBars = bill.passageVotes && bill.passageVotes.length
      ? bill.passageVotes.map(voteBarHtml).join('')
      : '';
    const governorDetail = governorDetailHtml(bill);
    const links = '<div class="detail-links">'
      + (bill.billUrl ? '<a class="detail-link" href="' + escHtml(bill.billUrl) + '" target="_blank" rel="noopener">&#128279; legis.ga.gov</a>' : '')
      + (bill.textUrl ? '<a class="detail-link" href="' + escHtml(bill.textUrl) + '" target="_blank" rel="noopener">&#128196; Bill text</a>' : '')
      + '</div>';

    return '<div class="bill-card" id="bc' + idx + '">'
      + '<div class="bill-card-header" onclick="toggleBill(' + idx + ')" aria-expanded="false">'
      + '<div class="bill-top-row">'
      + '<div style="flex:1">'
      + '<div class="bill-id-status">'
      + '<span class="bill-id">' + escHtml(bill.identifier) + '</span>'
      + badgeHtml(sc)
      + (bill._partyLine ? '<span class="bill-status-badge badge-partyline">&#9889; Party-line</span>' : '')
      + '</div>'
      + '<div class="bill-title">' + escHtml(bill.title) + '</div>'
      + '</div>'
      + '<span class="bill-chevron" aria-hidden="true">&#8964;</span>'
      + '</div>'
      + '<div class="bill-meta-row">'
      + subjectTag
      + '<span class="bill-meta-txt">' + chamberLbl + (isRes ? ' &middot; Resolution' : '') + '</span>'
      + (sponsor ? '<span class="bill-meta-sep">&middot;</span><span class="bill-meta-txt">' + escHtml(sponsor) + '</span>' : '')
      + governorMetaHtml(bill)
      + voteInline
      + '</div>'
      + '</div>'
      + '<div class="bill-detail">'
      + abstract
      + governorDetail
      + allSponsors
      + voteBars
      + links
      + '</div>'
      + '</div>';
  }

  // ── Toggle card expand ────────────────────────────────────────────────────
  window.toggleBill = function (idx) {
    const card = document.getElementById('bc' + idx);
    if (!card) return;
    const open = card.classList.toggle('open');
    const hdr  = card.querySelector('.bill-card-header');
    if (hdr) hdr.setAttribute('aria-expanded', open ? 'true' : 'false');
  };

  // ── Filter & sort ─────────────────────────────────────────────────────────
  function applyFilters() {
    const q      = elSearch.value.trim().toLowerCase();
    const subj   = elSubject.value;
    const sort   = elSort.value;

    filtered = allBills.filter(function (b) {
      if (chamberTab === 'lower' && b.chamber !== 'lower') return false;
      if (chamberTab === 'upper' && b.chamber !== 'upper') return false;
      if (chamberTab === 'res'   && b.billType !== 'resolution') return false;
      if (statusFilter && b._status !== statusFilter) return false;
      if (partyLineOnly && !b._partyLine) return false;
      if (subj && !(b.subjects || []).some(function (s) { return s === subj; })) return false;
      if (q) {
        const hay = (b.identifier + ' ' + b.title + ' ' + b.abstract + ' '
          + (b.sponsors || []).map(function (s) { return s.name; }).join(' ')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    filtered.sort(function (a, b) {
      if (sort === 'date')  return (b.statusDate || '').localeCompare(a.statusDate || '');
      if (sort === 'alpha') return a.title.localeCompare(b.title);
      // Bill number: sort numerically within type prefix (HB, SB, HR, SR)
      const parseId = function (id) {
        const m = id.match(/^([A-Z]+)\s*(\d+)$/);
        return m ? m[1] + m[2].padStart(6, '0') : id;
      };
      return parseId(a.identifier).localeCompare(parseId(b.identifier));
    });

    currentPage = 1;
    render();
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function render() {
    const total = filtered.length;
    const pages = Math.ceil(total / PER_PAGE) || 1;
    currentPage = Math.min(currentPage, pages);
    const start = (currentPage - 1) * PER_PAGE;
    const slice = filtered.slice(start, start + PER_PAGE);

    elCount.textContent = total.toLocaleString() + ' bill' + (total !== 1 ? 's' : '');
    elResultsBar.style.display = '';

    if (!slice.length) {
      elList.innerHTML = '<div class="bills-empty">No bills match your filters.</div>';
    } else {
      elList.innerHTML = slice.map(function (b, i) { return cardHtml(b, start + i); }).join('');
    }

    renderPagination(pages);
  }

  function renderPagination(pages) {
    if (pages <= 1) { elPagination.innerHTML = ''; return; }
    const p   = currentPage;
    let html  = '';
    html += '<button class="page-btn" onclick="goPage(' + (p - 1) + ')" ' + (p === 1 ? 'disabled' : '') + '>&lsaquo;</button>';
    const show = pageRange(p, pages);
    let last   = 0;
    show.forEach(function (n) {
      if (n - last > 1) html += '<span class="page-ellipsis">&hellip;</span>';
      html += '<button class="page-btn' + (n === p ? ' active' : '') + '" onclick="goPage(' + n + ')">' + n + '</button>';
      last = n;
    });
    html += '<button class="page-btn" onclick="goPage(' + (p + 1) + ')" ' + (p === pages ? 'disabled' : '') + '>&rsaquo;</button>';
    elPagination.innerHTML = html;
  }

  function pageRange(current, total) {
    const delta = 2;
    const range = [];
    for (let i = Math.max(1, current - delta); i <= Math.min(total, current + delta); i++) range.push(i);
    if (range[0] > 1) range.unshift(1);
    if (range[range.length - 1] < total) range.push(total);
    return range;
  }

  window.goPage = function (n) {
    const pages = Math.ceil(filtered.length / PER_PAGE) || 1;
    if (n < 1 || n > pages) return;
    currentPage = n;
    render();
    window.scrollTo({ top: document.getElementById('billsResultsBar').offsetTop - 20, behavior: 'smooth' });
  };

  // ── Populate subject dropdown ──────────────────────────────────────────────
  function buildSubjectDropdown() {
    const counts = {};
    allBills.forEach(function (b) {
      (b.subjects || []).forEach(function (s) { counts[s] = (counts[s] || 0) + 1; });
    });
    const sorted = Object.keys(counts).sort(function (a, b) { return toTitleCase(a).localeCompare(toTitleCase(b)); });
    sorted.forEach(function (s) {
      if (counts[s] < 5) return;
      const opt = document.createElement('option');
      opt.value       = s;
      opt.textContent = toTitleCase(s) + ' (' + counts[s] + ')';
      elSubject.appendChild(opt);
    });
  }

  // ── Stats row ─────────────────────────────────────────────────────────────
  function buildStats(meta) {
    const signed   = allBills.filter(function (b) { return b._status === 'signed'; }).length;
    const vetoed   = allBills.filter(function (b) { return b._status === 'vetoed'; }).length;
    const pending  = allBills.filter(function (b) { return b._status === 'pending'; }).length;
    const failed   = allBills.filter(function (b) { return b._status === 'failed'; }).length;
    const stalled  = allBills.filter(function (b) { return b._status === 'stalled'; }).length;
    const stats = [
      stat('Total bills', (meta.totalBills || allBills.length).toLocaleString(), ''),
      stat('Signed into law', signed.toLocaleString(), 'green'),
      stat('Vetoed', vetoed.toLocaleString(), 'red'),
    ];
    if (pending > 0) stats.push(stat('Sent to Governor', pending.toLocaleString(), 'orange', 'Awaiting signature or veto'));
    stats.push(stat('Failed / stalled', (failed + stalled).toLocaleString(), 'orange'));
    stats.push(stat('With vote records', allBills.filter(function (b) { return b.passageVotes && b.passageVotes.length; }).length.toLocaleString(), 'blue'));
    elStats.innerHTML = stats.join('');
    elStats.style.display = '';
  }

  function stat(label, val, cls, sub) {
    return '<div class="bills-stat"><div class="bills-stat-label">' + label + '</div>'
      + '<div class="bills-stat-val' + (cls ? ' ' + cls : '') + '">' + val + '</div>'
      + (sub ? '<div class="bills-stat-sub">' + sub + '</div>' : '')
      + '</div>';
  }

  // ── Event wiring ──────────────────────────────────────────────────────────
  elSearch.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 250);
  });
  elSubject.addEventListener('change', applyFilters);
  elSort.addEventListener('change', applyFilters);

  document.getElementById('chamberTabs').addEventListener('click', function (e) {
    const btn = e.target.closest('.bills-tab');
    if (!btn) return;
    document.querySelectorAll('.bills-tab').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    chamberTab = btn.dataset.chamber;
    applyFilters();
  });

  document.getElementById('statusPills').addEventListener('click', function (e) {
    const btn = e.target.closest('.bills-status-btn');
    if (!btn) return;

    if (btn.id === 'partyLineToggle') {
      partyLineOnly = !partyLineOnly;
      btn.classList.toggle('active', partyLineOnly);
      applyFilters();
      return;
    }

    document.querySelectorAll('#statusPills .bills-status-btn:not(#partyLineToggle)').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    statusFilter = btn.dataset.status;
    applyFilters();
  });

  // ── Load data ─────────────────────────────────────────────────────────────
  var SMALL_WORDS = /^(and|or|of|the|by|in|at|to|a|an|for|nor|but|so|yet|from|with|on|as)$/i;
  function toTitleCase(str) {
    return str.toLowerCase().replace(/[^()]+/g, function (segment, offset) {
      return segment.replace(/\S+/g, function (word, wordOffset) {
        return (wordOffset === 0 && offset === 0) || !SMALL_WORDS.test(word)
          ? word.charAt(0).toUpperCase() + word.slice(1)
          : word;
      });
    });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  fetch(DATA_URL)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      const meta = data.metadata || {};
      allBills = (data.bills || []).map(function (b) {
        b._status = classifyStatus(b);
        b._partyLine = (b.passageVotes || []).some(function (v) {
          const pli = computePartyLineInfo(v.partyTally);
          return pli && pli.isPartyLine;
        });
        return b;
      });

      elLoading.style.display = 'none';
      buildStats(meta);
      buildSubjectDropdown();
      elControls.style.display   = '';
      elDataNote.textContent     = 'Data: Open States bulk export, May 2026. Generated ' + (meta.generatedAt ? meta.generatedAt.slice(0, 10) : '') + '.';
      elDataNote.style.display   = '';

      applyFilters();
    })
    .catch(function (err) {
      elLoading.style.display = 'none';
      elError.textContent     = 'Could not load bill data. ' + err.message;
      elError.style.display   = '';
      console.error('ga-bills: fetch failed', err);
    });
}());
</script>
