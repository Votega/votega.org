<div id="pageLayout">
  <div id="officialDetails">
    <p>Loading...</p>
  </div>
</div>

<script src="{{ '/assets/scripts/html-escape.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script>
  const DATA_URL = 'assets/data/executive.json';

  const urlParams  = new URLSearchParams(window.location.search);
  // ?id= is the legacy /executive-member.html shell route; window.VOTEGA_ENTITY
  // carries the id on the clean /federal-executives/<slug>/ entity page.
  const officialId = urlParams.get('id') || (window.VOTEGA_ENTITY && window.VOTEGA_ENTITY.id) || null;

  if (!officialId) {
    document.getElementById('officialDetails').innerHTML =
      `<p>No official selected. <a href="${getBasePath()}executive-branch.html">Go back to Executive Branch</a></p>`;
  } else {
    loadOfficial(officialId);
  }


  // Every renderer below builds markup with template literals, and the text it
  // interpolates comes from outside this page: the Federal Register API
  // (executive orders, agency rules) and the generated Congress.gov and Senate
  // feeds. html-escape.js loads ahead of this block; the fallback keeps a
  // missing dependency from silently emitting raw text.
  function esc(value) {
    const shared = window.VoteGA && window.VoteGA.escapeHtml;
    if (shared) return shared(value);
    return String(value == null ? '' : value)
      .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Links from remote data need the scheme checked as well as the text
  // escaped — see safeUrl() in html-escape.js.
  function safeUrl(value) {
    const shared = window.VoteGA && window.VoteGA.safeUrl;
    if (shared) return shared(value);
    const raw = String(value == null ? '' : value).trim();
    return /^(https?:\/\/|\/|#)/i.test(raw) ? esc(raw) : '#';
  }

  function partyIcon(party) {
    if (!party) return '';
    const p = party.toLowerCase();
    const base = getBasePath();
    if (p.includes('democrat')) return `<img width="20" alt="Democratic party" src="${base}assets/img/democratic-disc.svg" style="vertical-align:middle;margin-left:4px;">`;
    if (p.includes('republican')) return `<img width="20" alt="Republican party" src="${base}assets/img/republican-disc.svg" style="vertical-align:middle;margin-left:4px;">`;
    return '';
  }

  function fmt(iso) {
    if (!iso) return '—';
    // Parse date components directly to avoid UTC-to-local timezone shift.
    // new Date('YYYY-MM-DD') treats the string as UTC midnight, which rolls
    // back to the previous day for US timezones — manual parsing avoids this.
    const [year, month, day] = iso.slice(0, 10).split('-').map(Number);
    return new Date(year, month - 1, day).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  async function loadOfficial(id) {
    const detailsDiv = document.getElementById('officialDetails');
    try {
      const res = await fetch(getBasePath() + DATA_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      const official = (data.officials || []).find(o => o.id === id);
      if (!official) {
        detailsDiv.innerHTML = `<p>Official not found. <a href="${getBasePath()}executive-branch.html">Go back to Executive Branch</a></p>`;
        return;
      }

      document.getElementById('pageTitle').textContent = official.name;
      if (window.VotegaShare && !document.querySelector('#pageTitle + .vg-share')) {
        document.getElementById('pageTitle').insertAdjacentHTML('afterend', VotegaShare.html({type: 'federal-executive', id: official.id}));
      }
      document.title = `${official.name} | Vote GA`;

      renderOfficial(official, detailsDiv);
      initTabs();
      if (official.id === 'president') {
        loadExecOrders(official);
        loadSignedLegislation(official);
      }
      if (official.id === 'vice-president') loadVpTieVotes();
      if (official.tier === 'cabinet') loadAgencyActions(official);
    } catch (err) {
      console.error('loadOfficial()', err);
      detailsDiv.innerHTML = `<p>Could not load this official's details. <a href="${getBasePath()}executive-branch.html">Go back</a></p>`;
    }
  }

  function renderOfficial(o, container) {
    const base       = getBasePath();
    const isElected  = o.tier === 'elected';
    const isCabinet  = o.tier === 'cabinet';

    const imageHtml = o.imageUrl
      ? `<img class="official-photo" src="${safeUrl(o.imageUrl)}" alt="${esc(o.name)}">`
      : '';

    const termHtml = isElected && o.termStart
      ? `<div class="detail-row"><span><strong>Term:</strong> ${o.termStart.slice(0,4)}–${o.termEnd ? o.termEnd.slice(0,4) : 'Present'}</span></div>`
      : '';

    const isActing = (o.role || '').toLowerCase().startsWith('acting');
    const confirmedLabel = isActing ? 'Effective' : 'Senate Confirmed';
    const confirmedHtml = isCabinet && o.confirmedDate
      ? `<div class="detail-row"><span><strong>${esc(confirmedLabel)}:</strong> ${fmt(o.confirmedDate)}</span></div>`
      : '';

    const deptHtml = o.department
      ? `<div class="detail-row"><span><strong>Department:</strong> ${esc(o.department)}</span></div>`
      : '';

    const birthHtml = o.birthYear
      ? `<div class="detail-row">
           <span><strong>Birth Year:</strong> ${o.birthYear}</span>
           <span><strong>Age:</strong> ${new Date().getFullYear() - o.birthYear}</span>
         </div>`
      : '';

    const websiteHtml = o.officialWebsite
      ? `<p><strong>Official Website:</strong> <a href="${safeUrl(o.officialWebsite)}" target="_blank" rel="noopener">${esc(o.officialWebsite)}</a></p>`
      : '';

    const bioHtml = o.bio
      ? `<p style="margin-top:1rem;font-size:0.9rem;line-height:1.6;color:var(--color-text);">${esc(o.bio)}</p>`
      : '';

    // Only the President has Executive Orders and Signed Legislation tabs; these
    // links jump to them.
    const eoJumpHtml = o.id === 'president'
      ? `<p style="margin-top:1rem;"><a href="#execOrders">Executive orders ↓</a> &nbsp;·&nbsp; <a href="#signedLegislation">Signed legislation ↓</a></p>`
      : '';

    const constitutionalRoleHtml = o.constitutionalRole
      ? `<div style="margin-top:1rem;padding:0.85rem 1rem;background:var(--color-surface-sunken);border-left:3px solid var(--color-text-muted);border-radius:0 6px 6px 0;font-size:0.875rem;line-height:1.6;color:var(--color-text);">
           <strong style="display:block;margin-bottom:0.3rem;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);">Constitutional Role</strong>
           ${esc(o.constitutionalRole).replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')}
         </div>`
      : '';

    // Build tab content based on role
    let contentHtml;
    if (isCabinet) {
      contentHtml = `<div class="tab-container">
           <div class="tab-nav">
             <button class="tab-btn active" data-tab="agencyActions">Agency Rules &amp; Regulations</button>
           </div>
           <div id="agencyActions" class="tab-panel active"><p style="color:var(--color-text-muted);font-size:0.875rem;">Loading agency actions…</p></div>
         </div>`;
    } else if (o.id === 'vice-president') {
      contentHtml = `<div class="tab-container">
           <div class="tab-nav">
             <button class="tab-btn active" data-tab="vpTieVotes">Tie-Breaking Votes</button>
           </div>
           <div id="vpTieVotes" class="tab-panel active"><p style="color:var(--color-text-muted);font-size:0.875rem;">Loading tie-breaking votes…</p></div>
         </div>`;
    } else {
      contentHtml = `<div class="tab-container">
           <div class="tab-nav">
             <button class="tab-btn active" data-tab="execOrders">Executive Orders</button>
             <button class="tab-btn" data-tab="signedLegislation">Signed Legislation</button>
           </div>
           <div id="execOrders" class="tab-panel active"><p style="color:var(--color-text-muted);font-size:0.875rem;">Loading executive orders…</p></div>
           <div id="signedLegislation" class="tab-panel"><p style="color:var(--color-text-muted);font-size:0.875rem;">Loading signed legislation…</p></div>
         </div>`;
    }

    container.innerHTML = `
      ${imageHtml}
      <span class="role-badge">${esc(o.role)}</span>
      <h2 style="margin:0 0 0.75rem 0;">${esc(o.name)}</h2>
      ${o.party ? `<p><strong>Party:</strong> ${esc(o.party)} ${partyIcon(o.party)}</p>` : ''}
      ${deptHtml}
      ${termHtml}
      ${confirmedHtml}
      ${birthHtml}
      ${websiteHtml}
      ${bioHtml}
      ${constitutionalRoleHtml}
      ${eoJumpHtml}
      <p style="margin-top:1.5rem;"><a href="${base}executive-branch.html">← Back to Executive Branch</a></p>
      ${contentHtml}
    `;
  }

  function activateTab(btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  }

  // #execOrders / #signedLegislation / #agencyActions / #vpTieVotes opens that
  // tab and scrolls to the tab strip. The tabs are built after a fetch, so the
  // browser's own hash scroll has nothing to land on at load — this does it once
  // they exist, and again on later hash changes (an in-page "Executive orders"
  // link). It scrolls to the strip, not the panel: the panel's content arrives
  // later, but it only grows downward, so the strip does not move.
  function applyTabHash() {
    const id = decodeURIComponent((location.hash || '').slice(1));
    if (!id) return;
    const btn = document.querySelector('.tab-btn[data-tab="' + id.replace(/"/g, '') + '"]');
    if (!btn) return;
    activateTab(btn);
    const strip = document.querySelector('.tab-container');
    if (strip) strip.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activateTab(btn);
        // Which executive content people open: execOrders, agencyActions,
        // signedLegislation, vpTieVotes. No PII.
        window.vgTrack && window.vgTrack('exec_tab', { tab: btn.dataset.tab });
      });
    });
    window.addEventListener('hashchange', applyTabHash);
    applyTabHash();
  }

  async function loadVpTieVotes() {
    const container = document.getElementById('vpTieVotes');
    if (!container) return;

    const VP_VOTES_URL = 'assets/data/vp-tie-votes.json';

    try {
      const res = await fetch(getBasePath() + VP_VOTES_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      const votes = data.votes || [];
      const meta  = data.metadata || {};

      if (!votes.length) {
        container.innerHTML = `<p style="color:var(--color-text-muted);font-size:0.875rem;">No tie-breaking votes recorded for this term.</p>`;
        return;
      }

      // Show most recent first
      const sorted = [...votes].sort((a, b) => b.date.localeCompare(a.date));

      const items = sorted.map(v => {
        const badge     = v.vpVote === 'Yea'
          ? `<span class="tie-badge tie-badge-yea">Voted Yea</span>`
          : `<span class="tie-badge tie-badge-nay">Voted Nay</span>`;
        const title   = esc(v.title || v.question || 'Senate Vote');
        const date    = v.date ? fmt(v.date) : '—';
        const meta    = `${date} · ${esc(v.yeas)}–${esc(v.nays)} (tie) · ${esc(v.result || '')}`.trim().replace(/ · $/, '');
        const summaryHtml = v.summary
          ? `<div class="tie-summary">${esc(v.summary)}</div>`
          : '';

        return `<li class="tie-item">
          <div class="tie-header">
            ${badge}
            <a class="tie-title" href="${safeUrl(v.url)}" target="_blank" rel="noopener">${title}</a>
          </div>
          <div class="tie-meta">${meta}</div>
          ${summaryHtml}
        </li>`;
      }).join('');

      const updatedAt = meta.generatedAt ? fmt(meta.generatedAt.slice(0, 10)) : '';
      const updatedNote = updatedAt ? ` · Data as of ${updatedAt}` : '';

      container.innerHTML = `
        <p class="tie-summary-bar">${votes.length} tie-breaking vote${votes.length !== 1 ? 's' : ''} cast this term${updatedNote}</p>
        <ul class="tie-list">${items}</ul>
      `;

      // Update the tab button label to show the count
      const tabBtn = document.querySelector('[data-tab="vpTieVotes"]');
      if (tabBtn) tabBtn.textContent = `Tie-Breaking Votes (${votes.length})`;

    } catch (err) {
      console.error('loadVpTieVotes()', err);
      container.innerHTML = `<p style="color:var(--color-warning);font-size:0.875rem;">Tie-breaking vote data is temporarily unavailable. Please try again shortly.</p>`;
    }
  }

  async function loadSignedLegislation(official) {
    const container = document.getElementById('signedLegislation');
    if (!container) return;

    const LAWS_URL  = 'assets/data/presidential-laws.json';
    const PAGE_SIZE = 25;
    let   offset    = 0;
    let   allLaws   = [];

    try {
      const res = await fetch(getBasePath() + LAWS_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      allLaws = data.laws || [];
      const meta = data.metadata || {};

      if (!allLaws.length) {
        container.innerHTML = `<p style="color:var(--color-text-muted);font-size:0.875rem;">No signed legislation found for this term.</p>`;
        return;
      }

      // Update tab label with total count
      const tabBtn = document.querySelector('[data-tab="signedLegislation"]');
      if (tabBtn) tabBtn.textContent = `Signed Legislation (${allLaws.length})`;

      function renderPage() {
        const slice   = allLaws.slice(0, offset + PAGE_SIZE);
        const hasMore = slice.length < allLaws.length;

        const items = slice.map(law => {
          // Prefer an explicit public-law number; fall back to the one GovInfo
          // confirms via the package id (Congress.gov often lags on this field).
          let plNum = law.publicLawNumber;
          if (!plNum && law.govinfoPackageId) {
            const m = law.govinfoPackageId.match(/^PLAW-(\d+)publ(\d+)$/);
            if (m) plNum = `${m[1]}-${m[2]}`;
          }
          const lawNum   = plNum ? `P.L. ${esc(plNum)}` : esc(law.billLabel);
          const billId   = plNum ? esc(law.billLabel) : '';
          const date     = law.signingDate ? fmt(law.signingDate) : '—';
          const policy   = law.policyArea
            ? `<span class="law-policy">${esc(law.policyArea)}</span>`
            : '';
          const metaParts = [date];
          if (billId) metaParts.push(billId);

          // GovInfo (GPO) provenance — only when the enrichment fields are present.
          const authed = law.gpoAuthenticated && law.officialPdfUrl;
          const badge  = authed
            ? `<span class="law-badge" title="Authenticated by the U.S. Government Publishing Office">✓ GPO authenticated</span>`
            : '';
          const links = authed
            ? `<div class="law-links">
                 <a href="${safeUrl(law.officialPdfUrl)}" target="_blank" rel="noopener">Official law text (GPO PDF)</a>
               </div>`
            : '';
          const shaRow = law.sha256Pdf
            ? `<div class="lv-row"><span class="lv-k">PDF SHA-256</span><span class="lv-v lv-mono">${esc(law.sha256Pdf)}</span></div>`
            : '';
          const verify = authed
            ? `<details class="law-verify">
                 <summary>Verify integrity</summary>
                 <div class="law-verify-body">
                   <div class="lv-row"><span class="lv-k">Source</span><span class="lv-v">GovInfo · <a href="${safeUrl(law.officialTextUrl)}" target="_blank" rel="noopener">${esc(law.govinfoPackageId)}</a></span></div>
                   <div class="lv-row"><span class="lv-k">Signed by</span><span class="lv-v">U.S. Government Publishing Office</span></div>
                   ${shaRow}
                 </div>
               </details>`
            : '';

          return `<li class="law-item">
            <div class="law-header">
              <span class="law-id">${lawNum}</span>${badge}
              <a class="law-title" href="${safeUrl(law.congressUrl)}" target="_blank" rel="noopener">${esc(law.title)}</a>${policy}
            </div>
            <div class="law-meta">Signed ${metaParts.join(' · ')}</div>
            ${links}${verify}
          </li>`;
        }).join('');

        const termStart = meta.termStart || official.termStart || '2025-01-20';
        const metaBar = `<p class="law-meta-bar">
          ${allLaws.length} laws signed this term (since ${fmt(termStart)}) ·
          <a href="https://www.congress.gov/public-laws/${meta.congress || 119}" target="_blank" rel="noopener">View all on Congress.gov →</a>
        </p>`;

        const loadMoreBtn = hasMore
          ? `<button class="law-load-more" id="lawLoadMore">Load more (${allLaws.length - slice.length} remaining)</button>`
          : '';

        container.innerHTML = `${metaBar}<ul class="law-list">${items}</ul>${loadMoreBtn}`;

        const btn = document.getElementById('lawLoadMore');
        if (btn) {
          btn.addEventListener('click', () => {
            offset += PAGE_SIZE;
            renderPage();
          });
        }
      }

      renderPage();

    } catch (err) {
      console.error('loadSignedLegislation()', err);
      container.innerHTML = `<p style="color:var(--color-warning);font-size:0.875rem;">Signed legislation is temporarily unavailable. <a href="https://www.congress.gov/public-laws/119" target="_blank" rel="noopener">View public laws on Congress.gov →</a></p>`;
    }
  }

  // Executive orders come from assets/data/presidential-executive-orders.json,
  // built by scripts/generate_presidential_executive_orders.py: the Federal
  // Register record, plus orders already signed on whitehouse.gov but not yet
  // published there (provisional: true, no number). The browser no longer calls
  // the Federal Register; paging is over the loaded array, like
  // loadSignedLegislation(). loadAgencyActions() below does the same per department.
  async function loadExecOrders(official) {
    const container = document.getElementById('execOrders');
    if (!container) return;

    const EO_URL    = 'assets/data/presidential-executive-orders.json';
    const PAGE_SIZE = 20;
    const FR_ALL    = 'https://www.federalregister.gov/presidential-documents/executive-orders';
    let   shown     = PAGE_SIZE;

    function renderItem(eo) {
      const pending = !!eo.provisional;
      const eoNum = pending
        ? 'EO #: PENDING'
        : (eo.executive_order_number ? `EO ${esc(eo.executive_order_number)}` : `Doc ${esc(eo.document_number || '')}`);
      const date  = eo.signing_date ? fmt(eo.signing_date) : '—';
      const abs   = eo.abstract
        ? `<div class="eo-abstract">${esc(eo.abstract)}</div>`
        : '';
      const note  = pending
        ? `<div class="eo-pending-note">Awaiting Federal Register publication</div>`
        : '';
      return `<li class="eo-item${pending ? ' eo-pending' : ''}">
        <div class="eo-header">
          <span class="eo-number">${eoNum}</span>
          <a class="eo-title" href="${safeUrl(eo.html_url)}" target="_blank" rel="noopener">${esc(eo.title || 'Untitled')}</a>
        </div>
        <div class="eo-date">Signed ${date}</div>
        ${abs}${note}
      </li>`;
    }

    try {
      const res = await fetch(getBasePath() + EO_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data   = await res.json();
      const orders = data.orders || [];
      const meta   = data.metadata || {};

      if (!orders.length) {
        container.innerHTML = `<p style="color:var(--color-text-muted);font-size:0.875rem;">No executive orders found for this term.</p>`;
        return;
      }

      // Tab label carries the total, like Signed Legislation; same figure as the
      // "Showing X of N" line below, so it includes orders awaiting publication.
      const tabBtn = document.querySelector('[data-tab="execOrders"]');
      if (tabBtn) tabBtn.textContent = `Executive Orders (${orders.length})`;

      const termStart = (meta.termStart || official.termStart || '2025-01-20').slice(0, 10);
      const pendingCount = orders.filter(o => o.provisional).length;
      // Dated from this file's own generatedAt, not the page's other sources.
      const updated = meta.generatedAt ? ` · Updated ${fmt(meta.generatedAt)}` : '';

      function renderPage() {
        const slice   = orders.slice(0, shown);
        const hasMore = slice.length < orders.length;
        const pend    = pendingCount
          ? ` (${pendingCount} awaiting Federal Register publication)`
          : '';
        const metaBar = `<p class="eo-meta-bar">Showing ${slice.length} of ${orders.length} executive orders signed this term (since ${fmt(termStart)})${pend} · <a href="${FR_ALL}" target="_blank" rel="noopener">View all on Federal Register →</a>${updated}</p>`;
        const loadMoreBtn = hasMore
          ? `<button class="eo-load-more" id="eoLoadMore">Load more (${orders.length - slice.length} remaining)</button>`
          : '';
        container.innerHTML = `${metaBar}<ul class="eo-list">${slice.map(renderItem).join('')}</ul>${loadMoreBtn}`;
        const btn = document.getElementById('eoLoadMore');
        if (btn) btn.addEventListener('click', () => { shown += PAGE_SIZE; renderPage(); });
      }

      renderPage();
    } catch (err) {
      console.error('loadExecOrders()', err);
      container.innerHTML = `<p style="color:var(--color-warning);font-size:0.875rem;">Executive orders are temporarily unavailable. <a href="${FR_ALL}" target="_blank" rel="noopener">View directly on FederalRegister.gov →</a></p>`;
    }
  }

  // A Cabinet member's department rules come from
  // assets/data/agency-actions/<slug>.json, built by
  // scripts/generate_agency_actions.py: every final and proposed rule the Federal
  // Register has published since the term began. The department -> file mapping
  // is agency-actions-index.json, so the agency ids live in one place (the
  // generator, which verifies them against the Register on every run). The
  // Office of the Director of National Intelligence has no Register entry, so it
  // is absent from the index and the page falls back to the department website.
  async function loadAgencyActions(official) {
    const container = document.getElementById('agencyActions');
    if (!container) return;

    const INDEX_URL = 'assets/data/agency-actions-index.json';
    const PAGE_SIZE = 20;
    let   shown     = PAGE_SIZE;
    const site = official.officialWebsite
      ? `<a href="${safeUrl(official.officialWebsite)}" target="_blank" rel="noopener">official department website</a>`
      : 'official department website';

    function renderItem(doc) {
      const typeLabel = doc.type === 'Proposed Rule' ? 'PROPOSED RULE' : 'RULE';
      // The Register lists documents on public inspection under the date they are
      // scheduled to publish, which can be the next business day.
      const upcoming  = doc.publication_date && doc.publication_date.slice(0, 10) > todayIso();
      const date      = doc.publication_date
        ? `${upcoming ? 'Scheduled to publish' : 'Published'} ${fmt(doc.publication_date)}`
        : 'Publication date unavailable';
      const abs       = doc.abstract
        ? `<div class="eo-abstract">${esc(doc.abstract)}</div>`
        : '';
      return `<li class="eo-item">
        <div class="eo-header">
          <span class="eo-number">${typeLabel}</span>
          <a class="eo-title" href="${safeUrl(doc.html_url)}" target="_blank" rel="noopener">${esc(doc.title || 'Untitled')}</a>
        </div>
        <div class="eo-date">${date}</div>
        ${abs}
      </li>`;
    }

    function todayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    try {
      const idxRes = await fetch(getBasePath() + INDEX_URL);
      if (!idxRes.ok) throw new Error(`HTTP ${idxRes.status} (index)`);
      const index = await idxRes.json();
      const entry = (index.departments || {})[official.department];
      if (!entry) {
        container.innerHTML = `<p style="color:var(--color-text-muted);font-size:0.875rem;">Agency rule tracking isn't available for this office.<br>
          Visit the ${site} for policy updates.</p>`;
        return;
      }

      const res = await fetch(getBasePath() + 'assets/data/' + entry.file);
      if (!res.ok) throw new Error(`HTTP ${res.status} (${entry.file})`);
      const data = await res.json();
      const docs = data.documents || [];
      const meta = data.metadata || {};

      if (!docs.length) {
        container.innerHTML = `<p style="color:var(--color-text-muted);font-size:0.875rem;">No rules or proposed rules found for this department this term.<br>
          Visit the ${site} for other policy updates.</p>`;
        return;
      }

      const termStart = (meta.termStart || '2025-01-20').slice(0, 10);
      // Dated from this file's own generatedAt.
      const updated = meta.generatedAt ? ` · Updated ${fmt(meta.generatedAt)}` : '';
      const allUrl  = `https://www.federalregister.gov/agencies/${encodeURIComponent(entry.slug)}`;

      function renderPage() {
        const slice   = docs.slice(0, shown);
        const hasMore = slice.length < docs.length;
        const metaBar = `<p class="eo-meta-bar">Showing ${slice.length} of ${docs.length} rules and proposed rules published this term (since ${fmt(termStart)}) · <a href="${allUrl}" target="_blank" rel="noopener">View all on Federal Register →</a>${updated}</p>`;
        const loadMoreBtn = hasMore
          ? `<button class="eo-load-more" id="agencyLoadMore">Load more (${docs.length - slice.length} remaining)</button>`
          : '';
        container.innerHTML = `${metaBar}<ul class="eo-list">${slice.map(renderItem).join('')}</ul>${loadMoreBtn}`;
        const btn = document.getElementById('agencyLoadMore');
        if (btn) btn.addEventListener('click', () => { shown += PAGE_SIZE; renderPage(); });
      }

      renderPage();
    } catch (err) {
      console.error('loadAgencyActions()', err);
      container.innerHTML = `<p style="color:var(--color-warning);font-size:0.875rem;">Agency rules are temporarily unavailable.<br>
        Visit the ${site} for policy updates.</p>`;
    }
  }
</script>
