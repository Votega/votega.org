<style>
  /* ── Stats banner ─────────────────────────────────────────────────────── */
  .tracker-banner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin: 1.5rem 0;
  }
  .tracker-card {
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    background: var(--color-surface-sunken);
    border: 1px solid var(--color-border);
  }
  /* Promoted from <h3> so the outline has no h1->h3 skip (finding 4.15). */
  .tracker-card h2 {
    margin: 0 0 1rem 0;
    font-size: 0.85rem;
    line-height: 1.25;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-secondary);
    font-weight: 600;
  }
  /* Reserve two title lines so the single-line "Senate" heading and the
     two-line "House of Representatives" heading occupy the same height —
     that keeps the seat bar, stat numbers and totals in the two cards on
     the same rows. Only while the cards sit side by side; when they stack
     on narrow screens this would just add dead space. */
  @media (min-width: 561px) {
    .tracker-card h2 { min-height: 2.5em; }
  }
  .chamber-stats {
    display: flex;
    gap: 1.5rem;
  }
  .stat-block { flex: 1; }
  .stat-label {
    font-size: 0.75rem;
    color: var(--color-text-muted);
    margin-bottom: 0.2rem;
  }
  .stat-num {
    font-size: 2.4rem;
    font-weight: 800;
    line-height: 1;
  }
  .stat-sub {
    font-size: 0.75rem;
    color: var(--color-text-secondary);
    margin-top: 0.25rem;
    line-height: 1.3;
  }
  .seat-bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin: 0.85rem 0 0.5rem 0;
    background: var(--color-surface-chrome);
  }
  .bar-d { background: var(--color-party-d); }
  .bar-r { background: var(--color-party-r); }
  .bar-v { background: var(--color-party-vacant); }
  .bar-i { background: var(--color-party-i); }
  .bar-s { background: repeating-linear-gradient(45deg, var(--color-party-vacant) 0 3px, var(--color-surface-raised) 3px 6px); }
  .seat-bar-legend {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-size: 0.72rem;
    color: var(--color-text-secondary);
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 3px;
    vertical-align: middle;
  }
  /* Legend marks mirror the hemicycle seat shapes. */
  .dot-square { border-radius: 1px; }
  .dot-suspended { background: var(--color-surface-raised) !important; border: 1.5px dashed; border-radius: 50%; }
  .dot-hollow { background: var(--color-surface-raised) !important; border: 1.5px solid; border-radius: 50%; }

  /* ── Chamber tabs ─────────────────────────────────────────────────────── */
  .chamber-tabs {
    display: flex;
    gap: 0.35rem;
    margin: 1.75rem 0 0 0;
    border-bottom: 2px solid var(--color-border-subtle);
  }
  .chamber-tab {
    padding: 0.45rem 1.1rem;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--color-text-secondary);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    border-radius: 4px 4px 0 0;
    transition: color 0.15s, border-color 0.15s;
  }
  .chamber-tab:hover { color: var(--color-link); }
  .chamber-tab.active { color: var(--color-link); border-bottom-color: var(--color-accent); font-weight: 600; }

  /* ── Chamber views ────────────────────────────────────────────────────── */
  .chamber-view { display: none; margin-top: 1.25rem; }
  .chamber-view.active { display: block; }

  /* ── Senate grid ──────────────────────────────────────────────────────── */
  .senate-chamber {
    position: relative;
    background: var(--color-surface-sunken);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 1.25rem 1rem 1.5rem 1rem;
    overflow-x: auto;
  }
  .senate-grid {
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: center;
  }
  .senate-row {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .senate-aisle {
    width: 32px;
    text-align: center;
    font-size: 0.65rem;
    color: var(--color-text-muted);
    font-weight: 600;
    flex-shrink: 0;
  }
  .senate-seat {
    width: 56px;
    height: 46px;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative;
    text-decoration: none;
  }
  .senate-seat:hover {
    transform: scale(1.12);
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    z-index: 10;
  }
  .senate-seat.empty {
    background: transparent;
    border-color: transparent;
    cursor: default;
    pointer-events: none;
  }
  .senate-seat.seat-d { background: var(--color-party-d-tint); border-color: var(--color-party-d); }
  .senate-seat.seat-r { background: var(--color-party-r-tint); border-color: var(--color-party-r); }
  .senate-seat.seat-i { background: var(--color-party-i-tint); border-color: var(--color-party-i); }
  .senate-seat.seat-suspended { border-style: dashed; background: var(--color-surface-raised); }
  .senate-seat.seat-v { background: var(--color-party-vacant-tint); border-color: var(--color-party-vacant); }
  .seat-name {
    font-size: 0.66rem;
    font-weight: 600;
    color: var(--color-text);
    text-align: center;
    line-height: 1.15;
    max-width: 52px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .seat-dist {
    font-size: 0.58rem;
    color: var(--color-text-muted);
    margin-top: 1px;
  }
  /* Party as a glyph, so the seat is not colour-only. */
  .seat-party {
    position: absolute;
    top: 2px; left: 4px;
    font-size: 0.55rem;
    font-weight: 700;
    color: var(--color-text-muted);
    line-height: 1;
  }
  /* Seats with no major-party opponent this cycle get an amber ring plus a
     star glyph, so the cue is not colour-only (WCAG 1.4.1). outline (not
     box-shadow) survives the hover box-shadow/scale without being overridden. */
  .senate-seat.unopposed-seat { outline: 2px solid var(--color-warning); outline-offset: 1px; }
  .seat-flag {
    position: absolute;
    top: 1px; right: 3px;
    font-size: 0.6rem;
    color: var(--color-warning);
    line-height: 1;
  }
  .legend-star { color: var(--color-warning); margin-right: 3px; font-size: 0.85rem; vertical-align: middle; }
  /* House legend mark: the amber ring drawn around an unopposed seat (see seatHalo). */
  .legend-ring { display: inline-block; width: 11px; height: 11px; box-sizing: border-box; border: 2px solid var(--color-warning); border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  /* ── House SVG ────────────────────────────────────────────────────────── */
  /* Grow a seat on hover and on keyboard focus. transform-box: fill-box + a centred origin makes
     the scale pivot on the seat itself (an SVG shape's default origin is the viewBox corner). */
  #houseSvg .seat-grow {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.1s, opacity 0.1s;
  }
  #houseSvg a:hover .seat-grow,
  #houseSvg a:focus-visible .seat-grow {
    transform: scale(1.5);
    opacity: 1;
  }
  /* Independent: a square turned 45deg. The turn lives here, not in a transform attribute, so
     the hover scale composes with it instead of replacing it. */
  #houseSvg .seat-diamond {
    transform-box: fill-box;
    transform-origin: center;
    transform: rotate(45deg);
  }
  #houseSvg a:hover .seat-diamond.seat-grow,
  #houseSvg a:focus-visible .seat-diamond.seat-grow {
    transform: rotate(45deg) scale(1.5);
  }
  .house-chamber {
    background: var(--color-surface-sunken);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 1rem;
    overflow-x: auto;
  }
  .house-svg-wrap {
    display: flex;
    justify-content: center;
  }
  #houseSvg { display: block; max-width: 100%; }

  /* ── Tooltip ──────────────────────────────────────────────────────────── */
  #seatTooltip {
    position: fixed;
    background: color-mix(in srgb, var(--color-text) 92%, transparent);
    color: var(--color-on-accent);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    /* auto (not none) so the "View race" link inside is actually clickable */
    pointer-events: auto;
    z-index: 1000;
    display: none;
    line-height: 1.45;
    max-width: 200px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  #seatTooltip a { color: var(--color-link); }

  /* ── Legend ───────────────────────────────────────────────────────────── */
  .chart-legend {
    display: flex;
    gap: 1rem;
    font-size: 0.78rem;
    color: var(--color-text-secondary);
    margin-top: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .loading { color: var(--color-text-muted); font-style: italic; padding: 2rem 0; }

  @media (max-width: 560px) {
    .tracker-banner { grid-template-columns: 1fr; }
    .chamber-stats { gap: 1rem; }
    .stat-num { font-size: 1.9rem; }
  }
</style>

// Newest cycle present in races.json, so a new cycle is a data change not a
// code one — mirrors target_cycle() in generate_ga_campaign_finance.py.
// FALLBACK_CYCLE is only used if races.json can't be read.
const FALLBACK_CYCLE = 2026;
let raceCycle = FALLBACK_CYCLE;

async function loadRaceCycle(){ return 2026; }

function raceUrl(chamber, district) {
  const slug = chamber === 'Senate' ? 'ga-senate' : 'ga-house';
  const rid = `${slug}-${district}-${raceCycle}`;
  return '#';
}

function memberUrl(id) {
  return '#';
}

function escHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

const BG    = { D: 'var(--color-party-d-tint)', R: 'var(--color-party-r-tint)', I: 'var(--color-party-i-tint)', V: 'var(--color-party-vacant-tint)' };

// ── Data loading ───────────────────────────────────────────────────────────

async function loadMembers(){ return PROJECTED_MEMBERS; }

// ── Shared helpers ─────────────────────────────────────────────────────────

// A suspended member keeps the title and the seat but cannot act (Ga. Const. Art. II, Sec. III),
// so the seat is drawn in the member's party colour with a dashed outline but is counted for
// neither party. Bills still need a majority of ALL members the chamber is entitled to
// (Art. III, Sec. V, Para. V), so the majority line below does not move.
function isSuspended(member) { return !!member && member.status === 'Suspended'; }

function partyOf(member) {
  if (!member) return 'V';
  if (member.status === 'Vacant') return 'V';
  const p = (member.party || '').toLowerCase();
  if (p.startsWith('d')) return 'D';
  if (p.startsWith('r')) return 'R';
  // A seated member of any other party (or none recorded) is an Independent, not a
  // vacancy: 'V' is reserved for a missing record or a status of Vacant above, so an
  // Independent is counted, labelled and linked like any other sitting legislator.
  return 'I';
}

const UNOPPOSED = window.UNOPPOSED_SEATS || { senate: {}, house: {} };
const UNOPPOSED_AMBER = 'var(--color-warning)';

// Returns the sole major party on the ballot for an unopposed district, or
// null if the seat has a two-major-party contest. `chamber` is the
// ga-members.json value ("Senate" / "House of Representatives").
function unopposedPartyFor(chamber, district) {
  const map = chamber === 'Senate' ? UNOPPOSED.senate : UNOPPOSED.house;
  return (map && Object.prototype.hasOwnProperty.call(map, district)) ? map[district] : null;
}

// `chamber` picks the no-major-party-opponent mark that chamber actually uses: the Senate grid
// flags a seat with an amber outline and a star, the House hemicycle with an amber ring around
// the seat. Showing the other chamber's mark would describe something that is not on screen.
function flipLegend(chamber) {
  const ch = chamber === 'house' ? 'House of Representatives' : 'Senate';
  const f = PROJECTED_MEMBERS.filter(m => m.chamber === ch && m.flip);
  const a = f.filter(m => m.flip === 'R→D').length, b = f.filter(m => m.flip === 'D→R').length;
  return `<span><span class="legend-flip" aria-hidden="true"></span>Flipped from current roster (R→D ${a}, D→R ${b})</span>`;
}
function legendHtml(d, r, v, uCount, i = 0, chamber = 'senate', s = 0) {
  const unopposedMark = chamber === 'house'
    ? '<span class="legend-ring" aria-hidden="true"></span>'
    : '<span class="legend-star">★</span>';
  // Marks mirror the seat shapes so the non-colour cue is decodable.
  return `
    <span><span class="dot" style="background:${COLOR.D}"></span>Democrat (${d})</span>
    <span><span class="dot dot-square" style="background:${COLOR.R}"></span>Republican (${r})</span>
    ${i ? `<span><span class="dot" style="background:${COLOR.I};border-radius:2px;transform:rotate(45deg)"></span>Independent (${i})</span>` : ''}
    ${v ? `<span><span class="dot dot-hollow" style="border-color:${COLOR.V}"></span>Vacant (${v})</span>` : ''}
    ${s ? `<span><span class="dot dot-suspended" style="border-color:${COLOR.V}"></span>Suspended, not counted (${s})</span>` : ''}
    ${flipLegend(chamber)}
    ${uCount ? `<span>${unopposedMark}No major-party opponent (${uCount})</span>` : ''}
  `;
}

// ── Stats banner ───────────────────────────────────────────────────────────

function renderCard(el, title, dCount, rCount, vCount, majority, iCount = 0, suspended = []) {
  const sCount = suspended.length;
  const total = dCount + rCount + iCount + vCount + sCount;

  // Signed distance from the majority line: a positive number means the party
  // holds the majority by that many seats, negative means it is that many
  // short. The sign carries what the old "need N more / holds by N" sentences
  // spelled out, so the label and sub can stay terse.
  const dDiff = dCount - majority;
  const rDiff = rCount - majority;
  const signed = n => (n > 0 ? `+${n}` : n < 0 ? `−${Math.abs(n)}` : '0');
  const diffSub = n => n > 0 ? 'seats above majority'
                     : n < 0 ? 'seats below majority'
                     : 'exactly at majority';
  // Accessible label spells the sign out so a screen reader doesn't read a bare
  // "minus 6" with no frame.
  const diffAria = (party, n) => n > 0 ? `${party} hold the majority by ${n} seat${n !== 1 ? 's' : ''}`
                     : n < 0 ? `${party} are ${-n} seat${-n !== 1 ? 's' : ''} short of a majority`
                     : `${party} are exactly at the majority line`;

  el.innerHTML = `
    <h2>${title}</h2>
    <div class="seat-bar">
      <div class="bar-d" style="width:${(dCount/total*100).toFixed(1)}%"></div>
      <div class="bar-r" style="width:${(rCount/total*100).toFixed(1)}%"></div>
      <div class="bar-i" style="width:${(iCount/total*100).toFixed(1)}%"></div>
      <div class="bar-v" style="width:${(vCount/total*100).toFixed(1)}%"></div>
      <div class="bar-s" style="width:${(sCount/total*100).toFixed(1)}%"></div>
    </div>
    <div class="seat-bar-legend">
      <span><span class="dot" style="background:${COLOR.D}"></span>D ${dCount}</span>
      ${iCount ? `<span><span class="dot" style="background:${COLOR.I}"></span>I ${iCount}</span>` : ''}
      ${vCount ? `<span><span class="dot" style="background:${COLOR.V}"></span>Vacant ${vCount}</span>` : ''}
      ${sCount ? `<span><span class="dot dot-suspended" style="border-color:${COLOR.V}"></span>Suspended ${sCount}</span>` : ''}
      <span>R ${rCount}<span class="dot" style="background:${COLOR.R};margin:0 0 0 3px"></span></span>
    </div>
    <div class="chamber-stats" style="margin-top:1rem">
      <div class="stat-block">
        <div class="stat-label">Democrats</div>
        <div class="stat-num" style="color:${COLOR.D}" aria-label="${diffAria('Democrats', dDiff)}">${signed(dDiff)}</div>
        <div class="stat-sub">${diffSub(dDiff)}</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Republicans</div>
        <div class="stat-num" style="color:${COLOR.R}" aria-label="${diffAria('Republicans', rDiff)}">${signed(rDiff)}</div>
        <div class="stat-sub">${diffSub(rDiff)}</div>
      </div>
    </div>
    <div style="text-align:center;margin-top:1rem;padding-top:0.75rem;border-top:1px solid var(--color-border);font-size:0.78rem;color:var(--color-text-muted);">
      Total in Chamber: <strong style="color:var(--color-text)">${total}</strong>
      <div style="margin-top:0.3rem">Majority threshold: <strong style="color:var(--color-text)">${majority}</strong></div>
      <div style="margin-top:0.3rem">A bill needs a majority of all members the chamber is entitled to, whether or not every seat can vote (Ga. Const. Art. III, Sec. V, Para. V).</div>
      ${sCount ? `<div style="margin-top:0.3rem">Not counted for either party while suspended (Art. II, Sec. III): ${suspended.map(m => `${escHtml(m.name)} (${escHtml(partyOf(m))}), District ${escHtml(m.district)}`).join('; ')}.</div>` : ''}
    </div>
  `;
}

// ── Senate grid ────────────────────────────────────────────────────────────

function renderSenate(byDistrict) {
  const grid = document.getElementById('senateGrid');
  grid.innerHTML = '';

  let d = 0, r = 0, i = 0, v = 0, sus = 0;
  SENATE_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'senate-row';

    [...row.left].reverse().forEach(dist => {
      rowEl.appendChild(makeSeneateSeat(dist, byDistrict));
    });

    const aisle = document.createElement('div');
    aisle.className = 'senate-aisle';
    aisle.textContent = row.rowNum;
    rowEl.appendChild(aisle);

    row.right.forEach(dist => {
      rowEl.appendChild(makeSeneateSeat(dist, byDistrict));
    });

    grid.appendChild(rowEl);
  });

  // Tally
  Object.values(byDistrict).filter(m => m.chamber === 'Senate').forEach(m => {
    const p = partyOf(m);
    if (isSuspended(m)) sus++;
    else if (p === 'D') d++; else if (p === 'R') r++; else if (p === 'I') i++; else v++;
  });

  document.getElementById('senateLegend').innerHTML = legendHtml(d, r, v, Object.keys(UNOPPOSED.senate || {}).length, i, 'senate', sus);
}

function makeSeneateSeat(dist, byDistrict) {
  if (dist === null) {
    const empty = document.createElement('div');
    empty.className = 'senate-seat empty';
    return empty;
  }
  const el = document.createElement('a');
  const member = byDistrict[dist];
  const party  = partyOf(member);
  // A seat is "filled" if it has a member record whose status isn't Vacant —
  // ga-members.json injects a placeholder record (with a real id/district but
  // status: "Vacant") for vacant seats via overrides, so `member` being
  // truthy doesn't by itself mean there's a legislator to link to.
  const isVacant = party === 'V';
  el.href = (member && !isVacant) ? memberUrl(member.id) : raceUrl('Senate', dist);
  const suspended = isSuspended(member);
  el.className = `senate-seat seat-${party.toLowerCase()}${suspended ? ' seat-suspended' : ''}`;

  const lastName = (member && !isVacant)
    ? member.name.split(',')[0].split(' ').pop()
    : 'Vacant';
  const fullName = (member && !isVacant) ? member.name : 'Vacant';
  const partyLabel = party === 'D' ? 'Democrat' : party === 'R' ? 'Republican' : party === 'I' ? 'Independent' : 'Vacant';
  const partyMark  = party === 'V' ? '—' : party;

  const unopposed = unopposedPartyFor('Senate', dist);
  if (unopposed) el.classList.add('unopposed-seat');
  const flip = member && member.flip;
  if (flip) el.classList.add('flipped-seat');

  // The party letter means the seat does not rely on its background colour
  // alone (WCAG 1.4.1), and the aria-label gives the link a real name instead
  // of a bare surname. See CODEBASE-REVIEW-2026-08-18.md finding 4.2.
  el.innerHTML = `
    <div class="seat-party" aria-hidden="true">${partyMark}</div>
    ${flip ? `<div class="flip-flag" aria-hidden="true" title="Flipped ${flip}">⇄</div>` : ''}
    ${unopposed ? '<div class="seat-flag" aria-hidden="true" title="No major-party opponent">★</div>' : ''}
    <div class="seat-name">${escHtml(lastName)}</div>
    <div class="seat-dist">${dist}</div>
  `;
  const flipLabel = flip ? `, flipped ${flip}` : '';
  const unopposedLabel = unopposed ? `, no major-party opponent (${unopposed} unopposed)` : '';
  const suspendedLabel = suspended ? ', suspended, not counted for either party' : '';
  el.setAttribute('aria-label', `District ${dist}, ${fullName}, ${partyLabel}${suspendedLabel}${unopposedLabel}${flipLabel}`);

  // The "View 2026 race" link used to live inside the hover tooltip, where it
  // was unreachable by keyboard or touch. A filled seat leads to the member
  // page, which already surfaces that race; a vacancy links to the race direct.
  const unopposedTip = unopposed ? `<br><span style="color:${UNOPPOSED_AMBER}">★ No major-party opponent (${unopposed})</span>` : '';
  attachTooltip(el, `District ${dist}<br>${escHtml(fullName)}<br>${partyLabel}${suspended ? ' (suspended)' : ''}${flip ? `<br><strong>⇄ Flipped ${flip}</strong>` : ''}${unopposedTip}`);
  return el;
}

// ── House hemicycle ────────────────────────────────────────────────────────

function renderHouse(members) {
  const svg = document.getElementById('houseSvg');
  const W = 720, H = 380;
  const cx = W / 2, cy = H + 30; // origin well below bottom edge

  // Sort house members by district
  const house = members
    .filter(m => m.chamber === 'House of Representatives')
    .sort((a, b) => a.district - b.district);

  let memberIdx = 0;
  // `ind`, not `i`: the seat loop below declares its own `i`, which would shadow this counter.
  let d = 0, r = 0, ind = 0, v = 0, sus = 0;

  HOUSE_ROWS.forEach(({ r: radius, count }) => {
    for (let i = 0; i < count; i++) {
      // angle: π (left) → 0 (right), adjusted slightly inward so end seats don't clip
      const margin = 0.12;
      const angle = Math.PI * (1 - margin) - (i / (count - 1)) * Math.PI * (1 - margin * 2);
      const x = cx + radius * Math.cos(angle);
      const y = cy - radius * Math.sin(angle);

      const member = house[memberIdx++] || null;
      const party  = partyOf(member);
      const suspended = isSuspended(member);
      if (suspended) sus++;
      else if (party === 'D') d++; else if (party === 'R') r++; else if (party === 'I') ind++; else v++;

      const seatSize = 9;
      // Party must not be colour-only (WCAG 1.4.1), and a 9px seat is too small
      // for hatching to read, so the shape carries it: Democrats are circles,
      // Republicans squares, vacancies hollow. The legend shows the same marks.
      // See CODEBASE-REVIEW-2026-08-18.md finding 4.2.
      const circle = seatShape(party, x, y, seatSize);
      if (suspended) {
        // Hollow with a dashed party-colour outline: distinct from a vacancy (solid grey ring).
        circle.setAttribute('fill', 'var(--color-surface-raised)');
        circle.setAttribute('stroke', COLOR[party]);
        circle.setAttribute('stroke-width', '1.5');
        circle.setAttribute('stroke-dasharray', '2 1.5');
        circle.setAttribute('opacity', '1');
      }

      // A seat is "filled" if it has a member record whose status isn't
      // Vacant — ga-members.json injects a placeholder record (with a real
      // district but status: "Vacant") for vacant seats via overrides, so
      // `member` being truthy doesn't by itself mean there's a legislator.
      const isVacant = party === 'V';
      const district  = member ? member.district : null;

      // Seats used to be bare <circle>s with a click listener, so they were
      // unreachable by keyboard and the "View 2026 race" link lived inside a
      // hover tooltip — unreachable by keyboard *or* touch. Each seat is now an
      // SVG <a> (focusable, same as the Senate grid's real <a>), and the race
      // link is dropped: a filled seat leads to the member page, which already
      // carries a "View … race" banner for seats up this cycle.
      let seatNode = circle;
      if (district != null) {
        const partyLabel = party === 'D' ? 'Democrat'
                         : party === 'R' ? 'Republican'
                         : party === 'I' ? 'Independent' : 'Vacant';
        const who = (member && !isVacant) ? member.name : 'Vacant';
        const unopposed = unopposedPartyFor('House of Representatives', district);
        const link = svgEl('a', {
          href: (member && !isVacant) ? memberUrl(member.id) : raceUrl('House', district),
          style: 'cursor:pointer',
        });
        // <title> is the accessible name of an SVG node — this is what makes
        // all 180 seats readable instead of one chart-level aria-label.
        const title = svgEl('title', {});
        title.textContent = `District ${district}, ${who}, ${partyLabel}${suspended ? ', suspended, not counted for either party' : ''}${member && member.flip ? ', flipped ' + member.flip : ''}`
          + (unopposed ? `, no major-party opponent (${unopposed} unopposed)` : '');
        link.appendChild(title);
        // Halo first, so the party shape draws on top of it.
        if (member && member.flip) link.appendChild(seatFlipRing(party, x, y, seatSize));
        if (unopposed) link.appendChild(seatHalo(party, x, y, seatSize));
        link.appendChild(circle);
        const unopposedTip = unopposed ? `<br><span style="color:${UNOPPOSED_AMBER}"><span class="legend-ring" aria-hidden="true"></span>No major-party opponent (${unopposed})</span>` : '';
        attachTooltip(link, `District ${district}<br>${escHtml(who)}<br>${partyLabel}${suspended ? ' (suspended)' : ''}${member && member.flip ? `<br><strong>⇄ Flipped ${member.flip}</strong>` : ''}${unopposedTip}`);
        seatNode = link;
      }

      // The hover/focus grow is pure CSS (.seat-grow below). It used to be a JS handler that set
      // a `transform` attribute on the shape while the shape also had `transition: transform`:
      // the browser animated an SVG transform from the wrong origin, so seats jumped sideways,
      // looked tilted mid-animation, and a pointer parked on a seat's edge toggled
      // mouseenter/mouseleave dozens of times a second (measured: 54 events in 1.2 s).
      if (member) circle.classList.add('seat-grow');

      svg.appendChild(seatNode);
    }
  });

  document.getElementById('houseLegend').innerHTML = legendHtml(d, r, v, Object.keys(UNOPPOSED.house || {}).length, ind, 'house', sus);
}

// ── Seat marks ─────────────────────────────────────────────────────────────

// Shape, not just colour, distinguishes the parties. Kept the same visual
// weight so the hemicycle still reads as a seating chart.
function seatShape(party, x, y, size) {
  const common = {
    fill: COLOR[party], opacity: '0.85', stroke: 'var(--color-border-subtle)', 'stroke-width': '0.5',
    style: 'cursor:pointer',
  };
  if (party === 'R') {
    return svgEl('rect', Object.assign({
      x: (x - size / 2).toFixed(1), y: (y - size / 2).toFixed(1),
      width: size, height: size, rx: 1.5,
    }, common));
  }
  if (party === 'I') {
    // Diamond, so an Independent is distinct from D (circle) and R (square) without colour.
    return svgEl('rect', Object.assign({
      x: (x - size / 2).toFixed(1), y: (y - size / 2).toFixed(1),
      width: size, height: size, rx: 1.5,
      class: 'seat-diamond',   // the 45-degree turn is CSS (below) so the hover scale can keep it
    }, common));
  }
  if (party === 'V') {
    // Hollow, so a vacancy is not just "a grey one".
    return svgEl('circle', Object.assign({}, common, {
      cx: x.toFixed(1), cy: y.toFixed(1), r: size / 2,
      fill: 'var(--color-surface-raised)', stroke: COLOR.V, 'stroke-width': '1.5',
    }));
  }
  return svgEl('circle', Object.assign({
    cx: x.toFixed(1), cy: y.toFixed(1), r: size / 2,
  }, common));
}

// An amber halo marking a seat with no major-party opponent. A hollow ring one
// size larger than the seat, so it reads as an added mark rather than a recolour
// of the party shape. Matches the Senate grid's amber outline + the legend star.
function seatFlipRing(party, x, y, size) {
  const c = { fill: 'none', stroke: 'var(--color-text)', 'stroke-width': '1.6' };
  if (party === 'R') { const s = size + 9; return svgEl('rect', Object.assign({ x: (x - s/2).toFixed(1), y: (y - s/2).toFixed(1), width: s, height: s, rx: 2.5 }, c)); }
  return svgEl('circle', Object.assign({ cx: x.toFixed(1), cy: y.toFixed(1), r: (size/2 + 4.2).toFixed(1) }, c));
}
function seatHalo(party, x, y, size) {
  const common = { fill: 'none', stroke: UNOPPOSED_AMBER, 'stroke-width': '1.8', opacity: '0.95' };
  if (party === 'R') {
    const s = size + 4;
    return svgEl('rect', Object.assign({
      x: (x - s / 2).toFixed(1), y: (y - s / 2).toFixed(1),
      width: s, height: s, rx: 2,
    }, common));
  }
  return svgEl('circle', Object.assign({
    cx: x.toFixed(1), cy: y.toFixed(1), r: (size / 2 + 2).toFixed(1),
  }, common));
}

// ── SVG helper ─────────────────────────────────────────────────────────────

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

// ── Tooltip ────────────────────────────────────────────────────────────────

const tooltip = document.getElementById('seatTooltip');

// A short grace period before hiding, and a cancel-on-enter on the tooltip
// itself, so a visitor can move the mouse off the (tiny) seat and onto the
// tooltip's "View race" link without it disappearing first.
let tooltipHideTimer = null;
tooltip.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));
tooltip.addEventListener('mouseleave', () => {
  tooltipHideTimer = setTimeout(() => { tooltip.style.display = 'none'; }, 200);
});

function attachTooltip(el, html) {
  el.addEventListener('mouseenter', e => {
    clearTimeout(tooltipHideTimer);
    tooltip.style.display = 'block';
    tooltip.innerHTML = html;
  });
  el.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';
  });
  el.addEventListener('mouseleave', () => {
    tooltipHideTimer = setTimeout(() => { tooltip.style.display = 'none'; }, 200);
  });
}

// ── Tabs ───────────────────────────────────────────────────────────────────

document.querySelectorAll('.chamber-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chamber-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.chamber-view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.chamber + 'View').classList.add('active');
  });
});

// ── Bootstrap ─────────────────────────────────────────────────────────────

(async () => {
  try {
    const [members] = await Promise.all([
      loadMembers(),
      loadRaceCycle().then(c => { raceCycle = c; }),
    ]);

    // Build district→member lookup per chamber
    const senateByDist = {}, houseByDist = {};
    members.forEach(m => {
      if (m.chamber === 'Senate') senateByDist[m.district] = m;
      else if (m.chamber === 'House of Representatives') houseByDist[m.district] = m;
    });

    // Tally per chamber
    const tally = (map) => {
      let d = 0, r = 0, i = 0, v = 0;
      const suspended = [];
      Object.values(map).forEach(m => {
        const p = partyOf(m);
        if (isSuspended(m)) suspended.push(m);
        else if (p === 'D') d++; else if (p === 'R') r++; else if (p === 'I') i++; else v++;
      });
      return { d, r, i, v, suspended };
    };

    const ht = tally(houseByDist);
    const st = tally(senateByDist);

    renderCard(document.getElementById('houseCard'),  'House of Representatives', ht.d, ht.r, ht.v, HOUSE_MAJORITY, ht.i, ht.suspended);
    renderCard(document.getElementById('senateCard'), 'Senate',                   st.d, st.r, st.v, SENATE_MAJORITY, st.i, st.suspended);

    renderSenate(senateByDist);
    renderHouse(members);

  } catch (err) {
    console.error(err);
    document.getElementById('trackerBanner').innerHTML =
      '<p style="color:var(--color-danger)">Could not load member data. ' + err.message + '</p>';
  }
})();

})();
</script>
