<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race Candidate Profile Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; font-size: 14px; background: #f5f5f5; color: #222; }
  header { background: #1e3a5f; color: #fff; padding: 0.65rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  header h1 { font-size: 1rem; font-weight: 600; }
  .file-status { font-size: 0.75rem; opacity: 0.75; margin-left: auto; }
  button { font: inherit; cursor: pointer; border-radius: 4px; padding: 0.35rem 0.7rem; border: 1px solid #ccc; background: #fff; }
  header button { background: #2c5282; color: #fff; border-color: #2c5282; font-size: 12px; }
  header button:hover { background: #3a6ba5; }
  header button:disabled { opacity: 0.45; cursor: not-allowed; }

  .layout { display: grid; grid-template-columns: 330px 1fr; height: calc(100vh - 46px); }
  .sidebar { background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-top { padding: 0.6rem; border-bottom: 1px solid #eee; }
  .sidebar-top input { width: 100%; padding: 0.38rem 0.55rem; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  .filters { display: flex; gap: 0.3rem; margin-top: 0.5rem; flex-wrap: wrap; }
  .filter-chip { font-size: 11px; padding: 3px 9px; border-radius: 11px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; cursor: pointer; }
  .filter-chip.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }

  .list { flex: 1; overflow-y: auto; }
  .race-item { padding: 0.5rem 0.7rem; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
  .race-item:hover { background: #f1f5f9; }
  .race-item.active { background: #dbeafe; border-left: 3px solid #1d4ed8; padding-left: calc(0.7rem - 3px); }
  .race-title { font-weight: 600; font-size: 13px; }
  .race-sub { font-size: 11px; color: #64748b; font-family: ui-monospace, monospace; }
  .race-count { font-size: 10px; color: #64748b; }
  .lvl-badge { display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 5px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
  .lvl-federal { background: #ede9fe; color: #6d28d9; }
  .lvl-state { background: #dcfce7; color: #166534; }
  .lvl-other { background: #e5e7eb; color: #374151; }

  .main { overflow-y: auto; padding: 1.1rem 1.4rem; }
  .empty { color: #94a3b8; margin-top: 3rem; text-align: center; }
  .race-head { border-bottom: 1px solid #e2e8f0; padding-bottom: 0.6rem; margin-bottom: 1rem; }
  .race-head h2 { font-size: 1.15rem; }
  .race-head .meta { font-size: 12px; color: #64748b; margin-top: 0.2rem; font-family: ui-monospace, monospace; }

  .phase-group { margin-bottom: 0.9rem; }
  .phase-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; margin-bottom: 0.3rem; }
  .cand-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .cand-chip { border: 1px solid #ddd; border-radius: 16px; padding: 0.3rem 0.75rem; cursor: pointer; font-size: 13px; background: #fff; display: inline-flex; align-items: center; gap: 0.35rem; }
  .cand-chip:hover { border-color: #94a3b8; }
  .cand-chip.sel { border-color: #1d4ed8; background: #eff6ff; box-shadow: inset 0 0 0 1px #1d4ed8; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-D { background: #1d4ed8; } .dot-R { background: #b91c1c; } .dot-other { background: #9ca3af; }
  .mini-badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 7px; }
  .mb-wd { background: #fef2f2; color: #991b1b; } .mb-dq { background: #fefce8; color: #854d0e; } .mb-inc { background: #e0f2fe; color: #0369a1; }

  .form-card { border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; padding: 1.1rem 1.25rem; margin-top: 0.9rem; }
  .form-card h3 { font-size: 0.95rem; margin-bottom: 0.15rem; }
  .form-card .sub { font-size: 11px; color: #64748b; font-family: ui-monospace, monospace; margin-bottom: 0.9rem; }
  .appears { font-size: 12px; color: #475569; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.5rem 0.7rem; margin-bottom: 0.9rem; }
  .appears label { font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-weight: 600; font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 0.04em; }
  input[type=text], input[type=email], input[type=url], textarea, select { padding: 0.4rem 0.55rem; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #3b82f6; border-color: transparent; }
  textarea { resize: vertical; min-height: 80px; }
  .hint { font-size: 10px; color: #94a3b8; }
  .checks { display: flex; gap: 1.25rem; margin-top: 0.2rem; }
  .checks label { display: inline-flex; align-items: center; gap: 0.4rem; text-transform: none; font-size: 13px; font-weight: 500; color: #333; letter-spacing: 0; cursor: pointer; }

  details.adv { margin-top: 0.8rem; border-top: 1px solid #eee; padding-top: 0.6rem; }
  details.adv summary { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; cursor: pointer; }
  details.adv .form-grid { margin-top: 0.7rem; }

  .actions { margin-top: 1rem; display: flex; gap: 0.5rem; align-items: center; }
  .btn-primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  .btn-primary:hover { background: #1e40af; }
  .btn-success { background: #16a34a; color: #fff; border-color: #16a34a; }
  .btn-success:hover { background: #15803d; }
  .btn-ghost { background: #fff; }
  .dirty-dot { font-size: 12px; color: #d97706; }

  .toast { position: fixed; bottom: 1.25rem; right: 1.25rem; background: #16a34a; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; font-size: 13px; display: none; z-index: 100; }
</style>
</head>
<body>

<header>
  <h1>Race Candidate Profile Editor</h1>
  <button id="btnOpen">Open races.json</button>
  <button id="btnSaveFile" disabled>💾 Save file</button>
  <button id="btnDownload" disabled>⬇ Download</button>
  <span class="file-status" id="fileStatus">No file loaded</span>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-top">
      <input type="text" id="search" placeholder="Search races by title, id, or candidate…" disabled>
      <div class="filters" id="filters"></div>
    </div>
    <div class="list" id="raceList">
      <div class="empty">Open races.json to begin</div>
    </div>
  </div>

  <div class="main" id="main">
    <div class="empty">Open <code>assets/data/races.json</code>, then pick a race from the left.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Profile fields this editor curates. Structural keys (id, type, memberId,
  // memberSource, isIncumbent) are shown as read-only context and never touched.
  let fileHandle = null;
  let racesDoc   = null;     // whole parsed races.json
  let levelFilter = 'federal';
  let selectedRaceIdx = null;
  let selectedIdentity = null; // id || memberId of the selected candidate
  let dirty = false;

  const $ = id => document.getElementById(id);

  // ── File I/O ───────────────────────────────────────────────────────────────

  $('btnOpen').addEventListener('click', async () => {
    try {
      [fileHandle] = await window.showOpenFilePicker({
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      const file = await fileHandle.getFile();
      racesDoc = JSON.parse(await file.text());
      if (!Array.isArray(racesDoc.races)) throw new Error('This file has no "races" array — did you open races.json?');
      $('fileStatus').textContent = '📄 ' + file.name + ' · ' + racesDoc.races.length + ' races';
      $('search').disabled = false;
      $('btnSaveFile').disabled = false;
      $('btnDownload').disabled = false;
      dirty = false;
      buildFilters();
      renderRaceList();
      $('main').innerHTML = '<div class="empty">Pick a race from the left.</div>';
      toast('races.json loaded');
    } catch (e) {
      if (e.name !== 'AbortError') alert('Could not open file: ' + e.message);
    }
  });

  // Serialize matching races.json exactly: 2-space indent, CRLF line endings, no
  // trailing newline. Anything else turns a one-field edit into a whole-file diff.
  function serialize() {
    racesDoc.updatedAt = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    return JSON.stringify(racesDoc, null, 2).replace(/\n/g, '\r\n');
  }

  $('btnSaveFile').addEventListener('click', async () => {
    if (!fileHandle) return;
    try {
      const writable = await fileHandle.createWritable();
      await writable.write(serialize());
      await writable.close();
      dirty = false;
      updateDirty();
      toast('Saved to disk ✓');
    } catch (e) {
      alert('Save failed: ' + e.message);
    }
  });

  $('btnDownload').addEventListener('click', () => {
    const blob = new Blob([serialize()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'races.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ── Sidebar: race list ───────────────────────────────────────────────────────

  function levelOf(race) {
    const l = (race.level || '').toLowerCase();
    if (l === 'federal') return 'federal';
    if (l.startsWith('state')) return 'state';
    return 'other';
  }

  function raceTitle(race) {
    if (race.displayTitle) return race.displayTitle;
    const dist = race.district ? ' District ' + race.district : '';
    return (race.chamber || race.id) + dist;
  }

  function candidatesOf(race) {
    // Every candidate object across all phases, with its phase name. A person may
    // appear more than once (e.g. special + runoff) — that is preserved here.
    const out = [];
    for (const [phaseName, phase] of Object.entries(race.phases || {})) {
      if (Array.isArray(phase.candidates)) phase.candidates.forEach(c => out.push({ c, phaseName }));
      if (phase.ballots) for (const arr of Object.values(phase.ballots)) {
        if (Array.isArray(arr)) arr.forEach(c => out.push({ c, phaseName }));
      }
    }
    return out;
  }

  const identityOf = c => c.id || c.memberId || '';

  function buildFilters() {
    const levels = new Set(racesDoc.races.map(levelOf));
    const order = ['federal', 'state', 'other'].filter(l => levels.has(l));
    const chips = [['all', 'All']].concat(order.map(l => [l, l[0].toUpperCase() + l.slice(1)]));
    $('filters').innerHTML = chips.map(([k, label]) =>
      `<span class="filter-chip${k === levelFilter ? ' active' : ''}" data-lvl="${k}">${label}</span>`).join('');
    $('filters').querySelectorAll('.filter-chip').forEach(el =>
      el.addEventListener('click', () => { levelFilter = el.dataset.lvl; buildFilters(); renderRaceList(); }));
  }

  $('search').addEventListener('input', renderRaceList);

  function renderRaceList() {
    const q = $('search').value.toLowerCase().trim();
    const list = $('raceList');
    const items = racesDoc.races
      .map((race, idx) => ({ race, idx }))
      .filter(({ race }) => levelFilter === 'all' || levelOf(race) === levelFilter)
      .filter(({ race }) => {
        if (!q) return true;
        const hay = [race.id, raceTitle(race), race.chamber,
          ...candidatesOf(race).map(x => x.c.name)].join(' ').toLowerCase();
        return hay.includes(q);
      });

    if (!items.length) { list.innerHTML = '<div class="empty">No races match.</div>'; return; }

    list.innerHTML = items.map(({ race, idx }) => {
      const lvl = levelOf(race);
      const n = candidatesOf(race).length;
      return `<div class="race-item${idx === selectedRaceIdx ? ' active' : ''}" data-idx="${idx}">
        <div class="race-title">${esc(raceTitle(race))}<span class="lvl-badge lvl-${lvl}">${lvl}</span></div>
        <div class="race-sub">${esc(race.id)}</div>
        <div class="race-count">${n} candidate${n === 1 ? '' : 's'} · ${Object.keys(race.phases || {}).join(', ') || 'no phases'}</div>
      </div>`;
    }).join('');
    list.querySelectorAll('.race-item').forEach(el =>
      el.addEventListener('click', () => selectRace(+el.dataset.idx)));
  }

  // ── Main: race candidates + edit form ────────────────────────────────────────

  function selectRace(idx) {
    selectedRaceIdx = idx;
    selectedIdentity = null;
    renderRaceList();
    renderRace();
  }

  function renderRace() {
    const race = racesDoc.races[selectedRaceIdx];
    const groups = Object.entries(race.phases || {}).map(([phaseName, phase]) => {
      const cands = [];
      if (Array.isArray(phase.candidates)) phase.candidates.forEach(c => cands.push(c));
      if (phase.ballots) for (const arr of Object.values(phase.ballots)) if (Array.isArray(arr)) arr.forEach(c => cands.push(c));
      const chips = cands.map(c => {
        const idn = identityOf(c);
        const sel = idn && idn === selectedIdentity ? ' sel' : '';
        return `<span class="cand-chip${sel}" data-idn="${esc(idn)}">
          <span class="dot dot-${partyKey(c.party)}"></span>${esc(c.name || '(unnamed)')}${badges(c)}</span>`;
      }).join('');
      const dateStr = phase.electionDate ? ' · ' + phase.electionDate : '';
      return `<div class="phase-group">
        <div class="phase-label">${esc(phaseName)}${dateStr}</div>
        <div class="cand-chips">${chips || '<span class="hint">no candidates</span>'}</div>
      </div>`;
    }).join('');

    $('main').innerHTML = `
      <div class="race-head">
        <h2>${esc(raceTitle(race))}</h2>
        <div class="meta">${esc(race.id)} · ${esc(race.level || '')} · activePhase: ${esc(race.activePhase || '—')}</div>
      </div>
      ${groups}
      <div id="formSlot"></div>`;

    $('main').querySelectorAll('.cand-chip').forEach(el =>
      el.addEventListener('click', () => { if (el.dataset.idn) selectCandidate(el.dataset.idn); }));

    if (selectedIdentity) renderForm();
  }

  function occurrences(race, identity) {
    // All candidate objects in this race sharing the identity (id/memberId).
    const refs = [];
    for (const [phaseName, phase] of Object.entries(race.phases || {})) {
      const scan = arr => { if (Array.isArray(arr)) arr.forEach(c => { if (identityOf(c) === identity) refs.push({ c, phaseName }); }); };
      scan(phase.candidates);
      if (phase.ballots) Object.values(phase.ballots).forEach(scan);
    }
    return refs;
  }

  function selectCandidate(identity) {
    selectedIdentity = identity;
    renderRace(); // re-highlight chips
    document.querySelector('.cand-chip.sel')?.scrollIntoView({ block: 'nearest' });
  }

  // imageurl (lowercase) is a stray typo present on a few entries; read either but
  // always write back the correct imageUrl and drop the misspelling.
  const readImg = c => c.imageUrl || c.imageurl || '';

  function renderForm() {
    const race = racesDoc.races[selectedRaceIdx];
    const refs = occurrences(race, selectedIdentity);
    if (!refs.length) { $('formSlot').innerHTML = ''; return; }
    const c = refs[0].c; // representative object; edits fan out to all on save
    const phasesList = refs.map(r => r.phaseName).join(', ');

    const structural = `type: ${c.type || '—'}` +
      (c.id ? ` · id: ${c.id}` : '') +
      (c.memberId ? ` · memberId: ${c.memberId} (${c.memberSource || 'congress'})` : '');

    const syncBlock = refs.length > 1 ? `
      <div class="appears">
        This candidate appears in <b>${refs.length}</b> phases of this race (${esc(phasesList)}).
        <label><input type="checkbox" id="f_sync" checked> Apply edits to all ${refs.length} phases</label>
      </div>` : '';

    $('formSlot').innerHTML = `
      <div class="form-card">
        <h3>${esc(c.name || '(unnamed candidate)')}</h3>
        <div class="sub">${esc(structural)}</div>
        ${syncBlock}
        <div class="form-grid">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="f_name" value="${esc(c.name || '')}">
          </div>
          <div class="form-group">
            <label>Party</label>
            <input type="text" id="f_party" list="partyList" value="${esc(c.party || '')}">
            <datalist id="partyList"><option>Democrat</option><option>Republican</option><option>Independent</option><option>Libertarian</option><option>Nonpartisan</option></datalist>
          </div>
          <div class="form-group">
            <label>Occupation</label>
            <input type="text" id="f_occupation" value="${esc(c.occupation || '')}">
          </div>
          <div class="form-group">
            <label>County</label>
            <input type="text" id="f_county" value="${esc(c.county || '')}">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="f_email" value="${esc(c.email || '')}">
          </div>
          <div class="form-group">
            <label>Website</label>
            <input type="url" id="f_website" value="${esc(c.website || '')}" placeholder="https://…">
          </div>
          <div class="form-group full">
            <label>Image URL</label>
            <input type="url" id="f_imageUrl" value="${esc(readImg(c))}" placeholder="https://…">
          </div>
          <div class="form-group full">
            <label>Bio</label>
            <textarea id="f_bio">${esc(c.bio || '')}</textarea>
            <span class="hint">Plain text or simple HTML — rendered inside a paragraph on the candidate page.</span>
          </div>
          <div class="form-group full">
            <label>Status flags</label>
            <div class="checks">
              <label><input type="checkbox" id="f_withdrawn"${c.withdrawn ? ' checked' : ''}> Withdrawn</label>
              <label><input type="checkbox" id="f_disqualified"${c.disqualified ? ' checked' : ''}> Disqualified</label>
            </div>
          </div>
        </div>

        <details class="adv"${(c.existingMemberId || c.fecCommitteeId) ? ' open' : ''}>
          <summary>Advanced — record linking &amp; finance</summary>
          <div class="form-grid">
            <div class="form-group">
              <label>Existing member ID</label>
              <input type="text" id="f_existingMemberId" value="${esc(c.existingMemberId || '')}" placeholder="bioguide or ocd-person/…">
              <span class="hint">Links to a prior legislative record + service history.</span>
            </div>
            <div class="form-group">
              <label>Existing member source</label>
              <select id="f_existingMemberSource">
                <option value=""${!c.existingMemberSource ? ' selected' : ''}>— none —</option>
                <option value="congress"${c.existingMemberSource === 'congress' ? ' selected' : ''}>congress</option>
                <option value="state"${c.existingMemberSource === 'state' ? ' selected' : ''}>state</option>
              </select>
            </div>
            <div class="form-group">
              <label>FEC committee ID</label>
              <input type="text" id="f_fecCommitteeId" value="${esc(c.fecCommitteeId || '')}" placeholder="C00…">
            </div>
          </div>
        </details>

        <div class="actions">
          <button class="btn-success" id="btnApply">Apply to data</button>
          <span class="hint" id="applyHint"></span>
          <span style="flex:1"></span>
          <span class="dirty-dot" id="dirtyDot"></span>
        </div>
      </div>`;

    $('btnApply').addEventListener('click', applyEdits);
    updateDirty();
  }

  // Text field → candidate key. Empty clears the key so the JSON stays clean.
  const TEXT_FIELDS = [
    ['f_name', 'name'], ['f_party', 'party'], ['f_occupation', 'occupation'],
    ['f_county', 'county'], ['f_email', 'email'], ['f_website', 'website'],
    ['f_bio', 'bio'], ['f_existingMemberId', 'existingMemberId'],
    ['f_existingMemberSource', 'existingMemberSource'], ['f_fecCommitteeId', 'fecCommitteeId'],
  ];

  function applyEdits() {
    const race = racesDoc.races[selectedRaceIdx];
    const refs = occurrences(race, selectedIdentity);
    const sync = $('f_sync') ? $('f_sync').checked : true;
    const targets = (sync ? refs : [refs[0]]).map(r => r.c);

    const val = id => ($(id)?.value ?? '').trim();
    const applyTo = c => {
      for (const [fid, key] of TEXT_FIELDS) {
        const v = val(fid);
        if (v) c[key] = v; else delete c[key];
      }
      // Image: normalize onto imageUrl, drop the lowercase variant entirely.
      const img = val('f_imageUrl');
      if (img) c.imageUrl = img; else delete c.imageUrl;
      delete c.imageurl;
      // Booleans: present-and-true only.
      if ($('f_withdrawn').checked) c.withdrawn = true; else delete c.withdrawn;
      if ($('f_disqualified').checked) c.disqualified = true; else delete c.disqualified;
    };
    targets.forEach(applyTo);

    dirty = true;
    updateDirty();
    renderRace(); // refresh chips (name/party/badges may have changed)
    const scope = sync && refs.length > 1 ? ` across ${refs.length} phases` : '';
    toast(`Applied${scope} — click 💾 Save file to write to disk`);
  }

  function updateDirty() {
    const dot = $('dirtyDot');
    if (dot) dot.textContent = dirty ? '● unsaved changes' : '';
    $('fileStatus').textContent = $('fileStatus').textContent.replace(/ · unsaved$/, '') + (dirty ? ' · unsaved' : '');
  }

  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ── Helpers ──────────────────────────────────────────────────────────────────

  function partyKey(party) {
    const p = (party || '').toLowerCase();
    if (p.includes('democrat')) return 'D';
    if (p.includes('republican')) return 'R';
    return 'other';
  }

  function badges(c) {
    let out = '';
    if (c.isIncumbent || c.type === 'incumbent') out += ' <span class="mini-badge mb-inc">INC</span>';
    if (c.withdrawn) out += ' <span class="mini-badge mb-wd">WD</span>';
    if (c.disqualified) out += ' <span class="mini-badge mb-dq">DQ</span>';
    return out;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.style.display = 'none', 3000);
  }
</script>
</body>
</html>
