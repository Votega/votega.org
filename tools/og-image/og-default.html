<!doctype html>
<!--
  Source for the default Open Graph / Twitter share card: /assets/img/og-default.png (1200x630).
  Regenerate with tools/og-image/build.sh (renders this file with headless Chromium).
  Brand: Georgia Peach & Clay (assets/img/brand/style-guide-peach.html). Page ground #FFFAF4, ink #2B2118,
  clay #B4521F, Tier 1 horizontal logo with tagline. Nonpartisan: no party colors. Public Sans loads
  from Google Fonts (needs network at render time) and falls back to system sans.
  Colors here are literal because this file is rendered offline to a PNG, not served as site CSS.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Public Sans", "Liberation Sans", Arial, sans-serif;
    background: #FFFAF4;
    color: #2B2118;
    position: relative;
    overflow: hidden;
  }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #B4521F; }
  .frame {
    position: absolute; inset: 0 0 18px 0;
    padding: 76px 84px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .kicker {
    font-size: 17px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #8A3B12; font-weight: 700;
  }
  .logo { width: 860px; display: block; margin-left: -6px; }
  .sub { font-size: 34px; line-height: 1.35; color: #2B2118; max-width: 24ch; font-weight: 400; }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .domain { font-size: 30px; font-weight: 700; }
  .domain .dot { color: #B4521F; }
  .pill {
    font-size: 16px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: #8A3B12; border: 2px solid #E6C9B0; padding: 11px 20px; border-radius: 999px;
    background: #FBEFE4;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="kicker">Georgia Voter Information</div>
    <div>
      <img class="logo" src="../../assets/img/brand/logo/svg/votega-horizontal.svg" alt="VoteGA.org">
      <div class="sub" style="margin-top:28px">Representatives, elections, bills &amp; open civic data for Georgia.</div>
    </div>
    <div class="bottom">
      <div class="domain">votega<span class="dot">.</span>org</div>
      <div class="pill">Nonpartisan &middot; Public Data</div>
    </div>
  </div>
  <div class="band"></div>
</body>
</html>
