<script src="assets/scripts/campaign-finance.js"></script>
<script>
  const RACES_URL       = 'assets/data/races.json';
  const CONGRESS_URL    = 'assets/data/current-members.json';
  const GA_MEMBERS_URL  = 'assets/data/ga-members.json';

  const _params              = new URLSearchParams(window.location.search);
  const candidateId          = _params.get('id');
  const incumbentMemberId    = _params.get('memberId');
  const incumbentMemberSource = _params.get('memberSource') || 'congress';
  const incumbentRaceId      = _params.get('raceId');

  function getBasePath() {
    return window.location.pathname.includes('/votega.org-TEST/') ? '/votega.org-TEST/' : '/';
  }

  function partyClass(party) {
    if (!party) return 'party-other';
    const p = party.toLowerCase();
    if (p.includes('republican')) return 'party-R';
    if (p.includes('democrat'))   return 'party-D';
    return 'party-other';
  }

  function renderCandidate(candidate, race, phaseName) {
    const basePath   = getBasePath();
    const distLabel  = race.district ? ` District ${race.district}` : '';
    // Phase names are data, so map them rather than assuming anything that isn't
    // a primary is the general — that mislabeled runoff and special-election
    // candidates. Unknown phases fall back to a capitalized form of their key.
    const PHASE_LABELS = { primary: 'Primary', runoff: 'Runoff', general: 'General Election', special: 'Special Election' };
    const phaseLabel = PHASE_LABELS[phaseName]
      || (phaseName ? phaseName[0].toUpperCase() + phaseName.slice(1) : 'Election');
    const raceLabel  = `${race.displayTitle || (race.chamber + distLabel)} — ${race.cycle} ${phaseLabel}`;
    const raceUrl    = `${basePath}race.html?id=${encodeURIComponent(race.id)}`;
    const isFederal  = race.level === 'federal';
    const isIncumbent = candidate.isIncumbent || candidate.type === 'incumbent';
    const isWithdrawn     = !!candidate.withdrawn;
    const isDisqualified  = !!candidate.disqualified;

    // Link to member profile page when this candidate has a legislative record
    const existingMemberId = candidate.existingMemberId || '';
    const memberSource     = candidate.existingMemberSource || '';
    const memberUrl = existingMemberId
      ? memberSource === 'congress'
        ? `${basePath}member.html?bioguideId=${encodeURIComponent(existingMemberId)}#votingHistory`
        : `${basePath}ga-member.html?id=${encodeURIComponent(existingMemberId)}#votingHistory`
      : null;
    const memberRecordLabel = memberSource === 'congress' ? 'View Congressional record' : 'View legislative record';

    // Photo: use candidate image if available; fall back to bioguide photo for known members
    const photoSrc = candidate.imageUrl || (existingMemberId
      ? `https://bioguide.congress.gov/bioguide/photo/${existingMemberId[0]}/${existingMemberId}.jpg`
      : '');
    const photoHtml = photoSrc
      ? `<img class="candidate-photo" src="${photoSrc}" alt="${candidate.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'candidate-photo-placeholder',textContent:'👤'}))">`
      : `<div class="candidate-photo-placeholder">👤</div>`;

    // Role and party badges
    const roleBadge = isDisqualified
      ? `<span class="role-badge role-disqualified">Disqualified</span>`
      : isWithdrawn
        ? `<span class="role-badge role-withdrawn">Withdrawn</span>`
        : isIncumbent
          ? `<span class="role-badge role-incumbent">Incumbent</span>`
          : '';

    // Detail fields
    const rows = [];
    if (candidate.occupation) rows.push(['Occupation', candidate.occupation]);
    if (candidate.county)     rows.push(['County', candidate.county]);
    if (candidate.party)      rows.push(['Party', candidate.party]);
    if (candidate.email)      rows.push(['Email', `<a href="mailto:${candidate.email}">${candidate.email}</a>`]);
    if (candidate.website)    rows.push(['Website', `<a href="${candidate.website}" target="_blank" rel="noopener">${candidate.website} ↗</a>`]);

    const detailsHtml = rows.length ? `
      <div class="profile-details">
        <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      </div>` : '';

    const bioHtml = candidate.bio
      ? `<div class="bio-section"><p>${candidate.bio}</p></div>` : '';

    // Link to legislative record when candidate has a member profile
    const memberRecordHtml = memberUrl
      ? `<a class="member-record-link" href="${memberUrl}">${memberRecordLabel} →</a>`
      : '';

    const serviceHtml = candidate.serviceHistory ? serviceHistoryHtml(candidate.serviceHistory) : '';

    // For federal candidates with no prior record (and not a known member), show a contextual note
    const noRecordHtml = isFederal && !candidate.bio && !memberUrl ? `
      <div class="no-record-note">
        This candidate has no prior U.S. Congressional record on file, or they are running for a different chamber.
      </div>` : '';

    document.title = `${candidate.name} — Candidate Profile`;

    document.getElementById('candidateContent').innerHTML = `
      <div class="candidate-header">
        ${photoHtml}
        <div class="candidate-header-info">
          <h1>${candidate.name}</h1>
          ${roleBadge}
          <span class="party-badge ${partyClass(candidate.party)}">${candidate.party || 'Unknown party'}</span>
          <div class="race-context">Running for: <a href="${raceUrl}">${raceLabel}</a></div>
        </div>
      </div>

      ${detailsHtml}
      ${memberRecordHtml}
      ${serviceHtml}
      ${noRecordHtml}
      ${bioHtml}

      <div id="campaignFinance" class="finance-section"></div>

      <div class="back-link"><a href="${raceUrl}">← Back to ${race.displayTitle || (race.chamber + distLabel)} race</a></div>`;
  }

  // Money formatting and all FEC/PeachFile candidate matching live in the shared
  // assets/scripts/campaign-finance.js module (also used by race.html).
  const fmtMoney = CampaignFinance.fmtMoney;

  // This page renders most values unescaped via template literals; these finance
  // strings come from an external API, so escape them at the point of use.
  function escHtmlGa(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  async function loadCampaignFinance(candidate, race) {
    const container = document.getElementById('campaignFinance');
    if (!container) return;

    const isFederal = (race.level || '') === 'federal';

    if (!isFederal) {
      // State candidates: figures come from the Georgia Ethics Commission's PeachFile
      // system, collected at build time (the API is CORS origin-locked). PeachFile
      // replaced the old eFile system on Jan 1, 2026 and holds only records from that
      // date forward — anything earlier stays on the legacy records search.
      const searchLink = `<a href="https://peachfile.ethics.ga.gov/public/cf/publiccandidate" target="_blank" rel="noopener">Search PeachFile ↗</a>`;
      const footer = `
        <p class="finance-meta">
          Source: <a href="https://peachfile.ethics.ga.gov/public/cf/publiccandidate" target="_blank" rel="noopener">Georgia Ethics Commission ↗</a>
          &nbsp;·&nbsp; Covers filings from Jan 1, 2026 onward; for earlier records use the
          <a href="https://ethics.ga.gov/records-search-all/" target="_blank" rel="noopener">legacy records search ↗</a>.
        </p>`;
      // Shown only alongside actual figures. The three totals are not expected to net,
      // and that is by statute rather than a data problem: O.C.G.A. 21-5-34(b)(1)(D)
      // totals contributions and expenditures per ELECTION CYCLE, while "net balance on
      // hand" is carried forward from the previous cycle. An election cycle runs from
      // the day after one election to the next election for that same office
      // (21-5-3(10)) — so this is permanent, not an artifact of the Jan 1 2026 PeachFile
      // migration, which is what an earlier version of this note incorrectly blamed.
      // Measured: only ~36% of filers have raised - spent == cash on hand.
      //
      // The staleness line matters too: 21-5-34(c) sets reports at Jan 31 / Apr 30 /
      // Jul 31 / Oct 20 with a five-day grace period, so figures can be ~3 months old.
      // Without saying so, a stale $0 next to a fundraising story reads as a site bug.
      const reconcileNote = `
        <p class="finance-meta" style="margin-top:0.35rem;">
          These are committee totals as reported to the Commission, current as of each
          committee's most recent required report — reports are due in January, April,
          July, and October, so figures may be several months old. Under state law
          contributions and expenditures are totaled for each election cycle while cash
          on hand carries forward from the previous cycle, so the three figures are not
          expected to net.
        </p>`;

      const data = await CampaignFinance.getGaFinanceData();
      if (!data) {
        container.innerHTML = `
          <h3>Campaign Finance</h3>
          <p class="finance-meta">Finance data unavailable. ${searchLink}</p>`;
        return;
      }

      // A reviewed decision always wins over the automatic match.
      const key = candidate.id || candidate.existingMemberId || '';
      const override = data.candidateOverrides?.[key];

      let filer = null, ambiguous = false;
      if (override?.noFiling) {
        filer = null;
      } else if (override?.filerEntityId) {
        filer = data.filers?.[override.filerEntityId] || null;
      } else {
        const hits = CampaignFinance.findGaFilers(candidate.name, race.chamber, race.district, data);
        if (hits.length === 1) filer = data.filers[hits[0]];
        else if (hits.length > 1) ambiguous = true;
      }

      if (ambiguous) {
        // Several filings match and no one has picked between them. Showing one would
        // risk understating a candidate whose money sits in another committee.
        container.innerHTML = `
          <h3>Campaign Finance</h3>
          <p class="finance-meta">
            More than one campaign filing matches this candidate, so no totals are shown
            here. ${searchLink} to view them.
          </p>${footer}`;
        return;
      }

      if (!filer) {
        container.innerHTML = `
          <h3>Campaign Finance</h3>
          <p class="finance-meta">
            No campaign finance filing found for this candidate in the
            ${escHtmlGa(String(data.metadata?.cycle ?? ''))} cycle — they may not have filed,
            or may be running for another office. ${searchLink}
          </p>${footer}`;
        return;
      }

      container.innerHTML = `
        <h3>Campaign Finance <small style="font-weight:normal;font-size:0.75rem;color:#777;">Source: GA Ethics Commission</small></h3>
        <div class="finance-cards">
          <div class="finance-card raised">
            <div class="finance-card-label">Total Raised</div>
            <div class="finance-card-value">${fmtMoney(filer.totalRaised)}</div>
          </div>
          <div class="finance-card spent">
            <div class="finance-card-label">Total Spent</div>
            <div class="finance-card-value">${fmtMoney(filer.totalSpent)}</div>
          </div>
          <div class="finance-card cash">
            <div class="finance-card-label">Cash on Hand</div>
            <div class="finance-card-value">${fmtMoney(filer.cashOnHand)}</div>
          </div>
        </div>
        <p class="finance-meta">${escHtmlGa(filer.electionCycle || '')}${filer.office ? ' · ' + escHtmlGa(filer.office) : ''}</p>
        ${footer}${reconcileNote}`;
      return;
    }

    // Federal: read from pre-fetched static file
    const fecData = await CampaignFinance.getFecData();
    if (!fecData) {
      container.innerHTML = `
        <h3>Campaign Finance</h3>
        <p style="font-size:0.875rem;color:#666;">
          Finance data unavailable.
          <a href="${CampaignFinance.fecSearchUrl()}" target="_blank" rel="noopener">Search FEC.gov ↗</a>
        </p>`;
      return;
    }

    const fecCycle = fecData.metadata?.cycle ?? null;
    const fecId = CampaignFinance.findFecId(fecData, candidate, race);

    const entry = fecId ? fecData.candidates?.[fecId] : null;
    if (!entry) {
      container.innerHTML = `
        <h3>Campaign Finance</h3>
        <p style="font-size:0.875rem;color:#666;">
          No FEC filing found for this candidate.
          <a href="${CampaignFinance.fecSearchUrl(fecCycle)}" target="_blank" rel="noopener">Search FEC.gov ↗</a>
        </p>`;
      return;
    }

    const cycleLabel = CampaignFinance.cycleLabelFor(fecCycle) || 'election cycle';
    const coverageNote = entry.coverageEndDate
      ? `${cycleLabel} · Through ${new Date(entry.coverageEndDate).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`
      : cycleLabel;

    const employersHtml = (entry.topEmployers || []).length ? `
      <h4 style="font-size:0.88rem;margin:1.25rem 0 0.25rem 0;color:#374151;">Top Donors by Employer</h4>
      <table class="employers-table">
        <thead><tr><th>Employer</th><th>Donors</th><th>Total</th></tr></thead>
        <tbody>
          ${entry.topEmployers.map(e => `
            <tr>
              <td>${e.employer}</td>
              <td>${e.count}</td>
              <td>${fmtMoney(e.total)}</td>
            </tr>`).join('')}
        </tbody>
      </table>` : '';


    container.innerHTML = `
      <h3>Campaign Finance <small style="font-weight:normal;font-size:0.75rem;color:#777;">Source: FEC</small></h3>
      <div class="finance-cards">
        <div class="finance-card raised">
          <div class="finance-card-label">Total Raised</div>
          <div class="finance-card-value">${fmtMoney(entry.totalRaised)}</div>
        </div>
        <div class="finance-card spent">
          <div class="finance-card-label">Total Spent</div>
          <div class="finance-card-value">${fmtMoney(entry.totalSpent)}</div>
        </div>
        <div class="finance-card cash">
          <div class="finance-card-label">Cash on Hand</div>
          <div class="finance-card-value">${fmtMoney(entry.cashOnHand)}</div>
        </div>
        ${entry.totalIndividual != null ? `
        <div class="finance-card" style="background:#f5f3ff;border:1px solid #ddd6fe;">
          <div class="finance-card-label" style="color:#5b21b6;">From Individuals</div>
          <div class="finance-card-value" style="color:#6d28d9;">${fmtMoney(entry.totalIndividual)}</div>
        </div>` : ''}
      </div>
      <p class="finance-meta">${coverageNote}</p>
      <p class="finance-meta"><a href="${entry.fecUrl}" target="_blank" rel="noopener">View full FEC filing ↗</a></p>
      ${employersHtml}`;
  }

  function buildServiceHistory(member, memberSource) {
    const currentYear = new Date().getFullYear();

    if (memberSource === 'congress') {
      const raw = member.terms?.item;
      const termsArr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      if (!termsArr.length) return null;

      const sorted = [...termsArr].sort((a, b) => (a.startYear || 0) - (b.startYear || 0));
      const currentTerm = sorted[sorted.length - 1];
      const currentChamber = currentTerm.chamber || '';
      const currentSince   = currentTerm.startYear;

      // Consolidate prior stints by chamber (terms predating current chamber entry)
      const priorMap = {};
      for (const t of sorted.slice(0, -1)) {
        if (!t.chamber || t.chamber === currentChamber) continue;
        const ch = t.chamber;
        if (!priorMap[ch]) {
          priorMap[ch] = { startYear: t.startYear, endYear: t.endYear || null };
        } else {
          if (t.startYear < priorMap[ch].startYear) priorMap[ch].startYear = t.startYear;
          if (t.endYear && (!priorMap[ch].endYear || t.endYear > priorMap[ch].endYear)) priorMap[ch].endYear = t.endYear;
        }
      }
      const priorStints = Object.entries(priorMap).map(([chamber, r]) => ({ chamber, ...r }));
      const leadership  = (member.leadership || []).map(l => l.title).filter(Boolean);

      return { source: 'congress', currentChamber, currentSince, priorStints, leadership };
    }

    if (memberSource === 'state') {
      if (!member.termStartYear) return null;
      return {
        source: 'state',
        currentChamber: member.chamber || '',
        currentSince: member.termStartYear,
        priorStints: [],
        leadership: [],
      };
    }

    return null;
  }

  function serviceHistoryHtml(sh) {
    if (!sh) return '';
    const currentYear = new Date().getFullYear();

    const chamberLabel = ch => {
      if (!ch) return ch;
      if (sh.source === 'congress') {
        if (ch.includes('Senate')) return 'U.S. Senate';
        if (ch.includes('House'))  return 'U.S. House of Representatives';
      }
      return ch;
    };

    const yearsIn = since => {
      const n = currentYear - since;
      return n === 1 ? '1 year' : `${n} years`;
    };

    const rows = [];
    rows.push([chamberLabel(sh.currentChamber) || 'Current office',
               `Since ${sh.currentSince} (${yearsIn(sh.currentSince)})`]);

    for (const p of sh.priorStints) {
      const range = p.endYear ? `${p.startYear}–${p.endYear}` : `since ${p.startYear}`;
      rows.push([chamberLabel(p.chamber), range]);
    }

    if (sh.leadership.length) {
      rows.push(['Leadership', sh.leadership.join(', ')]);
    }

    return `
      <div class="service-section">
        <h3>Service History</h3>
        <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      </div>`;
  }

  async function initIncumbent(raceId, memberId, memberSource) {
    try {
      const membersUrl = memberSource === 'congress' ? CONGRESS_URL : GA_MEMBERS_URL;
      const [racesRes, membersRes] = await Promise.all([fetch(RACES_URL), fetch(membersUrl)]);
      if (!racesRes.ok) throw new Error(`HTTP ${racesRes.status}`);

      const racesData = await racesRes.json();
      const race = (racesData.races || []).find(r => r.id === raceId);
      if (!race) {
        document.getElementById('candidateContent').innerHTML =
          '<p>Race not found. <a href="elections.html">View all races</a></p>';
        return;
      }

      let member = null;
      if (membersRes.ok) {
        const membersData = await membersRes.json();
        const members = membersData.members || [];
        member = memberSource === 'congress'
          ? members.find(m => m.bioguideId === memberId)
          : members.find(m => m.id === memberId);
      }

      if (!member) {
        document.getElementById('candidateContent').innerHTML =
          '<p>Member not found. <a href="elections.html">View all races</a></p>';
        return;
      }

      // Find the incumbent's ballot entry in races.json for manually-curated fields (bio, website)
      let incumbentEntry = null;
      for (const phase of Object.values(race.phases || {})) {
        for (const candidates of Object.values(phase.ballots || {})) {
          const match = candidates.find(c => c.memberId === memberId || c.existingMemberId === memberId);
          if (match) { incumbentEntry = match; break; }
        }
        if (incumbentEntry) break;
      }

      // Build a candidate-like object from member data
      const name = memberSource === 'congress'
        ? [member.firstName, member.lastName].filter(Boolean).join(' ').trim() || member.name || ''
        : (member.name || '');
      const candidate = {
        name,
        party: member.partyName || member.party || '',
        imageUrl: member.depiction?.imageUrl || member.imageUrl || '',
        bio: incumbentEntry?.bio || '',
        website: incumbentEntry?.website || '',
        isIncumbent: true,
        existingMemberId: memberId,
        existingMemberSource: memberSource,
        serviceHistory: buildServiceHistory(member, memberSource),
      };

      renderCandidate(candidate, race, race.activePhase);
      loadCampaignFinance(candidate, race);
    } catch (err) {
      console.error(err);
      document.getElementById('candidateContent').innerHTML =
        `<p>Error loading profile: ${err.message}. <a href="elections.html">Go back</a></p>`;
    }
  }

  async function init() {
    // Incumbent route: ?raceId=...&memberId=...
    if (incumbentMemberId && incumbentRaceId) {
      initIncumbent(incumbentRaceId, incumbentMemberId, incumbentMemberSource);
      return;
    }

    // Challenger route: ?id=...
    if (!candidateId) {
      document.getElementById('candidateContent').innerHTML =
        '<p>No candidate specified. <a href="elections.html">View all races</a></p>';
      return;
    }

    try {
      const res = await fetch(RACES_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const races = data.races || [];

      let found = null, foundRace = null, foundPhase = null;

      // Search every phase the race actually declares, not a fixed list. A
      // hardcoded ['primary','general'] stranded anyone who appears only in a
      // `runoff` or `special` phase — e.g. the GA-13 special-election runoff
      // candidates, who are on no primary or general ballot. Phase names are
      // data, so enumerate them rather than predicting them; the race's own
      // activePhase is tried first so a candidate in several phases resolves
      // to the contest they are currently running in.
      outer: for (const race of races) {
        const phaseNames = Object.keys(race.phases || {})
          .sort((a, b) => (a === race.activePhase ? -1 : b === race.activePhase ? 1 : 0));
        for (const phaseName of phaseNames) {
          const phase = race.phases?.[phaseName];
          if (!phase) continue;

          // Match on id alone. Requiring type === 'challenger' made every incumbent
          // that carries an `id` instead of a `memberId` unreachable — 213 of them,
          // all state and state-executive seats. race.html links those through
          // renderChallengerCard() (it falls back whenever an incumbent has no
          // memberId), so the link existed and the profile always said "not found".
          // `id` is unique per candidate, so the type filter only ever excluded.
          let match = (phase.candidates || []).find(c => c.id === candidateId);

          if (!match && phase.ballots) {
            for (const ballotCandidates of Object.values(phase.ballots)) {
              match = ballotCandidates.find(c => c.id === candidateId);
              if (match) break;
            }
          }

          if (match) { found = match; foundRace = race; foundPhase = phaseName; break outer; }
        }
      }

      if (!found) {
        document.getElementById('candidateContent').innerHTML =
          '<p>Candidate not found. <a href="elections.html">View all races</a></p>';
        return;
      }

      // If challenger has prior congressional/state service, fetch member data for service history
      if (found.existingMemberId) {
        try {
          const membersUrl = found.existingMemberSource === 'state' ? GA_MEMBERS_URL : CONGRESS_URL;
          const membersRes = await fetch(membersUrl);
          if (membersRes.ok) {
            const membersData = await membersRes.json();
            const members = membersData.members || [];
            const member = found.existingMemberSource === 'state'
              ? members.find(m => m.id === found.existingMemberId)
              : members.find(m => m.bioguideId === found.existingMemberId);
            if (member) found.serviceHistory = buildServiceHistory(member, found.existingMemberSource || 'congress');
          }
        } catch (e) { /* non-fatal — render without service history */ }
      }

      renderCandidate(found, foundRace, foundPhase);
      loadCampaignFinance(found, foundRace);
    } catch (err) {
      console.error(err);
      document.getElementById('candidateContent').innerHTML =
        `<p>Error loading candidate: ${err.message}. <a href="elections.html">Go back</a></p>`;
    }
  }

  init();
</script>
