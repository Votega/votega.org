<!DOCTYPE html>
<!--
  Standalone offline fallback for the Vote GA PWA. Intentionally has NO Jekyll
  front matter and NO external (CDN/font) dependencies, so the service worker can
  serve it with no network connection. Keep it self-contained.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0085a1">
  <title>Offline — Vote GA</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f8f8; color: #333;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #14141c; color: #e6e6e6; }
      .card { background: #1e1e28 !important; }
      .btn-ghost { color: #4fc3dd !important; border-color: #33586a !important; }
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      background: #fff; border-radius: 16px; padding: 40px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 18px; background: linear-gradient(180deg,#0085a1,#006c84);
      display: flex; align-items: center; justify-content: center;
    }
    .mark svg { width: 42px; height: 42px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; line-height: 1.5; opacity: .85; font-size: .98rem; }
    .btn {
      display: inline-block; cursor: pointer; font: inherit; font-weight: 600;
      padding: 11px 22px; border-radius: 10px; text-decoration: none;
      border: 1px solid transparent;
    }
    .btn-primary { background: #0085a1; color: #fff; }
    .btn-primary:hover { background: #006c84; }
    .btn-ghost { background: transparent; color: #0085a1; border-color: #cfe4ea; margin-top: 10px; }
    .hint { font-size: .82rem; opacity: .6; margin-top: 22px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Vote GA can't reach the network right now. Pages you've already opened —
       like your sample ballot — are still available from this device.</p>
    <button class="btn btn-primary" onclick="location.reload()">Try again</button>
    <br>
    <a class="btn btn-ghost" href="/">Go to home</a>
    <div class="hint">Nonpartisan civic information for Georgia voters · votega.org</div>
  </main>
  <script>
    // Auto-retry the moment connectivity returns.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
