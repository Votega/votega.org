name: Cache government candidate portraits (weekly, Sun 11:00 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one tracking issue

# Downloads government-hosted portraits (congress.gov, legis.ga.gov), resizes
# them, and commits the local copies plus candidate-image-cache.json. The script
# is idempotent — it skips any portrait already cached — so a week with no new
# candidates or members commits nothing. Non-government photos are never cached
# here (see scripts/fetch_candidate_images.py and CLAUDE.md); they stay
# hot-linked and are only lazy-loaded by the render layer.
#
# Weekly is plenty: portraits change far less often than the rosters do, and the
# rosters (which this scans) are refreshed by their own daily workflows first.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 0'  # weekly, Sunday 11:00 UTC (after the Sunday data jobs)

jobs:
  cache-portraits:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Cache government portraits
        id: generate
        run: python scripts/fetch_candidate_images.py

      # Tier 1 is the manifest against itself and the disk: a count that does
      # not match, an entry whose file is missing, and the copyright invariant
      # -- a source on any host that is not a declared .gov one. Tier 2 is what
      # the sources did: portraits that failed to download (named), entries
      # added or dropped, image files nothing references. The two asserts this
      # replaces were already tier-1 shaped; the step just had no report, so a
      # portrait that kept failing was invisible. See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate manifest
        run: |
          python scripts/validate_candidate_images.py assets/data/candidate-image-cache.json             --baseline-ref HEAD             --report-out "$RUNNER_TEMP/candidate-images-changes.md"

      - name: Commit and push cached portraits
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/img/candidates assets/data/candidate-image-cache.json
          if git diff --cached --quiet; then
            echo "No new portraits to commit"
          else
            git commit -m "Cache government candidate portraits"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - portraits were NOT committed"
              exit 1
            fi
          fi

      # After the commit: the report describes a cache that has already shipped.
      # One issue, refreshed in place.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Candidate portrait cache: material changes"
        run: |
          set -e
          report="$RUNNER_TEMP/candidate-images-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material changed - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE"             --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-candidate-images."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose (an `if: failure()` step placed earlier never runs).
      # Condition is "we have a generated manifest and are about to lose it".
      - name: Preserve the generated files
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-candidate-images
          path: |
            assets/data/candidate-image-cache.json
            assets/img/candidates
          if-no-files-found: ignore
          retention-days: 14
