name: Update Congress.gov current members data (daily, 06:00 UTC)

permissions:
  contents: write  # Allows the bot to commit and push changes
  issues: write    # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Check sponsorship fetch/slice invariants (no network)
        run: python scripts/test_federal_sponsorship.py

      - name: Generate current member data (includes leadership positions)
        id: generate
        run: |
          echo "Running script..."
          python scripts/generate_current_members_data.py assets/data/current-members.json
          echo "Script completed"
          echo "Checking if file exists:"
          ls -la assets/data/current-members.json 2>/dev/null || echo "File not found"
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      # Two tiers, and the split is the point. Tier 1 is the data against
      # ITSELF -- a metadata.count that disagrees with the member list, a
      # missing required field, a duplicated bioguide ID, an index entry naming
      # someone the roster does not hold, a slice whose row count disagrees
      # with the inline summary written in the same run, more seats than
      # Congress has. No fact about Congress can make those true, so they fail
      # the run and nothing is committed. Tier 2 is a chamber short of a full
      # house, a Congress.gov detail outage, a member whose sponsorship record
      # came back null, a Congress three weeks old with nothing introduced yet;
      # every one of those is something the world can legitimately do, so they
      # are written to a report and the data is committed anyway.
      #
      # The two heredocs this replaces gated on three things the world
      # controls, on a DAILY job whose regenerated file dies with the runner:
      # `count >= 500` (a floor on the number of seated members),
      # `failures <= max(5, count*0.05)` (an upstream detail-endpoint outage),
      # and `s is not None` on every Georgia member's inline sponsorship
      # summary -- which gated on a degraded state the pipeline DESIGNS FOR:
      # fetch_member_legislation() returns None rather than a truncated list
      # when one page fails, and the entity page already reads that as "no
      # tab". One flaky page for one of sixteen members aborted the job before
      # the commit step and discarded the other fifteen members' fresh records
      # along with the whole 500-member roster. See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6, and the header of
      # update-local-government.yml for the first workflow to make this split.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_current_members.py \
            --data-dir assets/data \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/federal-members-changes.md"

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/current-members.json \
                     assets/data/federal-sponsorship-index.json \
                     assets/data/federal-sponsorship
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update current Congress member data (members, leadership, GA delegation sponsorship)"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit, not before: the report describes data that has already
      # shipped. One issue, refreshed in place, so the history of vacancies and
      # failed fetches lives in one thread.
      #
      # The body is rewritten every run but a comment is only added when the body
      # actually CHANGED. This job is daily and a vacancy stands for months, so
      # commenting unconditionally would be the pile of notifications the single
      # tracking issue exists to avoid — while a real change (a new vacancy, a
      # member's sponsorship record going missing) still pings.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Federal members: vacancies, failed fetches and material changes"
        run: |
          set -e
          report="$RUNNER_TEMP/federal-members-changes.md"
          if [ ! -s "$report" ] || grep -q 'no material change this run' "$report"; then
            echo "A full house, every member enriched, nothing material — skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            gh issue view "$existing" --json body --jq .body > "$RUNNER_TEMP/current-body.md" || true
            if diff -q "$RUNNER_TEMP/current-body.md" "$report" >/dev/null 2>&1; then
              echo "Issue #$existing already says this — leaving it alone."
              exit 0
            fi
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-current-members — the federal members report changed."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Published from here, not left to publish-federal-delegation-to-ga-federal-legislators.yml's
      # `paths` trigger: that trigger watches a file this workflow writes, and
      # GitHub does not fire `push` for a commit authored by the default
      # GITHUB_TOKEN. The standalone workflow had run 4 times in two months — all of them manual,
      # or on a human commit touching the script — while this data updated daily.
      - name: Publish GA federal delegation to ga-federal-legislators
        env:
          GA_FEDERAL_LEGISLATORS: ${{ secrets.GA_FEDERAL_LEGISLATORS }}
        run: python3 scripts/publish_federal_delegation.py

      # Last on purpose: a step's `if` is evaluated when the runner reaches it, so
      # an `if: failure()` step placed before the failing step never runs at all.
      # Sitting here it catches a tier-1 rejection, a commit or push failure, and
      # a publish failure.
      #
      # The condition is "we have generated files and are about to lose them", not
      # just "validation failed": this run costs ~131 Congress.gov pages for the
      # sponsorship record alone, and the output dies with the runner either way.
      - name: Preserve the generated files
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-federal-members
          path: |
            assets/data/current-members.json
            assets/data/federal-sponsorship-index.json
            assets/data/federal-sponsorship
          if-no-files-found: ignore
          retention-days: 14
