name: Update Congress.gov current members data (daily, 06:00 UTC)

permissions:
  contents: write  # Allows the bot to commit and push changes
  
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Generate current member data (includes leadership positions)
        run: |
          echo "Running script..."
          python scripts/generate_current_members_data.py assets/data/current-members.json
          echo "Script completed"
          echo "Checking if file exists:"
          ls -la assets/data/current-members.json 2>/dev/null || echo "File not found"
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Validate generated data
        run: |
          if [ ! -f assets/data/current-members.json ]; then
            echo "Error: current-members.json was not generated"
            exit 1
          fi
          python -c "
          import json, sys
          d = json.load(open('assets/data/current-members.json'))
          members = d['members']
          count = d['metadata']['count']
          print(f'Validated: {count} Congress members')
          assert count >= 500, f'Expected 500+ members, got {count}'
          assert count == len(members), f'metadata.count {count} != actual member count {len(members)}'
          required = ['bioguideId', 'name', 'partyName', 'state', 'terms']
          for m in members:
              for field in required:
                  assert field in m, f'Member {m.get(\"name\",\"?\")} missing required field: {field}'

          failures = d['metadata'].get('enrichmentFailures', 0)
          print(f'Detail-enrichment failures: {failures}/{count}')
          assert failures <= max(5, count * 0.05), f'Too many enrichment failures ({failures}/{count}) — indicates a broad API outage'

          print('All integrity checks passed')
          "

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/current-members.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update current Congress member data (includes leadership positions)"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # Published from here, not left to publish-federal-delegation-to-ga-federal-legislators.yml's
      # `paths` trigger: that trigger watches a file this workflow writes, and
      # GitHub does not fire `push` for a commit authored by the default
      # GITHUB_TOKEN. The standalone workflow had run 4 times in two months — all of them manual,
      # or on a human commit touching the script — while this data updated daily.
      - name: Publish GA federal delegation to ga-federal-legislators
        env:
          GA_FEDERAL_LEGISLATORS: ${{ secrets.GA_FEDERAL_LEGISLATORS }}
        run: python3 scripts/publish_federal_delegation.py
