name: Validate local officials

# Officials is the hand-curated, no-API domain, so this validator is its only
# automated guard. It also cross-checks _data/places.yml (jurisdiction id must
# equal a place slug), so a change to EITHER file re-runs it.
on:
  push:
    paths:
      - '_data/local_officials.yml'
      - '_data/county_officers.yml'
      - '_data/places.yml'
      - 'scripts/validate_local_officials.py'
      - 'scripts/validate_county_officers.py'
  pull_request:
    paths:
      - '_data/local_officials.yml'
      - '_data/county_officers.yml'
      - '_data/places.yml'
      - 'scripts/validate_local_officials.py'
      - 'scripts/validate_county_officers.py'

jobs:
  validate:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate local_officials.yml
        run: python scripts/validate_local_officials.py

      - name: Validate county_officers.yml
        run: python scripts/validate_county_officers.py
