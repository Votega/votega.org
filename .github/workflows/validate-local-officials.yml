name: Validate local officials

# Officials is the hand-curated, no-API domain, so these validators are its only
# automated guard. They also cross-check _data/places.yml (a jurisdiction id, and
# a city school system's `counties` slugs, must resolve to a place slug), so a
# change to ANY of these files re-runs the job.
#
# school_districts.yml rides here rather than in its own workflow because it is
# the same domain and the same cross-check: hand-curated rosters keyed on
# places.yml. Its validator additionally enforces that Georgia school board seats
# are nonpartisan and that a Superintendent — who is HIRED BY THE BOARD, not
# elected — carries voting:false.
on:
  push:
    paths:
      - '_data/local_officials.yml'
      - '_data/county_officers.yml'
      - '_data/places.yml'
      - 'scripts/validate_local_officials.py'
      - 'scripts/validate_county_officers.py'
      - '_data/school_districts.yml'
      - 'scripts/validate_school_districts.py'
  pull_request:
    paths:
      - '_data/local_officials.yml'
      - '_data/county_officers.yml'
      - '_data/places.yml'
      - 'scripts/validate_local_officials.py'
      - 'scripts/validate_county_officers.py'
      - '_data/school_districts.yml'
      - 'scripts/validate_school_districts.py'

jobs:
  validate:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate local_officials.yml
        run: python scripts/validate_local_officials.py

      - name: Validate county_officers.yml
        run: python scripts/validate_county_officers.py

      - name: Validate school_districts.yml
        run: python scripts/validate_school_districts.py
