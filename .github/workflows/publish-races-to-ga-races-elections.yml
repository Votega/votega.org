name: Publish races.json to ga-races-elections (daily, 07:00 UTC)

# Requires secret: GA_RACES_PUSH_TOKEN
#   A GitHub Personal Access Token (classic) with repo scope on Votega/ga-races-elections.
#   Add it at: votega.org repo → Settings → Secrets and variables → Actions → New repository secret

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # daily at 07:00 UTC (after update-current-members at 06:00)
  push:
    branches: [main]
    paths:
      - 'assets/data/races.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Validate races.json
        run: |
          python -c "
          import json, sys
          with open('assets/data/races.json') as f:
              data = json.load(f)
          races = data.get('races', [])
          print(f'races.json valid: {len(races)} races')
          "

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: Votega/ga-races-elections
          token: ${{ secrets.GA_RACES_PUSH_TOKEN }}
          path: target-repo

      - name: Commit and push to ga-races-elections
        working-directory: target-repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-apply the source file(s) onto the current target tree. Used for the
          # first commit and again after a reset when a push loses a race.
          restage() {
            cp "$GITHUB_WORKSPACE/assets/data/races.json" races.json
            git add races.json
          }

          restage
          if git diff --cached --quiet; then
            echo "No changes — files are already up to date"
            exit 0
          fi

          # Idempotent mirror: on a non-fast-forward push (a concurrent run of
          # this workflow, or the sibling publisher targeting the same repo), take
          # the remote tip and re-apply our file rather than rebasing two
          # pretty-printed JSON snapshots — which would conflict. See the
          # publish-race incident, 2026-08-19.
          pushed=0
          for attempt in 1 2 3; do
            git commit -m "Update races.json ($(date -u '+%Y-%m-%d'))" || true
            if git push; then pushed=1; break; fi
            echo "Push rejected (attempt $attempt) — syncing to remote and re-applying"
            git fetch origin main
            git reset --hard origin/main
            restage
            if git diff --cached --quiet; then
              echo "Remote already carries our content"; pushed=1; break
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Push to ga-races-elections failed after 3 attempts"
            exit 1
          fi