name: Update GA Congress stock trades data (weekly, Sun 10:00 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sundays at 10:00 UTC
    - cron: '0 10 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate GA Congress trades data
        id: generate
        run: python scripts/generate_ga_congress_trades.py assets/data/ga-congress-trades.json

      # Tier 1 gates on the file contradicting itself (totals and per-member
      # counters vs the trades listed). The one baseline gate is the collapse
      # check: a per-filer fetch that fails is skipped by the generator and the
      # member would silently vanish, so a failed fetch for a member who had
      # trades at HEAD (metadata.fetchFailed) or a >50% fall in trades refuses
      # the commit. Everything else is reported. The `--min trades=1
      # --min members=1` floors this replaces were the world's numbers (a
      # delegation can legitimately file nothing), and the default 20% shrink
      # gate only caught a lost member by accident of arithmetic on 5 members.
      # See docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_ga_congress_trades.py assets/data/ga-congress-trades.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/ga-trades-changes.md"

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-congress-trades.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif python scripts/only_keys_changed.py assets/data/ga-congress-trades.json metadata.generatedAt; then
            echo "Only metadata.generatedAt changed — skipping redundant commit"
            git restore --staged assets/data/ga-congress-trades.json
            git checkout -- assets/data/ga-congress-trades.json
          else
            git commit -m "Update GA Congress stock trades data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit: the report describes a record that has already shipped.
      # One issue, refreshed in place; weekly, so the comment is unconditional.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "GA trades: membership and data-quality changes"
        run: |
          set -e
          report="$RUNNER_TEMP/ga-trades-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-ga-congress-trades."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose (a step's `if` is evaluated when the runner reaches it).
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-ga-congress-trades
          path: assets/data/ga-congress-trades.json
          if-no-files-found: ignore
          retention-days: 14
