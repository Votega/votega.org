name: Update VP tie-breaking vote data (weekly, Sun 09:30 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sundays at 09:30 UTC (after federal-votes workflow)
    - cron: '30 9 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate VP tie-breaking vote data
        run: python scripts/generate_vp_tie_votes.py assets/data/vp-tie-votes.json

      - name: Validate generated data
        run: |
          python scripts/validate_data_update.py assets/data/vp-tie-votes.json \
            --metric votes=metadata.count \
            --metric records=len:votes \
            --scope-key metadata.congress

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/vp-tie-votes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update VP tie-breaking vote data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi
