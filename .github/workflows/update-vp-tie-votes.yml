name: Update VP tie-breaking vote data (weekly, Sun 09:30 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      allow_collapse:
        description: 'Commit even though recorded votes at HEAD are missing from the new file (only after inspecting the rejected file)'
        type: boolean
        default: false
  schedule:
    # Weekly on Sundays at 09:30 UTC (after federal-votes workflow)
    - cron: '30 9 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate VP tie-breaking vote data
        id: generate
        run: python scripts/generate_vp_tie_votes.py assets/data/vp-tie-votes.json

      # Tier 1 gates on the file contradicting itself (count, every record a
      # genuine tie, Yea/Nay, one Congress, no duplicates). The one baseline gate
      # is the loss check: recorded votes are immutable and the file is rebuilt
      # whole, so a (session, voteNumber) at HEAD that is gone now means a detail
      # fetch failed or the Senate menu did not parse. It is a set difference, not
      # the 20% shrink it replaces, which let a lost vote through on an 8-vote
      # file (-12.5%). A new Congress starts empty and is exempt. Additions go to
      # the step summary; they are rare enough not to need a tracking issue. See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate generated data
        id: validate
        env:
          ALLOW_COLLAPSE: ${{ inputs.allow_collapse && '--allow-collapse' || '' }}
        run: |
          python scripts/validate_vp_tie_votes.py assets/data/vp-tie-votes.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/vp-tie-votes-changes.md" \
            $ALLOW_COLLAPSE

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/vp-tie-votes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update VP tie-breaking vote data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      - name: Report what changed
        run: |
          report="$RUNNER_TEMP/vp-tie-votes-changes.md"
          if [ -s "$report" ] && ! grep -q 'No material change this run' "$report"; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Last on purpose (a step's `if` is evaluated when the runner reaches it).
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-vp-tie-votes
          path: assets/data/vp-tie-votes.json
          if-no-files-found: ignore
          retention-days: 14
