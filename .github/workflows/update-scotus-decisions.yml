name: Update SCOTUS decisions data (weekly, Sun 10:00 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sundays at 10:00 UTC (SCOTUS terms run Oct–Jun; low activity in summer)
    - cron: '0 10 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate SCOTUS decisions data
        id: generate
        run: python scripts/generate_scotus_decisions.py assets/data/scotus-decisions.json

      # Tier 1 gates on the file contradicting itself (count, terms, duplicate
      # term/docket, date order). The one baseline gate is the loss check: the
      # generator skips a case whose Oyez detail fetch fails and a term whose
      # list fails, and a decided case never legitimately leaves the record, so
      # it now publishes what it failed to get (metadata.detailFetchFailed,
      # emptyTerms) and a failure touching an already-published case refuses
      # the commit. Cases of a term dropped from TERMS are exempt, which is
      # what --scope-key metadata.terms approximated. `--min decisions=1` was
      # the world's number: a newly added term is empty until its first
      # opinions. New decisions and a stale TERMS (the October edit) are
      # reported. See docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_scotus_decisions.py assets/data/scotus-decisions.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/scotus-changes.md"

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/scotus-decisions.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif python scripts/only_keys_changed.py assets/data/scotus-decisions.json metadata.generatedAt; then
            echo "Only metadata.generatedAt changed — skipping redundant commit"
            git restore --staged assets/data/scotus-decisions.json
            git checkout -- assets/data/scotus-decisions.json
          else
            git commit -m "Update SCOTUS decisions data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit: the report describes a record that has already shipped.
      # One issue, refreshed in place; weekly, so the comment is unconditional.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "SCOTUS decisions: new rulings and TERMS reminders"
        run: |
          set -e
          report="$RUNNER_TEMP/scotus-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-scotus-decisions."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Record that the source was checked this run, even when the data step above skipped
      # committing a quiet run. The stale-stamp rule (assets/scripts/freshness.js) measures
      # from the newer of the data's stamp and this day. success() on purpose: a run that
      # failed must NOT refresh the check date, so a broken job goes stale on its own.
      - name: Record data check date
        if: success()
        run: |
          python scripts/record_data_checked.py scotus-decisions
          bash scripts/commit_freshness.sh "Record scotus-decisions check date"

      # Last on purpose (a step's `if` is evaluated when the runner reaches it).
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-scotus-decisions
          path: assets/data/scotus-decisions.json
          if-no-files-found: ignore
          retention-days: 14
