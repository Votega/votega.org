name: Update GA campaign finance data (weekly, Sun 08:30 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 0' # weekly on Sunday at 08:30 UTC

jobs:
  update-ga-campaign-finance:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No API key: the PeachFile public endpoints are unauthenticated. They are
      # CORS origin-locked, which is why this runs at build time rather than in the page.
      - name: Generate GA campaign finance data
        id: generate
        run: python scripts/generate_ga_campaign_finance.py assets/data/ga-campaign-finance.json

      # Two tiers, and the split is the point. Tier 1 is the file against ITSELF:
      # a metadata.count that is not the number of filers, a filer missing
      # totalRaised or office (the member pages read both), a seat or office index
      # naming a filer the file does not hold, a legislative filer its own bySeat
      # forgot, or no filers at all (an empty run has no good data to discard, and
      # the generator refuses to write it anyway). No fact about the Ethics
      # Commission can make those true, so they fail the run and nothing is
      # committed. Tier 2 is coverage and the diff against last week: reported,
      # and the data is committed anyway.
      #
      # The heredoc this replaces gated on `len(by_seat) < 150` and
      # `len(legislative) < 400`: floors on what the SOURCE returns, pinned to the
      # 2026 general (233 seats, 560 legislative filers). They would fire on any
      # cycle with fewer contested seats and on the first weeks of the 2028
      # rollover, and each firing discards a whole week of every other filer's
      # money, which dies with the runner. The failure they were groping at is
      # real -- a partial pull -- but a global count cannot localise it: one seat
      # that had a filer last week and has none now is a fact with a name. The
      # validator enumerates Georgia's 180 + 56 seats and NAMES the ones that lost
      # coverage, the offices that thinned, and (from metadata.incompleteOffices,
      # which the generator now records) the offices whose pagination stopped on a
      # failed page. The generator's own abort on a stale override (a terminated
      # committee) moved to the same report: it dropped a whole run over one id.
      # See docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_ga_campaign_finance.py assets/data/ga-campaign-finance.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/ga-campaign-finance-changes.md"

      # Donor detail (largest gifts, who gave, in/out of state) is a sidecar the pages
      # fetch separately and treat as optional, so a failure here must not cost the
      # totals above their weekly commit. That is why these two steps are
      # continue-on-error — and why the LAST step of the job re-raises their failure:
      # without it a broken donor refresh is invisible (the job is green, notify-
      # workflow-failure never fires, and the panel quietly goes stale).
      #
      # The generator is incremental (a filer whose total has not moved is carried
      # forward) and refuses to replace the committed file with a mostly-failed pull.
      # The validator gates the FILE (tier 1: it contradicts itself) and reports
      # coverage and staleness (tier 2: never gates).
      - name: Generate GA donor summaries
        id: donors
        continue-on-error: true
        run: python scripts/generate_ga_donor_summaries.py

      - name: Validate GA donor summaries
        id: donorval
        if: steps.donors.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/validate_ga_donor_summaries.py assets/data/ga-campaign-finance-donors.json \
            --finance assets/data/ga-campaign-finance.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/ga-donor-summaries-changes.md"

      # A file tier 1 rejected must not reach the commit below. Keep a copy for
      # inspection, then put the committed file back.
      - name: Preserve the rejected donor file
        if: steps.donorval.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-ga-donor-summaries
          path: assets/data/ga-campaign-finance-donors.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore the committed donor file
        if: steps.donorval.outcome == 'failure'
        run: git checkout -- assets/data/ga-campaign-finance-donors.json

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-campaign-finance.json
          if [ -f assets/data/ga-campaign-finance-donors.json ]; then
            git add -f assets/data/ga-campaign-finance-donors.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GA campaign finance data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit, not before: the report describes a record that has
      # already shipped. One issue, refreshed in place, so the history lives in
      # one thread. This job runs weekly, so the comment is unconditional --
      # there is no daily pile to avoid, and the body-diff guard that
      # update-ga-members.yml uses is not needed.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "GA state campaign finance: seats that lost coverage"
        run: |
          set -e
          report="$RUNNER_TEMP/ga-campaign-finance-changes.md"
          if [ ! -s "$report" ] || grep -qi 'no material change this run' "$report"; then
            echo "Nothing material -- skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-ga-campaign-finance."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Same upsert as above, for the donor file: one issue, refreshed in place, keyed on
      # its own title so a stale donor panel is never filed under the totals' issue.
      - name: Report donor summary changes
        if: steps.donorval.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "GA donor summaries: stale or missing donor detail"
        run: |
          set -e
          report="$RUNNER_TEMP/ga-donor-summaries-changes.md"
          if [ ! -s "$report" ] || grep -qi 'no material change this run' "$report"; then
            echo "Nothing material -- skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-ga-campaign-finance."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Record that the source was checked this run, even when the data step above skipped
      # committing a quiet run. The stale-stamp rule (assets/scripts/freshness.js) measures
      # from the newer of the data's stamp and this day. success() on purpose: a run that
      # failed must NOT refresh the check date, so a broken job goes stale on its own.
      - name: Record data check date
        if: success()
        run: |
          python scripts/record_data_checked.py ga-campaign-finance
          bash scripts/commit_freshness.sh "Record ga-campaign-finance check date"

      # Last on purpose: a step's `if` is evaluated when the runner reaches it, so
      # one placed before the failing step never runs. Sitting here it catches a
      # tier-1 rejection, a commit or push failure, and the report step. The
      # condition is "we have a generated file and are about to lose it".
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-ga-campaign-finance
          path: assets/data/ga-campaign-finance.json
          if-no-files-found: ignore
          retention-days: 14

      # The donor steps above are continue-on-error so a donor failure cannot cost the
      # totals their commit. That also makes the failure invisible: the job would end
      # green and notify-workflow-failure (which fires on a failed run) would never
      # open an issue. So, after everything that matters has been committed, fail the
      # job here. This step is deliberately the LAST one, after "Preserve the generated
      # file", so that step's `failure()` condition is not tripped by this deliberate
      # failure and uploads nothing misleading.
      - name: Fail the run if the donor refresh failed
        if: always() && (steps.donors.outcome == 'failure' || steps.donorval.outcome == 'failure')
        run: |
          echo "::error::GA donor summaries failed to generate or validate. The totals were committed; the donor panel keeps its previous data and will fall behind until this is fixed."
          exit 1
