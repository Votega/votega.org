name: Update GA political news (every 3 hours)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, on the hour.
    - cron: '0 */3 * * *'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate GA news data
        id: generate
        run: python scripts/generate_ga_news.py assets/data/ga-news.json

      # Tier 1 gates on the file contradicting itself (count vs items, tag and
      # topic tallies, duplicate ids, a source missing from the chip list).
      # A thin run is tier 2: reported, committed anyway. The
      # `--min items=20` this replaces aborted the job whenever Cloudflare
      # 403'd enough feeds, which happens on healthy days; the file is rebuilt
      # every 3 hours, so a thin run heals itself and discarding it only adds a
      # failure issue. Zero items is still refused, upstream, by the generator
      # (exit 1 before the write, committed file untouched). See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_ga_news.py assets/data/ga-news.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/ga-news-changes.md"

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-news.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GA political news data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit: the report describes a record that has already shipped.
      # Runs every 3 hours, so the issue body is diffed first and only touched
      # (and commented on) when the report actually changed.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "GA news: thin feed runs"
        run: |
          set -e
          report="$RUNNER_TEMP/ga-news-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            gh issue view "$existing" --json body --jq .body > "$RUNNER_TEMP/current-body.md" || true
            if diff -q "$RUNNER_TEMP/current-body.md" "$report" >/dev/null 2>&1; then
              echo "Issue #$existing already says this - leaving it alone."
              exit 0
            fi
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d %H:%M') UTC by update-ga-news - the report changed."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose (a step's `if` is evaluated when the runner reaches it).
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-ga-news
          path: assets/data/ga-news.json
          if-no-files-found: ignore
          retention-days: 14
