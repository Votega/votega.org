name: Update Local Government data (twice weekly)

permissions:
  contents: write

# Twice weekly, NOT daily: local-government sites post infrequently, and the
# failure this guards against — a place reskinning its site so the scrape breaks —
# originates on the place's server, not in this repo, so only a scheduled run can
# catch it (a push/PR trigger never would). Mondays catch the start of the week;
# Thursdays catch the Tuesday commission meetings that most places hold. Manual
# dispatch for onboarding a new place to _data/places.yml.
on:
  workflow_dispatch:
    inputs:
      reclassify:
        description: 'One-time backfill: re-fetch & re-tag ALL cached meetings (use after a taxonomy change, e.g. adding the alpr subject). Slower — re-downloads every agenda.'
        type: boolean
        default: false
      months:
        description: 'Look-back window in months for the OCR/Granicus enrichers (default 12; widen for a backfill to reach older meetings).'
        required: false
        default: '12'
  schedule:
    - cron: '40 8 * * 1,4'  # Mondays & Thursdays 08:40 UTC (offset from other update-* jobs)

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      # poppler-utils (pdftotext/pdftoppm) + tesseract power the OCR meeting
      # enricher; agenda PDFs almost always have a text layer, so pdftotext does
      # the work and tesseract is only the scanned-PDF fallback.
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Generate local-government meeting data
        run: python scripts/generate_place_meetings.py

      # Validation does NOT abort the run. It used to: `exit 1` here skipped the
      # enrich/commit/publish steps entirely, so ONE place breaking threw away every
      # other place's fresh data for the week (a Cloudflare bot block on one county
      # discarded 34 healthy ones). Instead: annotate, quarantine just the failing
      # places below, carry on with the good data, and fail the job at the very end
      # so notify-workflow-failure still opens an issue.
      - name: Validate output
        id: validate
        continue-on-error: true
        run: |
          python scripts/validate_place_meetings.py \
            --failed-slugs-out "$RUNNER_TEMP/failed-places.txt"

      # Discard the regenerated JSON of any place that failed validation, so the
      # enrichers and the commit below only ever see trees that passed. This is the
      # safety property the old hard `exit 1` provided, kept: the failure mode that
      # check guards against is an adapter matching GARBAGE after a site reskin —
      # valid JSON, non-empty, wrong — and that must not be committed. git restore
      # puts the last known-good committed file back; for a place that was already
      # stale at HEAD it is a no-op.
      - name: Quarantine places that failed validation
        if: steps.validate.outcome == 'failure'
        run: |
          set -e
          list="$RUNNER_TEMP/failed-places.txt"
          if [ ! -s "$list" ]; then
            echo "::error::validation failed but no slug list was written -" \
              "cannot tell which places are bad; restoring ALL meeting data"
            git restore --source=HEAD -- 'assets/data/local-*-meetings.json'
            exit 0
          fi
          while read -r slug; do
            [ -n "$slug" ] || continue
            echo "::warning::quarantining $slug - failed validation, keeping the" \
              "last known-good committed data"
            f="assets/data/local-$slug-meetings.json"
            # Tracked: restore the committed version. Untracked (a place added this
            # run, whose very first output is bad): delete it, so nothing that never
            # passed validation reaches the commit.
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git restore --source=HEAD -- "$f"
            else
              rm -f "$f"
            fi
          done < "$list"
          git status --short assets/data/ | head -40

      # Topic / data-center enrichment. Both writers guard like the steps above —
      # they never overwrite a good sidecar or good flags with an empty result —
      # so a transient upstream failure can't wipe the committed watch data.
      # Legistar (Fulton, DeKalb): structured API, no OCR.
      - name: Enrich Legistar meetings (topics + data-center watch)
        run: python scripts/enrich_legistar_meetings.py

      # PDF places (Newton/Covington/Douglas/Cobb/Henry): poppler text-layer,
      # OCR fallback. Incremental — the committed sidecar is the cache, so only
      # meetings new since last week are downloaded and classified.
      - name: Enrich PDF-platform meetings (topics + data-center watch)
        run: |
          python scripts/enrich_ocr_meetings.py \
            --months "${{ inputs.months || '12' }}" --limit 25 \
            ${{ (inputs.reclassify == true || inputs.reclassify == 'true') && '--reclassify' || '' }}

      # Granicus ViewPublisher places (Barrow, Cherokee): the agenda link resolves
      # to HTML, so this is a text-strip + classify pass. Some instances (Spalding)
      # return a native PDF from the same viewer — those are detected and routed
      # through the poppler/OCR path. Same guard as the others: never overwrites a
      # good sidecar/flags with nothing.
      - name: Enrich Granicus meetings (topics + data-center watch)
        run: |
          python scripts/enrich_granicus_meetings.py \
            --months "${{ inputs.months || '12' }}" --limit 25 \
            ${{ (inputs.reclassify == true || inputs.reclassify == 'true') && '--reclassify' || '' }}

      # Per-topic mention feeds for the /local/topics/<topic>/ index pages.
      # Reads the enriched sidecars above + _data/places.yml and shares the ONE
      # taxonomy in scripts/lib/meeting_topics.py — no re-fetch, no second keyword
      # list. Must run AFTER enrichment so it sees this run's fresh classifications.
      - name: Generate topic mention feeds
        run: python scripts/generate_topic_mentions.py

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/local-*-meetings.json \
                  assets/data/local-*-meetings-enriched.json \
                  assets/data/local-flags.json \
                  assets/data/local-topics-*.json
          if git diff --cached --quiet; then
            echo "No local-government meeting changes"
          else
            git commit -m "Update local-government meeting data ($(date -u '+%Y-%m-%d'))"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # Mirror the enriched topic data out to the public open-data repo
      # Votega/ga-local-government. INLINE (not a separate publish-*.yml on push)
      # because the commit above is a github-actions[bot] commit, which does not
      # fire push-triggered workflows — see the sibling-publish trigger gotcha.
      # Without the secret this dry-runs to ./out (no push), so it is safe before
      # the repo + token exist; it starts publishing once GA_LOCAL_GOVERNMENT_TOKEN
      # (Contents: write on Votega/ga-local-government) is added.
      - name: Publish ga-local-government open-data
        env:
          GA_LOCAL_GOVERNMENT_TOKEN: ${{ secrets.GA_LOCAL_GOVERNMENT_TOKEN }}
        run: python scripts/publish_ga_local_government.py

      # Everything above ran and the good data is committed; now surface the
      # validation failure as a job failure. This is the LAST step on purpose —
      # failing earlier is what used to discard the healthy places' data.
      - name: Fail the job if validation failed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::validate_place_meetings.py failed - see the annotations" \
            "above. The failing place(s) were quarantined; every other place's" \
            "data was committed and published normally."
          exit 1
