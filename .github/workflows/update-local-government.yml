name: Update Local Government data (weekly)

permissions:
  contents: write

# Weekly, NOT daily: local-government sites post infrequently, and the failure
# this guards against — a place reskinning its site so the scrape breaks —
# originates on the place's server, not in this repo, so only a scheduled run can
# catch it (a push/PR trigger never would). Manual dispatch for onboarding a new
# place to _data/places.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 1'  # Mondays 08:40 UTC (offset from other update-* jobs)

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      # poppler-utils (pdftotext/pdftoppm) + tesseract power the OCR meeting
      # enricher; agenda PDFs almost always have a text layer, so pdftotext does
      # the work and tesseract is only the scanned-PDF fallback.
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Generate local-government meeting data
        run: python scripts/generate_place_meetings.py

      - name: Validate output
        run: python scripts/validate_place_meetings.py

      # Topic / data-center enrichment. Both writers guard like the steps above —
      # they never overwrite a good sidecar or good flags with an empty result —
      # so a transient upstream failure can't wipe the committed watch data.
      # Legistar (Fulton, DeKalb): structured API, no OCR.
      - name: Enrich Legistar meetings (topics + data-center watch)
        run: python scripts/enrich_legistar_meetings.py

      # PDF places (Newton/Covington/Douglas/Cobb/Henry): poppler text-layer,
      # OCR fallback. Incremental — the committed sidecar is the cache, so only
      # meetings new since last week are downloaded and classified.
      - name: Enrich PDF-platform meetings (topics + data-center watch)
        run: python scripts/enrich_ocr_meetings.py --months 12 --limit 25

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/local-*-meetings.json \
                  assets/data/local-*-meetings-enriched.json \
                  assets/data/local-flags.json
          if git diff --cached --quiet; then
            echo "No local-government meeting changes"
          else
            git commit -m "Update local-government meeting data ($(date -u '+%Y-%m-%d'))"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi
