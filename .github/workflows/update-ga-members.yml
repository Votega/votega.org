name: Update Georgia General Assembly member data (daily, 07:00 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
    inputs:
      new_biennium:
        description: >-
          Roll the roster over to a new General Assembly (RECURRING-TASKS.md section 3).
          Leave OFF for any other run: the scheduled run REFUSES a biennium changeover on
          purpose and must never perform one unattended. Freeze the outgoing roster first.
        type: boolean
        default: false
  schedule:
    - cron: '0 7 * * *'  # daily at 07:00 UTC (one hour after Congress workflow)

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # legis.ga.gov's own Members service — no API key, no quota. The Open States
      # producer is archived at scripts/archive/generate_ga_members_data.py and is NOT
      # a working fallback (see scripts/archive/README.md). The fallback is the
      # committed roster, which a failed run leaves untouched.
      - name: Generate GA member data
        id: generate
        run: python scripts/generate_ga_members_soap.py assets/data/ga-members.json ${{ inputs.new_biennium && '--new-biennium' || '' }}

      # Two tiers, and the split is the point. Tier 1 is the file against ITSELF
      # -- a metadata.count that disagrees with the member list, a missing
      # required field, two members in one district, a chamber holding MORE
      # seats than the constitution creates, an _inject entry the merge dropped.
      # No fact about the General Assembly can make those true, so they fail the
      # run and nothing is committed. Tier 2 is a chamber below full strength and
      # the diff against yesterday's roster; every one of those is something
      # Georgia can legitimately do, so they are written to a report and the data
      # is committed anyway.
      #
      # The heredoc this replaces asserted `len(senate) == 56` and
      # `len(house) == 180` -- exact equality on a number the world controls. The
      # chambers are that size at FULL STRENGTH; a resignation, a death or a seat
      # awaiting a special election makes the real count lower, and that is a true
      # fact the site should publish. This runs daily, so each time the assert
      # fired it aborted the job before the commit step and discarded the whole
      # day's refresh -- every other member's updated data with it, unrecoverably,
      # since the file died with the runner. See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6, and the header of
      # update-local-government.yml for the first workflow to make this split.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_ga_members.py assets/data/ga-members.json \
            --overrides assets/data/ga-members-overrides.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/ga-roster-changes.md"

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-members.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Georgia General Assembly member data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit, not before: the report describes a roster that has
      # already shipped. One issue, refreshed in place, so the history of GA
      # vacancies and departures lives in one thread.
      #
      # The body is rewritten every run but a comment is only added when the body
      # actually CHANGED. This job is daily and a vacancy stands for weeks, so
      # commenting unconditionally would be the pile of notifications the single
      # tracking issue exists to avoid -- while a real change (a new resignation,
      # a seat filled) still pings.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "GA roster: vacancies and material changes"
        run: |
          set -e
          report="$RUNNER_TEMP/ga-roster-changes.md"
          if [ ! -s "$report" ] || grep -q 'no material change this run' "$report"; then
            echo "Both chambers full and nothing material changed — skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            gh issue view "$existing" --json body --jq .body > "$RUNNER_TEMP/current-body.md" || true
            if diff -q "$RUNNER_TEMP/current-body.md" "$report" >/dev/null 2>&1; then
              echo "Issue #$existing already says this — leaving it alone."
              exit 0
            fi
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-ga-members — the roster report changed."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      - name: Publish to ga-legislators repo
        env:
          GA_LEGISLATORS_TOKEN: ${{ secrets.GA_LEGISLATORS_TOKEN }}
        # Publishes data/all.json (the LIVE roster) plus consumer-friendly extras
        # (members.csv, members.schema.json, ROSTER.md). The target repo splits
        # all.json into house.json / senate.json in its own workflow. The per-session
        # roster ARCHIVE is a separate, deliberate freeze — see freeze-ga-roster.yml.
        run: python3 scripts/publish_ga_legislators.py members

      # Last on purpose: a step's `if` is evaluated when the runner reaches it, so
      # an `if: failure()` step placed before the failing step never runs at all.
      # Sitting here it catches a tier-1 rejection, a commit or push failure, and
      # a publish failure.
      #
      # The condition is "we have a generated file and are about to lose it", not
      # just "validation failed": the regenerated JSON dies with the runner either
      # way, and the FEC workflow learned this the hard way when validation passed
      # and the commit step failed on a rebase conflict, losing a good file.
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-ga-members
          path: assets/data/ga-members.json
          if-no-files-found: ignore
          retention-days: 14
