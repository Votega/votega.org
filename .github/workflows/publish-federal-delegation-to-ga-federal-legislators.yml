name: Publish GA federal delegation to ga-federal-legislators

# Requires secret: GA_FEDERAL_LEGISLATORS
#   A GitHub Personal Access Token (fine-grained, Contents: Read and write on
#   Votega/ga-federal-legislators only, or classic with repo scope).
#   Add it at: votega.org repo → Settings → Secrets and variables → Actions → New repository secret
#
# scripts/publish_federal_delegation.py reads current-members.json (full Congress,
# all states — filtered to Georgia here, matching the state === 'Georgia' filter
# congress.js uses) and federal-member-votes.json (already Georgia-scoped), then
# publishes a full set of consumer-friendly artifacts to the target repo:
#   data/members.json · data/votes.json · data/members.csv · data/votes.csv ·
#   data/member-votes.csv · data/members.schema.json · data/votes.schema.json · ROSTER.md
# Run it locally without the token for a dry run (writes to ./out) — see the script docstring.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/current-members.json'      # updated daily by update-current-members.yml
      - 'assets/data/federal-member-votes.json'  # updated weekly by update-federal-votes.yml
      - 'scripts/publish_federal_delegation.py'  # republish when the generator itself changes

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Validate source data
        run: |
          python3 -c "
          import json
          members = json.load(open('assets/data/current-members.json'))['members']
          ga = [m for m in members if m.get('state') == 'Georgia']
          assert ga, 'No Georgia members found in current-members.json — filter or source data may be broken'
          print(f'current-members.json valid: {len(members)} total, {len(ga)} in Georgia')
          votes = json.load(open('assets/data/federal-member-votes.json'))
          assert votes.get('memberVotes'), 'federal-member-votes.json has no memberVotes'
          print(f'federal-member-votes.json valid: {len(votes[\"memberVotes\"])} members with vote records')
          "

      - name: Build and publish delegation artifacts
        env:
          GA_FEDERAL_LEGISLATORS: ${{ secrets.GA_FEDERAL_LEGISLATORS }}
        run: python3 scripts/publish_federal_delegation.py
