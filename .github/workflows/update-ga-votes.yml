name: Update Georgia legislative vote data (weekly, Mon 07:30 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Re-fetch EVERY session instead of preserving closed ones (slow: ~1.5k GetVote calls vs ~25)'
        type: boolean
        default: false
  schedule:
    # Monday 07:30 UTC. The source is now the legis.ga.gov SOAP web service
    # (generate_ga_votes_soap.py) — no Open States key and no shared 250/day quota,
    # so the old "stagger off update-ga-bills" constraint no longer applies; the day
    # is kept only for continuity.
    - cron: '30 7 * * 1'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Official source: the legis.ga.gov SOAP web service (no auth, no quota). --no-overlay
      # classifies passage by the native caption rule only, with zero Open States input, so
      # this pipeline is fully OS-independent. The retired Open States producer is kept at
      # scripts/archive/generate_ga_votes_data.py (see its README to fall back).
      # INCREMENTAL: only the active session is fetched (~25 GetVote calls); the closed
      # sessions are merged forward from the ga-member-votes.json this checkout provides,
      # so the step needs the committed file present. The producer ABORTS rather than
      # publish a file short a preserved session — which matters because the floor below
      # is cleared by the preserved layer alone. Tick full_refresh for a retroactive
      # amendment to a closed session, a crosswalk backfill that must reach one, or a
      # schema change in the producer. A biennium rollover does NOT need it.
      - name: Generate GA vote data (legis.ga.gov SOAP source)
        id: generate
        env:
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
        run: python scripts/generate_ga_votes_soap.py --no-overlay assets/data/ga-member-votes.json

      # Two tiers, and the split is the point. Tier 1 is the file against
      # ITSELF -- a metadata total that disagrees with the records it counts, a
      # per-session voteCount that disagrees with the records carrying that
      # session id, a session marked preserved with nothing in the file, a
      # member row indexing outside the shared voteIds list, a code the codec
      # does not define. No fact about the General Assembly can make those
      # true, so they fail the run and nothing is committed. Tier 2 is a thin
      # sweep and the diff against last week; those are reported and the data
      # is committed anyway.
      #
      # The heredoc this replaces gated on `votes >= 1000` and
      # `members >= 150`: floors pinned to the shape of a mid-biennium session.
      # They are cleared by the PRESERVED layer alone, which is what makes them
      # both useless and dangerous -- they look safe while the thing they are
      # meant to guard (the incremental fetch of the ACTIVE session) can fail
      # silently under them, and meanwhile a new biennium or a full-refresh run
      # that loses a closed session trips them and discards ~1,500 SOAP calls'
      # worth of sweep, which dies with the runner. The per-session integrity
      # check below is the one that actually catches a broken merge.
      #
      # `result in ('Pass','Fail')` moved to tier 2 as well: the chambers write
      # their own captions ("Agreed to", "Adopted", "Nomination Confirmed"), so
      # new wording is a gap in the producer's normalization for a human to
      # close, not a reason to throw away the record. A MISSING result stays
      # tier 1. See docs/audits/2026-10-13-data-pipeline-audit.md 2.6, and the
      # header of update-local-government.yml for the first workflow to make
      # this split.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_ga_votes.py assets/data/ga-member-votes.json \
            --expect-no-overlay \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/ga-votes-changes.md"

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-member-votes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif python scripts/only_keys_changed.py assets/data/ga-member-votes.json metadata.generatedAt; then
            # Only the generatedAt timestamp moved — committing would add a
            # near-full ~15 MB revision for no real change. Revert and skip.
            # See CODEBASE-REVIEW-2026-08-18.md finding 5.6.
            echo "Only metadata.generatedAt changed — skipping redundant commit"
            git restore --staged assets/data/ga-member-votes.json
            git checkout -- assets/data/ga-member-votes.json
          else
            git commit -m "Update Georgia legislative vote data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit, not before: the report describes a record that has
      # already shipped. One issue, refreshed in place, so the history of thin
      # sweeps and new result wording lives in one thread. This job is weekly,
      # so the comment is unconditional -- there is no daily pile to avoid.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "GA votes: thin sweeps and material changes"
        run: |
          set -e
          report="$RUNNER_TEMP/ga-votes-changes.md"
          if [ ! -s "$report" ] || grep -q 'no material change this run' "$report"; then
            echo "A full-looking sweep and nothing material — skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-ga-votes."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Split the monolithic votes file into a shared index (with precomputed
      # per-vote party tallies) + tiny per-member slices, so a legislator detail
      # page fetches ~14 KB + a cached index instead of the full ~3.7 MB file.
      # Derived from the just-committed ga-member-votes.json joined with
      # ga-members.json for party. See scripts/build_member_votes_slices.py.
      - name: Build per-member vote slices
        run: python scripts/build_member_votes_slices.py

      - name: Commit per-member vote slices
        run: |
          set -e
          git add -A assets/data/ga-votes-index.json assets/data/ga-votes
          if git diff --cached --quiet; then
            echo "No changes to vote slices"
          else
            git commit -m "Rebuild per-member vote slices"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - vote slices were NOT committed"
              exit 1
            fi
          fi

      - name: Enrich GA bills with party vote tallies
        run: python scripts/enrich_bills_with_party_votes.py assets/data/ga-bills.json assets/data/ga-member-votes.json assets/data/ga-members.json

      - name: Commit enriched GA bills data
        run: |
          set -e
          git add -f assets/data/ga-bills.json
          if git diff --cached --quiet; then
            echo "No changes to ga-bills.json"
          elif python scripts/only_keys_changed.py assets/data/ga-bills.json metadata.partyTallyEnrichedAt; then
            # Same guard as the votes file above: this ~9 MB file also carries a
            # per-run timestamp (partyTallyEnrichedAt). See finding 5.6.
            echo "Only partyTallyEnrichedAt changed — skipping redundant commit"
            git restore --staged assets/data/ga-bills.json
            git checkout -- assets/data/ga-bills.json
          else
            git commit -m "Enrich GA bills with party vote tallies"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # This job also rewrites ga-bills.json (the enrichment above), so publish it to
      # ga-legislation here too — same inline-publish reasoning as update-ga-bills.yml:
      # the GITHUB_TOKEN-authored commit above won't trigger the separate on:push
      # workflow. Without this, party-tally enrichment would lag the sibling by up to a
      # week. Contents-API path; reuses GA_LEGISLATION_PUSH_TOKEN.
      - name: Publish bills to ga-legislation repo
        env:
          GA_BILLS_TOKEN: ${{ secrets.GA_LEGISLATION_PUSH_TOKEN }}
        run: python3 scripts/publish_ga_bills.py

      # Reuses the existing GA_LEGISLATORS_TOKEN secret — same target repo as
      # the "Publish to ga-legislators repo" step in update-ga-members.yml.
      # Archives this session's votes under sessions/<slug>/{votes.json,votes.csv,
      # votes.schema.json} and refreshes the root latest.json pointer. Past sessions
      # are never overwritten (see publish_ga_legislators.py / RECURRING-TASKS.md §3).
      - name: Publish votes to ga-legislators repo
        env:
          GA_LEGISLATORS_TOKEN: ${{ secrets.GA_LEGISLATORS_TOKEN }}
        run: python3 scripts/publish_ga_legislators.py votes

      # Derived scorecard: party-unity + participation per legislator, computed from the
      # freshly generated ga-member-votes.json joined with the committed ga-members.json.
      # Built here (not in its own workflow) because it depends on the vote data this job
      # just rewrote, and the GITHUB_TOKEN commit above won't trigger a separate on:push
      # workflow (see project_sibling_publish_trigger_gotcha).
      - name: Generate voting scorecard
        run: python scripts/generate_party_unity.py

      - name: Commit voting scorecard
        run: |
          set -e
          git add -f assets/data/ga-party-unity.json
          if git diff --cached --quiet; then
            echo "No changes to ga-party-unity.json"
          elif python scripts/only_keys_changed.py assets/data/ga-party-unity.json metadata.generatedAt; then
            echo "Only metadata.generatedAt changed — skipping redundant commit"
            git restore --staged assets/data/ga-party-unity.json
            git checkout -- assets/data/ga-party-unity.json
          else
            git commit -m "Update GA legislator voting scorecard"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - scorecard was NOT committed"
              exit 1
            fi
          fi

      # Mirror the derived scorecard to the sibling repo alongside the raw votes it came
      # from (sessions/<biennium>/scorecard.{json,csv,schema.json} + scorecard-latest.json).
      - name: Publish scorecard to ga-legislators repo
        env:
          GA_LEGISLATORS_TOKEN: ${{ secrets.GA_LEGISLATORS_TOKEN }}
        run: python3 scripts/publish_ga_legislators.py scorecard

      # Last on purpose: a step's `if` is evaluated when the runner reaches it,
      # so an `if: failure()` step placed before the failing step never runs at
      # all. Sitting here it catches a tier-1 rejection, any commit or push
      # failure, and a publish failure.
      #
      # The condition is "we have a generated file and are about to lose it",
      # not just "validation failed": this sweep costs ~1,500 SOAP calls on a
      # full refresh and the output dies with the runner either way.
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-ga-member-votes
          path: assets/data/ga-member-votes.json
          if-no-files-found: ignore
          retention-days: 14
