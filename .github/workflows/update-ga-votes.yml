name: Update Georgia legislative vote data (weekly, Mon 07:30 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: >-
          Rebuild every roll call from scratch instead of only those changed since
          the last run. Needed to backfill members whose votes were previously
          dropped (see CODEBASE-REVIEW-2026-08-18.md 1.5). Costs more than one
          day of the 250-request Open States quota, so run it on a day nothing
          else uses the key; partial progress is merged and resumes next run.
        type: boolean
        required: false
        default: false
  schedule:
    # Monday, not Sunday: this paginates the same Open States /bills endpoint as
    # update-ga-bills, and the 250 requests/day quota is shared across every job
    # using the key. Running both on Sunday starved this one to zero results.
    - cron: '30 7 * * 1'

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate GA vote data
        run: python scripts/generate_ga_votes_data.py assets/data/ga-member-votes.json
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '' }}

      - name: Validate generated data
        run: |
          if [ ! -f assets/data/ga-member-votes.json ]; then
            echo "Error: ga-member-votes.json was not generated"
            exit 1
          fi
          python -c "
          import json, os
          d = json.load(open('assets/data/ga-member-votes.json'))
          votes   = len(d.get('votes', {}))
          members = len(d.get('memberVotes', {}))
          size_kb = os.path.getsize('assets/data/ga-member-votes.json') // 1024
          print(f'Validated: {votes} votes, {members} members with vote records, {size_kb} KB')
          assert votes > 0, 'Expected at least one vote — this data comes from the Open States API (/bills). Check the OPENSTATES_API_KEY secret and the GA_SESSION identifier in generate_ga_votes_data.py, and see the HTTP status in the generate step above.'
          assert members > 0, 'memberVotes is empty — Open States returned roll calls without per-legislator detail. See the generate step output above.'
          "

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-member-votes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif python scripts/only_keys_changed.py assets/data/ga-member-votes.json metadata.generatedAt; then
            # Only the generatedAt timestamp moved — committing would add a
            # near-full ~15 MB revision for no real change. Revert and skip.
            # See CODEBASE-REVIEW-2026-08-18.md finding 5.6.
            echo "Only metadata.generatedAt changed — skipping redundant commit"
            git restore --staged assets/data/ga-member-votes.json
            git checkout -- assets/data/ga-member-votes.json
          else
            git commit -m "Update Georgia legislative vote data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      - name: Enrich GA bills with party vote tallies
        run: python scripts/enrich_bills_with_party_votes.py assets/data/ga-bills.json assets/data/ga-member-votes.json assets/data/ga-members.json

      - name: Commit enriched GA bills data
        run: |
          set -e
          git add -f assets/data/ga-bills.json
          if git diff --cached --quiet; then
            echo "No changes to ga-bills.json"
          elif python scripts/only_keys_changed.py assets/data/ga-bills.json metadata.partyTallyEnrichedAt; then
            # Same guard as the votes file above: this ~9 MB file also carries a
            # per-run timestamp (partyTallyEnrichedAt). See finding 5.6.
            echo "Only partyTallyEnrichedAt changed — skipping redundant commit"
            git restore --staged assets/data/ga-bills.json
            git checkout -- assets/data/ga-bills.json
          else
            git commit -m "Enrich GA bills with party vote tallies"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # Reuses the existing GA_LEGISLATORS_TOKEN secret — same target repo as
      # the "Publish to ga-legislators repo" step in update-ga-members.yml,
      # just a different file (data/votes.json instead of data/all.json).
      - name: Publish votes to ga-legislators repo
        env:
          GA_LEGISLATORS_TOKEN: ${{ secrets.GA_LEGISLATORS_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, base64, urllib.request, urllib.error, os

          token = os.environ['GA_LEGISLATORS_TOKEN']
          repo  = 'Votega/ga-legislators'
          url   = f'https://api.github.com/repos/{repo}/contents/data/votes.json'
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json',
          }

          with open('assets/data/ga-member-votes.json', 'rb') as f:
              content = base64.b64encode(f.read()).decode()

          # Get current file SHA (required by GitHub API to update an existing file)
          sha = None
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  sha = json.loads(resp.read())['sha']
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          payload = {'message': 'Publish GA legislator vote data from votega.org', 'content': content}
          if sha:
              payload['sha'] = sha

          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method='PUT', headers=headers)
          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read())
              print(f"Published to ga-legislators: {result['commit']['sha']}")
          EOF
