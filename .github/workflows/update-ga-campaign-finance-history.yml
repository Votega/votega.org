name: Update GA campaign finance history (legacy records)

# Source: api-recordsearch.ethics.ga.gov — the Ethics Commission's LEGACY system,
# holding filings through 2025-12-31. It is a frozen archive, not a live feed, so
# this runs on demand plus quarterly in case the Commission backfills a record.
# The live 2026-onward data comes from update-ga-campaign-finance.yml (PeachFile).

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 1 1,4,7,10 *'   # 09:30 UTC on the 1st, quarterly

jobs:
  update:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate campaign finance history
        id: generate
        run: python scripts/generate_ga_campaign_finance_history.py

      # Two tiers, and the split is the point. Tier 1 is the file against ITSELF:
      # a metadata.count that is not the number of records, a record missing
      # filerEntityId/office/totalRaised/cycleYear/source, a record not tagged
      # source=legacy (these ids share a numeric range with PeachFile's but are a
      # different id space, so an untagged one can join to the wrong entity), keys
      # that are not '<filerEntityId>:<electionCycleId>' (collapsing to a bare
      # filer id overwrites per-cycle rows and loses about a quarter of the
      # dataset). Those now check EVERY record, where the heredoc sampled the
      # first. Tier 2 is the diff against the committed archive: reported, and the
      # data is committed anyway.
      #
      # The heredoc this replaces gated on `len(filers) < 1200` and
      # `min(cycleYears) > 2020`: floors on what the source returns. This job runs
      # four times a year, so a legitimate cleanup by the Commission (350 records
      # withdrawn) aborts the run and the next chance is three months out. Both
      # were groping at "an office silently returned nothing", which a global count
      # cannot localise -- losing the 151 Senate records of 2022 leaves 1,394, well
      # above the floor. The validator compares per cycle year and per office with
      # the committed file and NAMES what shrank. The generator's own `short_reads`
      # abort (rows != the API's totalItems, per office) stays: it is the precise
      # condition the floor approximated, and a truncated archive is not worth
      # committing over a complete one.
      - name: Validate output
        id: validate
        run: |
          python scripts/validate_ga_campaign_finance_history.py \
            assets/data/ga-campaign-finance-history.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/ga-campaign-finance-history-changes.md"

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/ga-campaign-finance-history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif python scripts/only_keys_changed.py assets/data/ga-campaign-finance-history.json metadata.generatedAt; then
            echo "Only metadata.generatedAt changed — skipping redundant commit"
            git restore --staged assets/data/ga-campaign-finance-history.json
            git checkout -- assets/data/ga-campaign-finance-history.json
          else
            git commit -m "Update GA campaign finance history (legacy records)"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit, not before: the report describes a record that has
      # already shipped. One issue, refreshed in place, so the history lives in
      # one thread. This job runs quarterly, so the comment is unconditional --
      # there is no daily pile to avoid, and the body-diff guard that
      # update-ga-members.yml uses is not needed.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "GA campaign finance history: records changed in the legacy archive"
        run: |
          set -e
          report="$RUNNER_TEMP/ga-campaign-finance-history-changes.md"
          if [ ! -s "$report" ] || grep -qi 'no material change this run' "$report"; then
            echo "Nothing material -- skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-ga-campaign-finance-history."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose: a step's `if` is evaluated when the runner reaches it, so
      # one placed before the failing step never runs. Sitting here it catches a
      # tier-1 rejection, a commit or push failure, and the report step. The
      # condition is "we have a generated file and are about to lose it".
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-ga-campaign-finance-history
          path: assets/data/ga-campaign-finance-history.json
          if-no-files-found: ignore
          retention-days: 14
