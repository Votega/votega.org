name: Update GA Executive Orders (daily, 08:15 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'  # daily at 08:15 UTC (offset from curated-ga-bills at 08:00)

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch current year executive orders
        run: python scripts/fetch_ga_executive_orders.py

      - name: Commit if changed
        run: |
          set -e
          YEAR=$(date +%Y)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/ga-executive-orders-${YEAR}.json
          if git diff --cached --quiet; then
            echo "No new executive orders"
          else
            git commit -m "Update GA executive orders ${YEAR} ($(date -u '+%Y-%m-%d'))"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi
