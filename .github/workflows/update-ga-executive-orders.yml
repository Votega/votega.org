name: Update GA Executive Orders (daily, 08:15 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'  # daily at 08:15 UTC (offset from curated-ga-bills at 08:00)

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF text + OCR tooling
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Fetch current year executive orders
        run: python scripts/fetch_ga_executive_orders.py

      - name: Enrich orders (hash, archive, full text)
        run: python scripts/enrich_ga_executive_orders.py

      - name: Validate output
        run: |
          set -e
          YEAR=$(date +%Y)
          FILE=assets/data/ga-executive-orders-${YEAR}.json
          # Previous committed version, so we can assert the count never shrinks —
          # the fetch merges additively, so a drop means data was lost, not updated.
          git show HEAD:${FILE} > /tmp/prev-eo.json 2>/dev/null || echo '{"orders":[]}' > /tmp/prev-eo.json
          python - "$FILE" /tmp/prev-eo.json <<'PY'
          import json, sys
          new  = json.load(open(sys.argv[1], encoding='utf-8'))
          prev = json.load(open(sys.argv[2], encoding='utf-8'))
          orders = new.get('orders', [])
          if not orders:
              sys.exit('ERROR: no orders in output')
          if new.get('metadata', {}).get('count') != len(orders):
              sys.exit(f"ERROR: metadata.count {new.get('metadata',{}).get('count')} != {len(orders)} orders")
          prev_n = len(prev.get('orders', []))
          if len(orders) < prev_n:
              sys.exit(f"ERROR: order count dropped {prev_n} -> {len(orders)} (merge should be additive)")
          missing = [o.get('number') for o in orders if not o.get('number') or not o.get('title')]
          if missing:
              sys.exit(f"ERROR: {len(missing)} order(s) missing number/title")
          print(f"Valid: {len(orders)} orders (was {prev_n})")
          PY

      - name: Commit if changed
        run: |
          set -e
          YEAR=$(date +%Y)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/data/eo-text
          git add assets/data/ga-executive-orders-${YEAR}.json assets/data/eo-text
          if git diff --cached --quiet; then
            echo "No new executive orders"
          else
            git commit -m "Update GA executive orders ${YEAR} ($(date -u '+%Y-%m-%d'))"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi
