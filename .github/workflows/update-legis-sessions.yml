name: Update legis.ga.gov session table (weekly, Sun 06:30 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one tracking issue

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sundays at 06:30 UTC, ahead of the Sunday/Monday bills and votes jobs that
    # resolve a SessionId through this table. One unauthenticated SOAP call; the table only
    # changes when the legislature publishes a new session (about twice a year), so most
    # runs commit nothing.
    - cron: '30 6 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No API key: Session/GetSessions needs no auth and takes no parameters.
      - name: Generate legis session table
        id: generate
        run: python scripts/generate_legis_sessions.py assets/data/ga-legis-sessions.json

      # Two tiers. Tier 1 is the file against ITSELF: a count that does not match
      # the rows, a duplicate SessionId, a defaultSessionId that is not the one
      # IsDefault row, a regular session spanning other than two years. Tier 2
      # is what the legislature published: a second IsDefault row, a regular-
      # session description that no longer parses (lib/ga_sessions keys on that
      # wording), a session that vanished, a new session. Reported by name; the
      # table is committed.
      #
      # The step this replaces asserted exactly one default and the description
      # regex, and ran validate_data_update.py --min sessions=20 -- upstream
      # wording and a hand-pinned floor. See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate generated data
        run: |
          python scripts/validate_legis_sessions.py assets/data/ga-legis-sessions.json             --baseline-ref HEAD             --report-out "$RUNNER_TEMP/legis-sessions-changes.md"

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-legis-sessions.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update legis.ga.gov session table"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit: the report describes a table that has already shipped.
      # One issue, refreshed in place.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "legis.ga.gov session table: material changes"
        run: |
          set -e
          report="$RUNNER_TEMP/legis-sessions-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material changed - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE"             --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-legis-sessions."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose (an `if: failure()` step placed earlier never runs).
      # Condition is "we have a generated file and are about to lose it".
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-legis-sessions
          path: assets/data/ga-legis-sessions.json
          if-no-files-found: ignore
          retention-days: 14
