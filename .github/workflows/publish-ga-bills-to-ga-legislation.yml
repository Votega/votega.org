name: Publish ga-bills.json to ga-legislation

# Requires secret: GA_LEGISLATION_PUSH_TOKEN
#   A GitHub Personal Access Token (classic) with repo scope on Votega/ga-legislation.
#   Add it at: votega.org repo → Settings → Secrets and variables → Actions → New repository secret

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/ga-bills.json'
      - 'assets/data/ga-bills-subjects.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Validate ga-bills.json
        run: |
          python -c "
          import json, sys
          with open('assets/data/ga-bills.json') as f:
              data = json.load(f)
          bills = data.get('bills', [])
          count = data.get('metadata', {}).get('count', len(bills))
          if len(bills) == 0:
              print('ERROR: ga-bills.json has no bills', file=sys.stderr)
              sys.exit(1)
          print(f'ga-bills.json valid: {len(bills)} bills (metadata.count={count})')
          "

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: Votega/ga-legislation
          token: ${{ secrets.GA_LEGISLATION_PUSH_TOKEN }}
          path: target-repo

      - name: Commit and push to ga-legislation
        working-directory: target-repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-apply the source file(s) onto the current target tree. Used for the
          # first commit and again after a reset when a push loses a race.
          restage() {
            cp "$GITHUB_WORKSPACE/assets/data/ga-bills.json" ga-bills.json
            if [ -f "$GITHUB_WORKSPACE/assets/data/ga-bills-subjects.json" ]; then
              cp "$GITHUB_WORKSPACE/assets/data/ga-bills-subjects.json" ga-bills-subjects.json
            fi
            git add ga-bills.json ga-bills-subjects.json
          }

          restage
          if git diff --cached --quiet; then
            echo "No changes — files are already up to date"
            exit 0
          fi

          # Idempotent mirror: on a non-fast-forward push (a concurrent run of
          # this workflow, or the sibling publisher targeting the same repo), take
          # the remote tip and re-apply our file rather than rebasing two
          # pretty-printed JSON snapshots — which would conflict. See the
          # publish-race incident, 2026-08-19.
          pushed=0
          for attempt in 1 2 3; do
            git commit -m "Update ga-bills data ($(date -u '+%Y-%m-%d'))" || true
            if git push; then pushed=1; break; fi
            echo "Push rejected (attempt $attempt) — syncing to remote and re-applying"
            git fetch origin main
            git reset --hard origin/main
            restage
            if git diff --cached --quiet; then
              echo "Remote already carries our content"; pushed=1; break
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Push to ga-legislation failed after 3 attempts"
            exit 1
          fi
