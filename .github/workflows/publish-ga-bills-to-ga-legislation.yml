name: Publish ga-bills.json to ga-legislation

# Requires secret: GA_LEGISLATION_PUSH_TOKEN
#   A GitHub Personal Access Token (classic) with repo scope on Votega/ga-legislation.
#   Add it at: votega.org repo → Settings → Secrets and variables → Actions → New repository secret

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/ga-bills.json'
      - 'assets/data/ga-bills-subjects.json'
      - 'scripts/publish_ga_bills.py'
      - 'scripts/lib/sibling_publish.py'

jobs:
  publish:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      # The same tier-1 gate update-ga-bills.yml applies before it commits this
      # file (validate_ga_bills.py), not a second weaker copy: the inline check
      # this replaces was `len(bills) == 0` alone, so a wrong metadata.totalBills,
      # a per-session billCount that disagrees with the bills, or a duplicate bill
      # id went straight into the public archive. The publisher runs the same gate
      # itself (gate_source) so a local dry-run refuses what CI would. This job
      # commits nothing to the source repo, so a refusal costs no data, and tier 2
      # (what changed) is already reported by update-ga-bills -- the file here IS
      # the committed one, so a baseline diff would only ever say "no change".
      - name: Validate ga-bills.json
        run: python scripts/validate_ga_bills.py assets/data/ga-bills.json --baseline-ref HEAD

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: Votega/ga-legislation
          token: ${{ secrets.GA_LEGISLATION_PUSH_TOKEN }}
          path: target-repo

      - name: Commit and push to ga-legislation
        working-directory: target-repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Regenerate all bill artifacts into the target tree. Bills are now archived
          # per legislative session under sessions/<YYYY-YYYY>/ with a root latest.json
          # pointer, so remove the old flat root layout on migration (git add -A stages
          # the deletions). Only bill files are removed — ballot-measure files at the
          # root belong to the sibling publisher. Used for the first commit and again
          # after a reset when a push loses a race.
          restage() {
            rm -f ga-bills.json ga-bills.csv ga-bills.schema.json BILLS.md ga-bills-subjects.json
            ( cd "$GITHUB_WORKSPACE" && OUT_DIR="$GITHUB_WORKSPACE/target-repo" python3 scripts/publish_ga_bills.py )
            git add -A
          }

          restage
          if git diff --cached --quiet; then
            echo "No changes — files are already up to date"
            exit 0
          fi

          # Idempotent mirror: on a non-fast-forward push (a concurrent run of
          # this workflow, or the sibling publisher targeting the same repo), take
          # the remote tip and re-apply our file rather than rebasing two
          # pretty-printed JSON snapshots — which would conflict. See the
          # publish-race incident, 2026-08-19.
          pushed=0
          for attempt in 1 2 3; do
            git commit -m "Update ga-bills data ($(date -u '+%Y-%m-%d'))" || true
            if git push; then pushed=1; break; fi
            echo "Push rejected (attempt $attempt) — syncing to remote and re-applying"
            git fetch origin main
            git reset --hard origin/main
            restage
            if git diff --cached --quiet; then
              echo "Remote already carries our content"; pushed=1; break
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Push to ga-legislation failed after 3 attempts"
            exit 1
          fi
