name: Update GA legislative votes — SOAP parallel (weekly, Tue 08:00 UTC)

# PARALLEL, NON-CANONICAL staging of the official-source vote producer
# (scripts/generate_ga_votes_soap.py, the legis.ga.gov SOAP web service). It writes
# assets/data/ga-member-votes.soap.json ALONGSIDE the live Open States file — it does
# NOT update the site. This is the staging ground for the cutover: it proves the
# producer runs unattended and keeps a fresh, diffable SOAP dataset on disk.
#
# Why this can be its own simple scheduled job (unlike the OS and /api producers):
#   * NO auth — the SOAP service is unauthenticated, so there is no secret to gate on
#     (contrast inspect-legis-ga-votes.yml, which needs LEGIS_GA_CLIENT_KEY).
#   * NO quota — it does not touch the Open States 250/day budget, so it never has to
#     dodge update-ga-bills / update-ga-votes the way those do.
#   * --no-overlay: classify passage by the native caption rule ONLY (lib/ga_passage),
#     with zero Open States input — this is the exact OS-free output the cutover will
#     promote. Member resolution still reads the committed id-crosswalk.json.
#
# It deliberately does NO downstream work (vote slices, bill enrichment, scorecard,
# sibling publishes) — that stays on update-ga-votes.yml until the cutover moves it.
#
# Scheduled, so it MUST appear in notify-workflow-failure.yml's `workflows:` list
# (validate_workflow_triggers.py enforces this). Renaming this `name:` means editing
# that entry in the same commit.

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Tuesday, a day off the Monday Open States votes job — no shared resource, this is
    # just to keep the two parallel datasets visibly staggered in the Actions timeline.
    - cron: '0 8 * * 2'

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate GA vote data from the legis.ga.gov SOAP service (OS-free)
        run: python scripts/generate_ga_votes_soap.py --no-overlay assets/data/ga-member-votes.soap.json

      - name: Validate generated data
        run: |
          if [ ! -f assets/data/ga-member-votes.soap.json ]; then
            echo "Error: ga-member-votes.soap.json was not generated"
            exit 1
          fi
          python -c "
          import json, os
          d = json.load(open('assets/data/ga-member-votes.soap.json'))
          votes   = len(d.get('votes', {}))
          members = len(d.get('memberVotes', {}))
          meta    = d.get('metadata', {})
          size_kb = os.path.getsize('assets/data/ga-member-votes.soap.json') // 1024
          print(f'Validated: {votes} bill-votes, {members} members with vote records, {size_kb} KB')
          # Floors are well under a healthy biennium (~2.4k bill-votes, ~240 members) but
          # well above anything a partial/failed SOAP sweep would leave — a near-empty
          # file must fail here rather than overwrite a good one.
          assert votes >= 1000, f'Only {votes} bill-votes — expected ~2400 for the biennium. The SOAP sweep likely failed; see the generate step above.'
          assert members >= 150, f'Only {members} members with votes — the crosswalk join or the SOAP fetch is broken.'
          vote_ids = d.get('voteIds')
          assert isinstance(vote_ids, list) and len(vote_ids) >= votes, 'voteIds index missing or shorter than votes — compact schema not written (see scripts/lib/votes_schema.py).'
          assert all(isinstance(v, dict) for v in d['memberVotes'].values()), 'memberVotes must be {index: code} maps (compact schema).'
          assert meta.get('passageOverlaySource') is None, 'Expected --no-overlay (OS-free) output: passageOverlaySource should be null.'
          # Every record must carry a derived Pass/Fail (result is self-sufficient now).
          bad = [k for k, v in d['votes'].items() if v.get('result') not in ('Pass', 'Fail')]
          assert not bad, f'{len(bad)} vote record(s) missing Pass/Fail result (e.g. {bad[:3]}).'
          "

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-member-votes.soap.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif python scripts/only_keys_changed.py assets/data/ga-member-votes.soap.json metadata.generatedAt; then
            # Only the generatedAt timestamp moved — committing would add a near-full
            # ~3.6 MB revision for no real change. Revert and skip (same guard as
            # update-ga-votes.yml; see CODEBASE-REVIEW-2026-08-18.md finding 5.6).
            echo "Only metadata.generatedAt changed — skipping redundant commit"
            git restore --staged assets/data/ga-member-votes.soap.json
            git checkout -- assets/data/ga-member-votes.soap.json
          else
            git commit -m "Update GA legislative votes (SOAP parallel source)"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi
