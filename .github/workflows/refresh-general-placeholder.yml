name: Refresh general-election ballot preview (daily, 07:30 UTC)

# The Nov 3 results page is a placeholder until votes exist: every candidate at
# 0 votes, listing who is on the ballot. It is a pure derivation of races.json,
# and rebuilding it was a manual step nobody had reason to remember — so the
# published preview drifted 110 offices away from races.json, four of them
# naming the opponent a candidate had already beaten in the primary rather than
# the person actually on the ballot.
#
# Once real results are loaded the WRITER itself refuses (counted_votes() sees
# votes in the committed file and exits 0 without writing), so this cannot
# overwrite election-night numbers with zeros.
#
# That guard used to live only in the script's --check branch, while the
# rebuild step below runs the writer with no flags — so the write was
# unguarded, and the --check in the "Validate the rebuild" step then passed
# because the file it was handed had already been zeroed and committed. Keep
# the guard on the write path, not just the check: this job runs daily and on
# every races.json push, including the morning after polls close.
# Pinned by scripts/test_general_placeholder_guard.py.

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:30 UTC, after update-ga-members (07:00) — the preview resolves
    # some candidate names through the member rosters. A schedule as well as the
    # push trigger below because races.json's inputs are refreshed by workflows
    # whose commits do not fire a `push` trigger (GITHUB_TOKEN recursion guard).
    - cron: '30 7 * * *'
  push:
    branches: [main]
    paths:
      - 'assets/data/races.json'
      - 'assets/data/ga-members.json'
      - 'assets/data/current-members.json'
      - 'scripts/build_general_placeholder.py'

jobs:
  refresh:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild the ballot preview
        id: generate
        run: python scripts/build_general_placeholder.py

      # Two tiers. Tier 1 is the file against ITSELF: a placeholder carrying
      # votes (it is defined as the file with none), a contest whose total is
      # not the sum of its candidates, a nameless candidate, a duplicated
      # office. Tier 2 is what races.json can legitimately say -- a section
      # with no offices, fewer offices than yesterday, a candidate who
      # withdrew -- and is reported by name while the commit proceeds.
      #
      # The heredoc this replaces asserted exactly 5 sections, >= 300 offices
      # and >= 400 candidates: floors on numbers races.json controls, which
      # could not say WHICH section had lost its races. This runs daily AND on
      # every races.json push. See docs/audits/2026-10-13-data-pipeline-audit.md
      # 2.6.
      - name: Validate the rebuild
        run: |
          set -e
          python scripts/validate_general_placeholder.py             _data/election_results/ga-general-2026-results.json             --baseline-ref HEAD             --report-out "$RUNNER_TEMP/general-placeholder-changes.md"
          # Belt and braces: the file on disk must now agree with races.json.
          python scripts/build_general_placeholder.py --check

      - name: Commit and push the refreshed preview
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f _data/election_results/ga-general-2026-results.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh general-election ballot preview from races.json"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - refreshed preview was NOT committed"
              exit 1
            fi
          fi

      # After the commit: the report describes a preview that has already
      # shipped. One issue, refreshed in place; because this runs daily and on
      # every races.json push, a comment is only added when the body CHANGED.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "General-election preview: material changes"
        run: |
          set -e
          report="$RUNNER_TEMP/general-placeholder-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material changed - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE"             --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            gh issue view "$existing" --json body --jq .body > "$RUNNER_TEMP/current-body.md" || true
            if diff -q "$RUNNER_TEMP/current-body.md" "$report" >/dev/null 2>&1; then
              echo "Issue #$existing already says this - leaving it alone."
              exit 0
            fi
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by refresh-general-placeholder - the report changed."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose (an `if: failure()` step placed earlier never runs).
      # Condition is "we have a generated file and are about to lose it".
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-general-placeholder
          path: _data/election_results/ga-general-2026-results.json
          if-no-files-found: ignore
          retention-days: 14
