name: Update Cabinet department rules (daily, 12:30 UTC)

permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:
  schedule:
    # The Register publishes every business day (and lists the next day's
    # documents the evening before), so daily keeps the Cabinet pages current.
    - cron: '30 12 * * *'

jobs:
  update-agency-actions:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # fetch-depth: 0 because the commit step rebases (see update-fec-data.yml).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Verifies every hardcoded agency id against agencies.json first, and exits 1
      # before writing anything if a department fails to fetch.
      - name: Fetch department rules
        id: fetch
        run: python scripts/generate_agency_actions.py assets/data

      # Tier 1 gates (the files against themselves and each other); tier 2 (the
      # files against HEAD) is a report and never gates.
      - name: Validate generated data
        run: |
          python scripts/validate_agency_actions.py assets/data \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/agency-changes.md"
          cat "$RUNNER_TEMP/agency-changes.md" >> "$GITHUB_STEP_SUMMARY"

      # generatedAt is kept when a department's rules are unchanged, so a quiet day
      # stages nothing and `git diff --cached --quiet` is the whole check.
      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/agency-actions-index.json assets/data/agency-actions
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Cabinet department rules"
            pushed=0
            for attempt in 1 2 3; do
              # Rebase onto THIS ref's upstream, not main (feature-branch runs).
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # Last on purpose: an `if: failure()` step placed earlier never runs.
      - name: Preserve the generated files
        if: failure() && steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-agency-actions
          path: |
            assets/data/agency-actions-index.json
            assets/data/agency-actions/
          if-no-files-found: ignore
          retention-days: 14
