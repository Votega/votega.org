name: Publish ga-ballot-measures.json to ga-legislation

# Requires secret: GA_LEGISLATION_PUSH_TOKEN
#   A GitHub Personal Access Token (classic) with repo scope on Votega/ga-legislation.
#   Add it at: votega.org repo → Settings → Secrets and variables → Actions → New repository secret
#   (Same secret already used by publish-ga-bills-to-ga-legislation.yml.)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/ga-ballot-measures.json'
      - 'assets/data/ga-ballot-measures.schema.json'
      - 'scripts/publish_ga_ballot_measures.py'
      - 'scripts/lib/sibling_publish.py'

jobs:
  publish:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      # Every check is tier 1 (the file against itself and its own schema) and the
      # vocabularies are read from the schema file, not restated here -- see the
      # docstring of scripts/validate_ga_ballot_measures.py for why there is no
      # tier 2. This job commits nothing to the source repo, so a refusal costs no
      # data; it runs before the target checkout so a bad file fails fast. The
      # schema being parseable is covered by the same script, which loads it.
      - name: Validate ga-ballot-measures.json
        run: python scripts/validate_ga_ballot_measures.py

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: Votega/ga-legislation
          token: ${{ secrets.GA_LEGISLATION_PUSH_TOKEN }}
          path: target-repo

      - name: Commit and push to ga-legislation
        working-directory: target-repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-apply the source file(s) onto the current target tree. Used for the
          # first commit and again after a reset when a push loses a race.
          restage() {
            ( cd "$GITHUB_WORKSPACE" && OUT_DIR="$GITHUB_WORKSPACE/target-repo" python3 scripts/publish_ga_ballot_measures.py )
            git add -A
          }

          restage
          if git diff --cached --quiet; then
            echo "No changes — files are already up to date"
            exit 0
          fi

          # Idempotent mirror: on a non-fast-forward push (a concurrent run of
          # this workflow, or the sibling publisher targeting the same repo), take
          # the remote tip and re-apply our file rather than rebasing two
          # pretty-printed JSON snapshots — which would conflict. See the
          # publish-race incident, 2026-08-19.
          pushed=0
          for attempt in 1 2 3; do
            git commit -m "Update ga-ballot-measures data ($(date -u '+%Y-%m-%d'))" || true
            if git push; then pushed=1; break; fi
            echo "Push rejected (attempt $attempt) — syncing to remote and re-applying"
            git fetch origin main
            git reset --hard origin/main
            restage
            if git diff --cached --quiet; then
              echo "Remote already carries our content"; pushed=1; break
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Push to ga-legislation failed after 3 attempts"
            exit 1
          fi
