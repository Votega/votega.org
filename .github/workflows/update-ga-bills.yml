name: Update Georgia legislative bill data (weekly, Sun 07:30 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Re-fetch EVERY session instead of preserving closed ones (slow: ~5.7k SOAP calls vs ~180)'
        type: boolean
        default: false
  schedule:
    # Weekly on Sundays at 07:30 UTC. update-ga-votes.yml runs MONDAY 07:30 and
    # re-enriches ga-bills.json with that day's vote data, so the party tallies written
    # by the enrichment step below are always one cycle behind until that Monday run.
    - cron: '30 7 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Official source: the legis.ga.gov SOAP web service (no auth, no quota). Bills now
      # share a source with the votes (generate_ga_votes_soap.py), so the party-tally
      # enrichment below joins exactly. The retired Open States producer is kept at
      # scripts/archive/generate_ga_bills_data.py (see its README to fall back).
      #
      # INCREMENTAL: only the active session is fetched (~180 bills); the closed sessions
      # of the biennium are carried forward from the ga-bills.json this checkout provides,
      # which is why the step needs the committed file present. The producer ABORTS rather
      # than publish a file short a preserved session, so a bad checkout fails loudly
      # instead of silently dropping ~5.5k bills. Tick full_refresh on a manual run (or
      # set FULL_REFRESH=1) for a retroactive amendment to a closed session, or a schema
      # change that must reach historical records. A biennium rollover does NOT need it.
      - name: Generate GA bills data (legis.ga.gov SOAP source)
        id: generate
        env:
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
        run: python scripts/generate_ga_bills_soap.py assets/data/ga-bills.json

      # Two tiers, and the split is the point. Tier 1 is the file against
      # ITSELF -- a metadata total that disagrees with the bills it counts, a
      # per-session billCount that disagrees with the bills carrying that session
      # id, a session marked preserved with nothing in the file, a duplicate bill
      # id, a bill missing a field every consumer reads. No fact about the General
      # Assembly can make those true, so they fail the run and nothing is
      # committed. Tier 2 is the diff against last week -- sessions gaining or
      # losing bills, a rollover, an empty active session; those are reported and
      # the data is committed anyway.
      #
      # The step this replaces gated on validate_data_update.py: a 20% shrink of
      # len(bills) against HEAD (reset by --scope-key at a session change) plus
      # `--min bills=1`. That is a floor cleared by the PRESERVED layer: ~5,500 of
      # ~5,650 bills are carried forward verbatim from the closed session, so the
      # active session (~3% of the file) could come back EMPTY from the
      # incremental fetch and the whole-file delta never moved. It looked safe
      # while the thing it was meant to guard failed silently under it, and it
      # still tripped on a legitimate rollover, discarding a sweep that dies with
      # the runner. The per-session billCount equality is the check that actually
      # catches a broken merge. The inline `totalBills == len(bills)` and
      # required-field asserts were already self-consistency checks and survive
      # as tier 1. See docs/audits/2026-10-13-data-pipeline-audit.md 2.6, and the
      # header of update-local-government.yml for the first workflow to make
      # this split.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_ga_bills.py assets/data/ga-bills.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/ga-bills-changes.md"

      - name: Enrich GA bills with party vote tallies
        run: python scripts/enrich_bills_with_party_votes.py assets/data/ga-bills.json assets/data/ga-member-votes.json assets/data/ga-members.json

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-bills.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Georgia legislative bill data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit, not before: the report describes a record that has
      # already shipped. One issue, refreshed in place, so the history of
      # rollovers and session changes lives in one thread. This job is weekly,
      # so the comment is unconditional -- there is no daily pile to avoid.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "GA bills: session and roster changes"
        run: |
          set -e
          report="$RUNNER_TEMP/ga-bills-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material this run -- skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-ga-bills."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Split sponsorship out of the monolithic bill file into a ~4KB shared index +
      # per-member slices (median ~12KB), so the Sponsored Legislation tab on a
      # legislator profile stops fetching all 6.9MB of ga-bills.json to render one
      # member's rows. Must run in the SAME job that rewrote ga-bills.json: the slices
      # are derived from its sponsors[], so leaving them to a separate trigger is how
      # they would go stale against it. Derived from the just-committed file joined
      # with ga-members.json for the roster check. See scripts/build_sponsorship_slices.py.
      - name: Build per-member sponsorship slices
        run: python scripts/build_sponsorship_slices.py

      - name: Commit per-member sponsorship slices
        run: |
          set -e
          git add -A assets/data/ga-sponsorship-index.json assets/data/ga-sponsorship
          if git diff --cached --quiet; then
            echo "No changes to sponsorship slices"
          else
            git commit -m "Rebuild per-member sponsorship slices"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - sponsorship slices were NOT committed"
              exit 1
            fi
          fi

      # Publish inline so this scheduled update propagates to ga-legislation. The
      # separate publish-ga-bills-to-ga-legislation.yml (on: push) does NOT fire for the
      # commit above: GitHub does not trigger workflows for commits authored by the
      # default GITHUB_TOKEN (recursion guard), so the sibling would otherwise miss every
      # scheduled run — exactly the gap that left the 2026 special session unpublished.
      # Contents-API path of publish_ga_bills.py (GA_BILLS_TOKEN set); mirrors the
      # "Publish votes to ga-legislators repo" step in update-ga-votes.yml. Reuses the
      # same GA_LEGISLATION_PUSH_TOKEN secret the separate workflow uses.
      - name: Publish bills to ga-legislation repo
        env:
          GA_BILLS_TOKEN: ${{ secrets.GA_LEGISLATION_PUSH_TOKEN }}
        run: python3 scripts/publish_ga_bills.py

      # Last on purpose: a step's `if` is evaluated when the runner reaches it,
      # so an `if: failure()` step placed before the failing step never runs at
      # all. Sitting here it catches a tier-1 rejection, any commit or push
      # failure, and a publish failure. The condition is "we have a generated
      # file and are about to lose it": a full refresh is ~5.7k SOAP calls and
      # the output dies with the runner either way.
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-ga-bills
          path: assets/data/ga-bills.json
          if-no-files-found: ignore
          retention-days: 14
