name: Run script tests

# scripts/test_*.py are offline invariant checks (fake fetchers, temp dirs, no
# network, no repo writes). Until now only one of the seven ran in CI, and only
# inside update-current-members.yml — so a change that broke an invariant was
# caught by the next day's data run at the earliest, and six of the suites were
# never run by CI at all. The cross-language slice-format check in
# test_federal_sponsorship.py is the clearest case: it compares constants in
# scripts/lib/federal_sponsorship.py against the copies in
# _includes/entity/federal-legislator.html, and it is only useful if it runs on
# the commit that moves one of them.
#
# Not scheduled, so notify-workflow-failure.yml does not need to watch it
# (scripts/validate_workflow_triggers.py enforces that rule for scheduled
# workflows only); a failure here fails the PR, which is the signal.

on:
  push:
    paths:
      - 'scripts/**.py'
      - '_includes/entity/**.html'
      - '.github/workflows/run-script-tests.yml'
      - 'assets/data/ga-legislator-ledger.json'
      - 'assets/data/ga-bienniums/**'
      - 'assets/data/ga-members.json'
  pull_request:
    paths:
      - 'scripts/**.py'
      - '_includes/entity/**.html'
      - '.github/workflows/run-script-tests.yml'
      - 'assets/data/ga-legislator-ledger.json'
      - 'assets/data/ga-bienniums/**'
      - 'assets/data/ga-members.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run every scripts/test_*.py
        run: |
          # Run them all and report once, rather than stopping at the first
          # failure: when a shared helper breaks several suites, seeing which
          # ones is the diagnosis.
          failed=()
          for t in scripts/test_*.py; do
            echo "::group::$t"
            if python "$t"; then
              echo "PASS $t"
            else
              echo "FAIL $t"
              failed+=("$t")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failing suites: ${failed[*]}"
            exit 1
          fi
          echo "All script test suites passed."

  # The GA legislator page ledger is append-only (a published /ga-legislators/<slug>/ URL
  # must never 404). update-ga-members enforces that on the bot's own commit; this job
  # enforces it on every human push and PR that touches the ledger, the frozen tree, the
  # roster or the scripts behind them. Needs no pip packages.
  ledger-append-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base commit must be reachable to read the old ledger

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate the GA legislator ledger against the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$'                && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              base="$BEFORE_SHA"
            elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              echo "::notice::No usable previous push commit; comparing against HEAD~1."
              base="HEAD~1"
            fi
          else
            base="HEAD"
          fi
          if [ -z "$base" ]; then
            echo "::notice::No base commit to compare against; skipping the append-only check."
            exit 0
          fi
          python scripts/validate_ga_legislator_ledger.py --base-ref "$base"

# No "Check workflow triggers are wired" step here. It used to run
# scripts/validate_workflow_triggers.py, which needs pyyaml to parse the workflow
# files — and this job installs no pip packages on purpose (see the header: these
# suites are offline checks with no network and no third-party deps). So that step
# failed with ModuleNotFoundError on every run it ever reached, and was invisible
# only because an earlier failing step usually stopped the job first.
#
# Nothing is lost: validate-workflows.yml runs the same validator WITH pyyaml, on
# pushes and PRs touching '.github/workflows/**' or the validator itself. The
# invariant it guards lives entirely inside .github/workflows, so those paths
# already catch every change that could break it.
