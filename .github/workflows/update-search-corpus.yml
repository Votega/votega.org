name: Update site search index (daily, 12:00 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    # Daily at 12:00 UTC, after the member/race/bill data workflows run so the
    # index reflects the freshest entity data. Reads committed JSON only -- no
    # external API calls, so it does not consume any API quota.
    - cron: '0 12 * * *'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate search entity index
        id: generate
        run: python scripts/generate_search_corpus.py

      # Two tiers, and the split is the point. Tier 1 is the file against ITSELF
      # -- a metadata.count that disagrees with the records, per-category counts
      # that do not sum to it or do not match the records carrying that category,
      # a record the search box cannot render, the same (title, url) twice. No
      # fact about Georgia can make those true, so they fail the run and nothing
      # is committed. Tier 2 is a category that is empty, vanished, appeared or
      # moved sharply against yesterday's index; every one of those is something
      # the data can legitimately do, so they go to a report and the index is
      # committed anyway.
      #
      # The heredoc this replaces asserted `count >= 200`: a floor on a number the
      # content controls, which discards a good day's index the moment the content
      # legitimately shrinks. Worse, it was blind to the failure it sat nearest.
      # This index is assembled from seven committed entity files, and
      # generate_search_corpus.load() skips a missing one with a warning and
      # carries on -- so a whole CATEGORY (every GA legislator, say) can vanish
      # while the other six still clear 200 records many times over. The old
      # script printed metadata.categories and never looked at it. The signal is
      # per category, and per-category figures are facts the world moves (a chamber
      # emptying, a race set rolling over), so they are reported by name with their
      # before and after, not gated. This runs daily, so each false abort left
      # search stale against the entity data the morning's workflows had just
      # committed. See docs/audits/2026-10-13-data-pipeline-audit.md 2.6, and the
      # header of update-local-government.yml for the first workflow to make this
      # split.
      - name: Validate generated data
        id: validate
        run: |
          python scripts/validate_search_corpus.py assets/data/search-entities.json             --baseline-ref HEAD             --report-out "$RUNNER_TEMP/search-corpus-changes.md"

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/search-entities.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif python scripts/only_keys_changed.py assets/data/search-entities.json metadata.generatedAt; then
            echo "Only metadata.generatedAt changed — skipping redundant commit"
            git restore --staged assets/data/search-entities.json
            git checkout -- assets/data/search-entities.json
          else
            git commit -m "Update site search index"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit, not before: the report describes an index that has
      # already shipped. One issue, refreshed in place. The body is rewritten
      # every run but a comment is only added when the body actually CHANGED --
      # this job is daily and an empty category can stand for weeks, so commenting
      # unconditionally would be a notification every morning.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Search index: category changes"
        run: |
          set -e
          report="$RUNNER_TEMP/search-corpus-changes.md"
          if [ ! -s "$report" ] || grep -qi 'no material change this run' "$report"; then
            echo "No category changes — skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE"             --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            gh issue view "$existing" --json body --jq .body > "$RUNNER_TEMP/current-body.md" || true
            if diff -q "$RUNNER_TEMP/current-body.md" "$report" >/dev/null 2>&1; then
              echo "Issue #$existing already says this — leaving it alone."
              exit 0
            fi
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-search-corpus — the category report changed."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose: a step's `if` is evaluated when the runner reaches it, so
      # an `if: failure()` step placed before the failing step never runs. Sitting
      # here it catches a tier-1 rejection and a commit or push failure. The
      # condition is "we have a generated file and are about to lose it", not just
      # "validation failed": the file dies with the runner either way.
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-search-entities
          path: assets/data/search-entities.json
          if-no-files-found: ignore
          retention-days: 14
