name: Publish GA Executive Orders data

# Requires secret: GA_EXECUTIVE_ORDERS_TOKEN
#   A GitHub token with Contents: write on Votega/ga-executive-orders.
#
# scripts/publish_ga_executive_orders.py reads every ga-executive-orders-<year>.json and
# publishes per-year JSON plus consumer-friendly extras (a consolidated CSV across all
# years, a JSON Schema, and SUMMARY.md) to the target repo via the Contents API.
# Run it locally without the token for a dry run (writes to ./out).

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # publish_ga_executive_orders.py globs ga-executive-orders-*.json and reads
      # eo-text/, so watching only the current year meant the 2020 and 2021
      # backfills did not trigger a publish at all. They reached the sibling repo
      # because the maintainer dispatched this workflow by hand afterwards — the
      # data got there, the automation did not. Prior years are static in normal
      # operation, but a backfill is exactly when they are not.
      - 'assets/data/ga-executive-orders-*.json'
      - 'assets/data/eo-text/**'
      - 'scripts/publish_ga_executive_orders.py'
      - 'scripts/lib/sibling_publish.py'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and publish executive-order artifacts
        env:
          GA_EXECUTIVE_ORDERS_TOKEN: ${{ secrets.GA_EXECUTIVE_ORDERS_TOKEN }}
        run: python3 scripts/publish_ga_executive_orders.py
