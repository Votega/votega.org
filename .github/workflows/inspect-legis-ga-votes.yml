name: Inspect legis.ga.gov vote source (manual)

# Manual, NON-COMMITTING trial of the official-source vote producer
# (scripts/generate_ga_votes_from_legis.py). This does NOT update the site — it
# exists to confirm the remaining live-only unknowns and to produce the parallel
# file for diffing against the Open States output before any cutover.
#
# Requires the repo secret LEGIS_GA_CLIENT_KEY — the PUBLIC client key from the
# legis.ga.gov SPA bundle (the `obscureKey` constant). It is not a user credential;
# the API mints an anonymous ~5-min token from it. Live minting can't run inside the
# Claude Code agent sandbox (credential guardrail), so this CI job is how the first
# real fetch happens.
#
# Manual-only (workflow_dispatch), so it is intentionally NOT listed in
# notify-workflow-failure.yml — that notifier + validate-workflows.yml only require
# SCHEDULED workflows to be watched.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = diagnostics; sample = capped parallel file + upload; classify = passage calibration vs Open States; backfill = propose legisGaGovId fills (all sessions) + upload; list = show sessions"
        type: choice
        options:
          - inspect
          - sample
          - classify
          - backfill
          - list
        default: inspect
      session:
        description: "Session to run (active = the current ACTIVE_SESSION). Add new tags here AND in lib/ga_sessions.py when a session rolls."
        type: choice
        options:
          - active
          - "2026_ss"
          - "2025_26"
        default: active
      sample_size:
        description: "Roll calls to process in sample mode"
        default: "50"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check the client key is configured
        env:
          LEGIS_GA_CLIENT_KEY: ${{ secrets.LEGIS_GA_CLIENT_KEY }}
        run: |
          if [ -z "$LEGIS_GA_CLIENT_KEY" ]; then
            echo "::error::Secret LEGIS_GA_CLIENT_KEY is not set. Add it (the public" \
                 "legis.ga.gov SPA client key) under Settings > Secrets and variables" \
                 "> Actions, then re-run."
            exit 1
          fi

      - name: Run the legis.ga.gov vote producer (non-committing)
        env:
          LEGIS_GA_CLIENT_KEY: ${{ secrets.LEGIS_GA_CLIENT_KEY }}
          MODE: ${{ inputs.mode }}
          SESSION: ${{ inputs.session }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
        run: |
          mkdir -p out
          # "active" means let the producer use its default (ACTIVE_SESSION); any
          # other value is passed through as an explicit --session.
          SESSION_ARG=""
          if [ "$SESSION" != "active" ]; then SESSION_ARG="--session $SESSION"; fi
          if [ "$MODE" = "list" ]; then
            python scripts/generate_ga_votes_from_legis.py --list-sessions
          elif [ "$MODE" = "inspect" ]; then
            python scripts/generate_ga_votes_from_legis.py --inspect $SESSION_ARG
          elif [ "$MODE" = "classify" ]; then
            python scripts/generate_ga_votes_from_legis.py --classify-report $SESSION_ARG --sample "$SAMPLE_SIZE"
          elif [ "$MODE" = "backfill" ]; then
            # Always sweep ALL configured sessions: a legisGaGovId is session-independent,
            # and union coverage is what makes resolution turnover-safe. The `session`
            # input is ignored here. Emits a review proposal (writes no override).
            python scripts/backfill_legis_ids.py --all-sessions --out out/legis-id-backfill.json
          else
            # --allow-partial: if the token endpoint dies mid-sweep, keep the data
            # gathered so far (write + diff + upload it) instead of losing a ~2h run.
            # Safe here because this workflow never commits; a committing cutover job
            # must OMIT the flag so a partial sweep fails loudly instead of shipping.
            python scripts/generate_ga_votes_from_legis.py $SESSION_ARG --sample "$SAMPLE_SIZE" --allow-partial out/ga-member-votes.legis.json
            # Tally-aware diff vs Open States (cutover go/no-go). Only meaningful
            # on a FULL sweep — a small --sample inflates "OS-only" roll calls
            # because legis saw only a slice. Needs the COMMITTED id-crosswalk.json
            # to already carry the backfilled ids (run update-ga-members +
            # build-id-crosswalk first), else resolution regresses to unresolved.
            echo "=== tally-aware diff: legis vs Open States ==="
            python scripts/diff_legis_vs_os_votes.py $SESSION_ARG --legis out/ga-member-votes.legis.json || true
          fi

      - name: Upload the parallel output (sample mode)
        if: ${{ inputs.mode == 'sample' }}
        uses: actions/upload-artifact@v4
        with:
          name: ga-member-votes-legis
          path: out/ga-member-votes.legis.json
          if-no-files-found: error

      - name: Upload the backfill proposal (backfill mode)
        if: ${{ inputs.mode == 'backfill' }}
        uses: actions/upload-artifact@v4
        with:
          name: legis-id-backfill
          path: out/legis-id-backfill.json
          if-no-files-found: error
