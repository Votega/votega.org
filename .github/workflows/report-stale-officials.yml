name: Report stale local officials (monthly)

# Officials are hand-curated with no upstream API, so they never self-refresh
# (unlike the weekly meetings scrape). This turns "remember to re-check" into a
# dated GitHub issue. Three signals feed one tracking issue (see the two scripts):
#   1. report_stale_officials.py — rosters past next_election / old last_reviewed,
#      PLUS executive-order signals (governor vacancy appointments & special-
#      election writs that name a curated county — no network, reads the committed
#      ga-executive-orders-*.json).
#   2. generate_local_officials.py --curated --diff --changes-only — live check of
#      the SoS results API: the most-recent-cycle winners that DON'T match the
#      roster (turnover, stale entries, seats we don't list). Best-effort: it hits
#      results.sos.ga.gov, so a network blip degrades to "no drift section", never
#      a failed run or a false all-clear.
# It never edits data — a human confirms every signal against its source and
# updates _data/local_officials.yml.
permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 1 * *'  # 1st of each month, 13:00 UTC

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: 'Local officials: rosters due for re-verification'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Staleness + executive-order signals
        run: python scripts/report_stale_officials.py > staleness.md

      # Live SoS results check. continue-on-error + the -s/"No results-API drift"
      # guards below mean a network failure produces no drift section rather than
      # a failed run or a spurious issue.
      - name: Results-API drift (best-effort, needs network)
        continue-on-error: true
        run: python scripts/generate_local_officials.py --curated --diff --changes-only > drift.md 2>/dev/null

      - name: Assemble report and open/update the tracking issue
        run: |
          set -e

          stale_ok=false
          head -n1 staleness.md | grep -q '^OK' && stale_ok=true

          # drift_none: no drift file, empty, an error, or the explicit clean line.
          drift_none=true
          if [ -s drift.md ] && ! head -n1 drift.md | grep -qE '^No results-API drift'; then
            drift_none=false
          fi

          if $stale_ok && $drift_none; then
            echo "Nothing due — skipping issue."
            exit 0
          fi

          : > report.md
          if ! $stale_ok; then
            cat staleness.md >> report.md
            echo "" >> report.md
          fi
          if ! $drift_none; then
            echo "### Results-API drift (SoS most-recent winners vs roster)" >> report.md
            echo "_Live SoS results the roster doesn't reflect. \`~\` a seat's name differs (turnover or stale); \`+\` won a recent seat you don't list. Formatting-only near-matches (middle initials, nicknames) can be ignored. Confirm the rest and update the roster._" >> report.md
            echo "" >> report.md
            echo '```' >> report.md
            cat drift.md >> report.md
            echo '```' >> report.md
          fi

          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file report.md
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by report-stale-officials."
          else
            echo "Creating new tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file report.md
          fi
