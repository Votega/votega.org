name: Freeze GA session roster (manual, at sine die)

# Deliberate, once-per-session action. The GA roster (ga-members.json) is built for the
# biennium's REGULAR session, so it turns over in one step the first time the daily run
# sees a new biennium in lib/ga_sessions.SESSION_NAMES — it is NOT archived automatically
# alongside votes. Run this once the session has adjourned sine die and BEFORE that
# session bump lands, to snapshot who served in that General Assembly into
# Votega/ga-legislators sessions/<slug>/.
#
# Since the roster moved to legis.ga.gov this is a deadline we control rather than a race
# against a third party reseating members, so there is no partial-roster window — but by
# the same token nothing warns you: once SESSION_NAMES advances, the outgoing roster is
# one daily run from being replaced. See RECURRING-TASKS.md §3.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      session_slug:
        description: >-
          Session to freeze, e.g. 2025-2026. Leave blank to default to the current
          votes session (derived from ga-member-votes.json's sessionName).
        type: string
        required: false
        default: ''

jobs:
  freeze-roster:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Freeze roster into ga-legislators sessions/<slug>/
        env:
          GA_LEGISLATORS_TOKEN: ${{ secrets.GA_LEGISLATORS_TOKEN }}
        run: python3 scripts/publish_ga_legislators.py freeze-roster "${{ inputs.session_slug }}"
