name: Update FEC campaign finance data (weekly, Sun 08:00 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 0' # weekly on Sunday at 08:00 UTC

jobs:
  update-fec-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch GA FEC data
        run: python scripts/generate_fec_data.py assets/data/ga-fec-data.json
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      - name: Validate generated data
        run: |
          if [ ! -f assets/data/ga-fec-data.json ]; then
            echo "Error: ga-fec-data.json was not generated"
            exit 1
          fi
          python - <<'PY'
          import json, sys

          d = json.load(open('assets/data/ga-fec-data.json'))
          candidates = d.get('candidates', {})
          n          = d['metadata']['totalCandidates']
          by_bio     = d.get('byBioguideId', {})
          house      = [c for c in candidates.values() if c.get('office') == 'H']

          print(f"{n} candidates ({len(house)} House) | {len(by_bio)} mapped to incumbents")

          errors = []
          if n == 0:
              errors.append("no candidates returned")
          if n != len(candidates):
              errors.append(f"metadata.totalCandidates ({n}) != len(candidates) ({len(candidates)})")
          # A House count of exactly 100 means the paginated fetch silently stopped at
          # the FEC's per_page cap and the list is truncated alphabetically.
          if len(house) == 100:
              errors.append("House count is exactly 100 - pagination likely truncated")
          # Incumbents are spread across the alphabet, so a truncated pull drops most of
          # them. GA seats 16 members; require the majority to resolve.
          if len(by_bio) < 12:
              errors.append(f"only {len(by_bio)} incumbents mapped to a bioguide ID (expected >= 12)")

          if errors:
              for e in errors:
                  print(f"Error: {e}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/ga-fec-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GA FEC campaign finance data"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi
