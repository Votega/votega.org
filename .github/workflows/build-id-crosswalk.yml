name: Build ID crosswalk (weekly, Sun 09:15 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

# Reads ga-members.json, current-members.json, ga-campaign-finance.json,
# ga-fec-data.json and races.json — it derives nothing from an API of its own.
# Scheduled after the last of those lands (GA finance, Sun 08:30) so a run always
# sees the week's fresh inputs rather than last week's.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 0'

jobs:
  build-id-crosswalk:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        # The ledger's append-only check compares against HEAD, so it needs the
        # committed baseline — not just the working tree.
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build crosswalk
        id: generate
        run: python scripts/build_id_crosswalk.py

      # One step, one script. The validator gates on the crosswalk contradicting
      # itself or its inputs (a roster member, Georgia federal member or
      # races.json candidate with no record; a vgId shared, renumbered or
      # dropped from the append-only ledger) and REPORTS coverage movement. The
      # `people >= 600` / `keyed >= 550` floors and the 20% shrink gate this
      # replaces were facts about the 2026 cycle (480 of 747 records are ballot
      # candidates) and would have failed every run once races.json moved on;
      # "lost a chunk of what it had" is now the ledger check plus the inputs
      # accounting. See docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate crosswalk
        id: validate
        run: python scripts/validate_id_crosswalk.py --report-out "$RUNNER_TEMP/id-crosswalk-changes.md"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/id-crosswalk.json assets/data/id-crosswalk-ledger.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif git diff --cached --quiet -- assets/data/id-crosswalk-ledger.json \
               && python scripts/only_keys_changed.py assets/data/id-crosswalk.json \
                    metadata.generatedAt; then
            # Nothing was assigned and the crosswalk moved only its timestamp, so
            # committing would add a revision of a ~1.7k-line file that says
            # nothing. This runs weekly, so without the guard the history fills
            # with empty Sundays. The ledger is checked FIRST and separately: it
            # is append-only, so a minted vgId is always material even though it
            # is a different file from the one whose keys we are blanking.
            echo "Only metadata.generatedAt changed - skipping redundant commit"
            git restore --staged assets/data/id-crosswalk.json assets/data/id-crosswalk-ledger.json
            git checkout -- assets/data/id-crosswalk.json assets/data/id-crosswalk-ledger.json
          else
            git commit -m "Update ID crosswalk"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # After the commit: the report describes a record that has already shipped.
      # One issue, refreshed in place; weekly, so the comment is unconditional.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "ID crosswalk: coverage changes and ambiguous matches"
        run: |
          set -e
          report="$RUNNER_TEMP/id-crosswalk-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by build-id-crosswalk."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose (a step's `if` is evaluated when the runner reaches it).
      - name: Preserve the generated files
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-id-crosswalk
          path: |
            assets/data/id-crosswalk.json
            assets/data/id-crosswalk-ledger.json
          if-no-files-found: ignore
          retention-days: 14
