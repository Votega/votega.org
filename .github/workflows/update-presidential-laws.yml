name: Update presidential signed laws data (weekly, Sun 09:45 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      allow_collapse:
        description: 'Commit even though signed laws at HEAD are missing from the new file (only after inspecting the rejected file)'
        type: boolean
        default: false
  schedule:
    # Weekly on Sundays at 09:45 UTC (after federal-votes and vp-tie-votes workflows)
    - cron: '45 9 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate presidential signed laws data
        id: generate
        run: python scripts/generate_presidential_laws.py assets/data/presidential-laws.json
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      # generate_presidential_laws.py rewrites the file fresh, so provenance must
      # be re-applied here each run. Needs a free api.data.gov key (GOVINFO_API_KEY);
      # without it the step falls back to DEMO_KEY, rate-limits after ~30 calls, and
      # leaves the rest unenriched (non-fatal).
      - name: Enrich laws with GovInfo (GPO) provenance
        run: python scripts/enrich_laws_with_govinfo.py assets/data/presidential-laws.json
        env:
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}

      # Tier 1 gates on the file contradicting itself (count, term start, one
      # Congress, no duplicates, GovInfo fields complete). The one baseline gate
      # is the loss check: signed laws are immutable and the file is rebuilt
      # whole, so a (type, number) at HEAD that is gone now means a Congress.gov
      # page failed mid-pagination and truncated the list. A set difference, not
      # the 20% shrink it replaces, which let a 300 -> 250 truncation through
      # (-17%). A new Congress starts empty and is exempt. Lost GovInfo
      # provenance is reported to the step summary. See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate generated data
        id: validate
        env:
          ALLOW_COLLAPSE: ${{ inputs.allow_collapse && '--allow-collapse' || '' }}
        run: |
          python scripts/validate_presidential_laws.py assets/data/presidential-laws.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/presidential-laws-changes.md" \
            $ALLOW_COLLAPSE

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/presidential-laws.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update presidential signed laws data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      - name: Report what changed
        run: |
          report="$RUNNER_TEMP/presidential-laws-changes.md"
          if [ -s "$report" ] && ! grep -q 'No material change this run' "$report"; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Last on purpose (a step's `if` is evaluated when the runner reaches it).
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-presidential-laws
          path: assets/data/presidential-laws.json
          if-no-files-found: ignore
          retention-days: 14
