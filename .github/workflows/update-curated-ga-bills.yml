name: Update curated GA bill votes (Tue/Thu, 08:00 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2,4'  # Tue/Thu 08:00 UTC - kept off Sun/Mon so the Open States
                           # daily quota is not shared with update-ga-bills (Sun) or
                           # update-ga-votes (Mon). See CODEBASE-REVIEW-2026-08-18.md 2.5.

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate curated bill votes data
        run: python scripts/generate_curated_ga_bills.py assets/data/curated-ga-bill-votes.json
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}

      - name: Validate generated data
        run: |
          # Relative floors: a session rollover or an edit to the curated list
          # changes these counts legitimately, so absolute thresholds would go
          # stale. legislatorsWithVotes is the metric a reader actually feels --
          # a legislator missing from every key vote reads as one who never voted.
          # See CODEBASE-REVIEW-2026-08-18.md 1.5.
          python scripts/validate_data_update.py assets/data/curated-ga-bill-votes.json             --metric bills=metadata.count             --metric records=len:bills             --metric coverage=metadata.legislatorsWithVotes             --min bills=1

          python -c "
          import json, sys
          d = json.load(open('assets/data/curated-ga-bill-votes.json'))
          m = d['metadata']
          sitting = m.get('sittingLegislators', 0)
          covered = m.get('legislatorsWithVotes', 0)
          ghosts  = m.get('ghostVoterIds', 0)
          unres   = m.get('unresolvedVoterRows', 0)
          print(f'Coverage: {covered}/{sitting} sitting legislators have a key vote')
          print(f'Unresolved: {ghosts} ghost id(s), {unres} row(s) with no usable id or name')
          if ghosts or unres:
              print('::warning::' + str(ghosts + unres) + ' roll-call row(s) could not be '
                    'attributed to a legislator; their votes are missing from the site.')
          # Every roll call should tally exactly the members it recorded.
          for b in d['bills']:
              for chamber, v in b['votes'].items():
                  roster = len(v['memberVotes'])
                  tally  = sum(x['yea'] + x['nay'] + x['other'] for x in v['partyTally'].values())
                  known  = sum(1 for _ in v['memberVotes'])
                  assert tally <= roster, (
                      f'{b[\"identifier\"]} {chamber}: partyTally {tally} exceeds the '
                      f'{roster}-member roster - the tally is double-counting rows')
          print('All integrity checks passed')
          "

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/curated-ga-bill-votes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update curated GA bill votes data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi
