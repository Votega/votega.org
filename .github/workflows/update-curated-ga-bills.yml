name: Update curated GA bill votes (Tue/Thu, 08:00 UTC)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 2,4'  # Tue/Thu 08:00 UTC - kept off Sun/Mon so the Open States
                           # daily quota is not shared with update-ga-bills (Sun) or
                           # update-ga-votes (Mon). See CODEBASE-REVIEW-2026-08-18.md 2.5.

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate curated bill votes data
        run: python scripts/generate_curated_ga_bills.py assets/data/curated-ga-bill-votes.json
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/curated-ga-bill-votes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update curated GA bill votes data"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi
