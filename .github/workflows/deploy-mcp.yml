name: Deploy MCP server

# The VoteGA MCP Worker (mcp/, served at mcp.votega.org). Tests run in the Workers runtime on
# every PR and push that touches mcp/; a push to main then deploys with Wrangler.
#
# Secrets (repository): CLOUDFLARE_API_TOKEN, a token scoped to "Edit Cloudflare Workers" on
# this account (and the votega.org zone, for the custom-domain route); CLOUDFLARE_ACCOUNT_ID.
# Until both exist the deploy job skips with a notice instead of failing.
#
# The Worker reads its data from www.votega.org/assets/data/mcp/ at request time, so a data or
# index change never needs a Worker deploy; only code in mcp/ does.

on:
  push:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/deploy-mcp.yml"]
  pull_request:
    paths: ["mcp/**", ".github/workflows/deploy-mcp.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=MCP deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so the Worker was not deployed."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.present == 'true'
        run: npm ci
      - if: steps.creds.outputs.present == 'true'
        run: npx wrangler deploy
      - name: Check the live server
        if: steps.creds.outputs.present == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS https://mcp.votega.org/health) && break
            sleep 10
          done
          echo "$body"
          want=$(node -p "require('fs').readFileSync('src/server.ts','utf8').match(/VERSION = \"([^\"]+)\"/)[1]")
          echo "$body" | grep -q "\"version\": \"$want\"" || { echo "::error::mcp.votega.org/health does not report version $want"; exit 1; }
