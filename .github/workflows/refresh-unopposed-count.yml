name: Refresh unopposed-seat count (daily, 07:35 UTC)

# _data/ga_unopposed_seats.json is a pure derivation of races.json: how many of
# the 236 GA legislative seats have no major-party opponent in 2026. The Majority
# Tracker renders it server-side, so it must be rebuilt whenever races.json is
# curated — otherwise the headline number silently goes stale.
#
# Same pattern as refresh-general-placeholder: a schedule AND a push trigger,
# because races.json is also touched by workflows whose GITHUB_TOKEN commits do
# not fire a `push` trigger (the recursion guard).

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * *'
  push:
    branches: [main]
    paths:
      - 'assets/data/races.json'
      - 'scripts/generate_unopposed_seats.py'

jobs:
  refresh:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild the unopposed-seat count
        id: generate
        run: python scripts/generate_unopposed_seats.py

      # Two tiers. Tier 1 is the file against ITSELF: chamber totals that do not
      # sum, a seat list not as long as the unopposed count, a chamber holding
      # more seats than the constitution creates. Nothing about Georgia can make
      # those true, so they fail the run. Tier 2 is what races.json can
      # legitimately say -- a chamber short of 180/56 seats, a seat newly
      # contested -- and is reported while the commit proceeds.
      #
      # The heredoc this replaces asserted `150 <= total <= 260`, a window on a
      # number races.json controls. This runs daily AND on every races.json
      # push, so one gap in the roster discarded the refresh. See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate the rebuild
        run: |
          set -e
          python scripts/validate_unopposed_seats.py _data/ga_unopposed_seats.json             --baseline-ref HEAD             --report-out "$RUNNER_TEMP/unopposed-changes.md"
          # Belt and braces: the file on disk must now agree with races.json.
          python scripts/generate_unopposed_seats.py --check

      - name: Commit and push the refreshed count
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f _data/ga_unopposed_seats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh unopposed-seat count from races.json"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - refreshed count was NOT committed"
              exit 1
            fi
          fi

      # After the commit: the report describes a count that has already shipped.
      # One issue, refreshed in place. This job runs daily and on every
      # races.json push, so a comment is only added when the body CHANGED.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Unopposed seats: material changes"
        run: |
          set -e
          report="$RUNNER_TEMP/unopposed-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material changed - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE"             --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            gh issue view "$existing" --json body --jq .body > "$RUNNER_TEMP/current-body.md" || true
            if diff -q "$RUNNER_TEMP/current-body.md" "$report" >/dev/null 2>&1; then
              echo "Issue #$existing already says this - leaving it alone."
              exit 0
            fi
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by refresh-unopposed-count - the report changed."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Last on purpose (an `if: failure()` step placed earlier never runs).
      # Condition is "we have a generated file and are about to lose it".
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-unopposed-seats
          path: _data/ga_unopposed_seats.json
          if-no-files-found: ignore
          retention-days: 14
