name: Update federal legislative vote data — GA delegation (weekly, Sun 09:00 UTC)

permissions:
  contents: write
  issues: write   # the tier-2 report keeps one refreshed tracking issue

on:
  workflow_dispatch:
    inputs:
      allow_collapse:
        description: 'Commit even though roll calls at HEAD are missing from the new file (only after inspecting the rejected file)'
        type: boolean
        default: false
  schedule:
    # Weekly on Sundays at 09:00 UTC
    - cron: '0 9 * * 0'

jobs:
  update-data:
    runs-on: ubuntu-24.04  # pinned through the 2026 general — see RECURRING-TASKS.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # The index row format is split across Python and the entity include; this
      # fails the run if the two have drifted, before any data is written.
      - name: Check the slice format still matches the entity include
        run: python scripts/test_federal_votes_slices.py

      # No CONGRESS_API_KEY any more: the roll-call universe comes from the
      # chambers' own indexes (clerk.house.gov and senate.gov static XML), so this
      # job makes no Congress.gov API call at all and is off that key's rate limit
      # entirely. The run is incremental — it reuses every roll call already in the
      # committed file and fetches only the ones missing, so a quiet week costs a
      # few dozen requests rather than ~1,600.
      - name: Generate federal vote data
        id: generate
        run: python scripts/generate_federal_votes_data.py assets/data/federal-member-votes.json assets/data/current-members.json

      - name: Build the shared vote index and per-member slices
        run: python scripts/build_federal_votes_slices.py

      # Derived from the roll calls above, so it runs in the same job: a scorecard
      # generated from a different vintage of the vote record than the one being
      # committed would be two sources of truth about the same member.
      - name: Score party unity and participation
        run: python scripts/generate_federal_party_unity.py

      # Tier 1 gates on the monolith contradicting itself (totals vs records,
      # prefix vs chamber, memberVotes naming an unknown roll call). The one
      # baseline gate is the loss check: committed roll calls are immutable and
      # reused, so within a Congress the id set only grows -- an id at HEAD that
      # is gone means a chamber index failed or the reuse layer broke, and it
      # refuses the commit (a set difference, not a percentage). A new Congress
      # legitimately starts empty and is exempt. `--min members=15` was the
      # world's number (a vacancy leaves 15, two leave 14, a new Congress 0);
      # vacancies are now reported by name. See
      # docs/audits/2026-10-13-data-pipeline-audit.md 2.6.
      - name: Validate generated data
        id: validate
        env:
          ALLOW_COLLAPSE: ${{ inputs.allow_collapse && '--allow-collapse' || '' }}
        run: |
          python scripts/validate_federal_votes_monolith.py assets/data/federal-member-votes.json \
            --baseline-ref HEAD \
            --report-out "$RUNNER_TEMP/federal-votes-changes.md" \
            $ALLOW_COLLAPSE

      # Counts cannot see shape. This checks that the fields the page renders are
      # present, that bill/billUrl are null rather than "" on the many roll calls
      # with no associated measure, that both chambers are represented, and that
      # every member's slice still decodes against the shared index.
      #
      # Deliberately no absolute floor on the roll-call count: a Congress starts at
      # zero, and --scope-key only relaxes the DELTA checks on a rollover, so a
      # `--min rollcalls=N` would fail every run for the first year of the 120th —
      # the standing-failure trap CLAUDE.md records against update-ga-bills.yml.
      - name: Validate roll-call structure and slice alignment
        run: |
          python scripts/validate_federal_votes.py \
            assets/data/federal-member-votes.json \
            assets/data/federal-votes-index.json \
            assets/data/federal-votes \
            assets/data/federal-votes-keyvotes.json \
            assets/data/curated-federal-bills.json

      # The scorecard states how loyal a named member of Congress is, so it gets
      # impossibility checks of its own — a rate above 1, an aligned count above
      # its own denominator, a member scored against more roll calls than their
      # chamber held, or a sitting member silently missing.
      - name: Validate the party-unity scorecard
        run: |
          python scripts/validate_federal_party_unity.py \
            assets/data/federal-party-unity.json \
            assets/data/federal-member-votes.json \
            assets/data/current-members.json

      - name: Commit and push generated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/federal-member-votes.json \
                     assets/data/federal-votes-index.json \
                     assets/data/federal-votes \
                     assets/data/federal-votes-keyvotes.json \
                     assets/data/federal-party-unity.json
          # The run-scoped counters move on every run by design (an incremental run
          # fetches a handful, a full refresh ~1,600), so they are listed alongside
          # the timestamp: without them a quiet week would still commit a full
          # revision of the monolith, the index and all 16 slices.
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif python scripts/only_keys_changed.py assets/data/federal-member-votes.json \
                 metadata.generatedAt metadata.rollCallsFetchedThisRun metadata.updateMode; then
            echo "Only run-scoped metadata changed — skipping redundant commit"
            git restore --staged assets/data/federal-member-votes.json \
                                 assets/data/federal-votes-index.json \
                                 assets/data/federal-votes \
                                 assets/data/federal-votes-keyvotes.json \
                                 assets/data/federal-party-unity.json
            git checkout -- assets/data/federal-member-votes.json \
                            assets/data/federal-votes-index.json \
                            assets/data/federal-votes \
                            assets/data/federal-votes-keyvotes.json \
                            assets/data/federal-party-unity.json
          else
            git commit -m "Update federal legislative vote data (GA delegation)"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 3 attempts - generated data was NOT committed"
              exit 1
            fi
          fi

      # Published from here, not left to publish-federal-delegation-to-ga-federal-legislators.yml's
      # `paths` trigger: that trigger watches a file this workflow writes, and
      # GitHub does not fire `push` for a commit authored by the default
      # GITHUB_TOKEN. The standalone workflow had run 4 times in two months — all of them manual,
      # or on a human commit touching the script — while this data updated weekly.
      - name: Publish GA federal delegation to ga-federal-legislators
        env:
          GA_FEDERAL_LEGISLATORS: ${{ secrets.GA_FEDERAL_LEGISLATORS }}
        run: python3 scripts/publish_federal_delegation.py

      # After the commit: the report describes a record that has already shipped.
      # One issue, refreshed in place; weekly, so the comment is unconditional.
      - name: Report what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Federal votes: delegation members with no votes"
        run: |
          set -e
          report="$RUNNER_TEMP/federal-votes-changes.md"
          if [ ! -s "$report" ] || grep -q 'No material change this run' "$report"; then
            echo "Nothing material - skipping issue."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue edit "$existing" --body-file "$report"
            gh issue comment "$existing" --body "Refreshed $(date -u '+%Y-%m-%d') by update-federal-votes."
          else
            echo "Creating tracking issue"
            gh issue create --title "$ISSUE_TITLE" --body-file "$report"
          fi

      # Record that the source was checked this run, even when the data step above skipped
      # committing a quiet run. The stale-stamp rule (assets/scripts/freshness.js) measures
      # from the newer of the data's stamp and this day. success() on purpose: a run that
      # failed must NOT refresh the check date, so a broken job goes stale on its own.
      - name: Record data check date
        if: success()
        run: |
          python scripts/record_data_checked.py federal-member-votes
          bash scripts/commit_freshness.sh "Record federal-member-votes check date"

      # Last on purpose (a step's `if` is evaluated when the runner reaches it).
      - name: Preserve the generated file
        if: failure() && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-federal-member-votes
          path: assets/data/federal-member-votes.json
          if-no-files-found: ignore
          retention-days: 14
